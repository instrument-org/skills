<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TITLE</title>
    <!-- Lineage, so a future share button knows which idea made this file. -->
    <meta name="instrument:idea" content="recommendation-guide@1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Roboto+Serif:opsz,wght@8..144,400;8..144,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />
    <style type="text/tailwindcss">
      /* skin:start */
      /* The one look every idea shares: Studio's light theme as Tailwind tokens.
         A starter inlines this block verbatim inside its <style type="text/tailwindcss">,
         and scripts/check-ideas.ts fails when a starter's copy has drifted.
         `static` matters: without it Tailwind emits only the variables some utility
         on the page uses, so a var(--color-...) in generated SVG can resolve to
         nothing and the fill falls back to black. */
      @import "tailwindcss";

      @theme static {
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Roboto Serif", ui-serif, Georgia, serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

        --radius: 0.5rem;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);

        --shadow-sm:
          0 2px 4px 0 rgb(10 13 18 / 0.04), 0 1px 2px -1px rgb(10 13 18 / 0.06),
          0 0 0 1px rgb(10 13 18 / 0.06);
        --shadow-xl:
          0 12px 24px -4px rgb(10 13 18 / 0.07),
          0 6px 10px -6px rgb(10 13 18 / 0.07), 0 0 0 1px rgb(10 13 18 / 0.06);

        --color-gray-25: #fdfdfc;
        --color-gray-50: #fafaf9;
        --color-gray-100: #f5f5f4;
        --color-gray-200: #e7e5e4;
        --color-gray-300: #d7d3d0;
        --color-gray-400: #a9a29d;
        --color-gray-500: #79716b;
        --color-gray-600: #57534e;
        --color-gray-700: #44403c;
        --color-gray-800: #292524;
        --color-gray-900: #1c1917;
        --color-gray-950: #171412;

        --color-brand-25: #f1f4f2;
        --color-brand-50: #e2eae7;
        --color-brand-100: #c5d5d0;
        --color-brand-200: #9dbfb6;
        --color-brand-300: #6ca89c;
        --color-brand-400: #338c81;
        --color-brand-500: #0e7869;
        --color-brand-600: #0b6056;
        --color-brand-700: #0a4a42;
        --color-brand-800: #093a34;
        --color-brand-900: #082c28;
        --color-brand-950: #051b18;

        --color-error-50: #fbeef0;
        --color-error-100: #f8e4e8;
        --color-error-300: #e197a6;
        --color-error-500: #b4324f;
        --color-error-700: #7a1f30;
        --color-error-900: #3f121a;

        --color-warning-50: #fffaeb;
        --color-warning-100: #fef0c7;
        --color-warning-300: #fec84b;
        --color-warning-500: #f79009;
        --color-warning-700: #b54708;
        --color-warning-900: #7a2e0e;

        --color-success-50: #e9f5eb;
        --color-success-100: #d9f1db;
        --color-success-300: #7dcb87;
        --color-success-500: #29a845;
        --color-success-700: #176229;
        --color-success-900: #0b3216;

        --color-yellow-50: #fdf6e2;
        --color-yellow-100: #fbebc9;
        --color-yellow-300: #f1cc8e;
        --color-yellow-500: #d58f4f;
        --color-yellow-700: #b26747;
        --color-yellow-900: #59301e;

        --color-brown-50: #fcfbf8;
        --color-brown-100: #f6f4f0;
        --color-brown-300: #e8e3da;
        --color-brown-500: #bbaa8e;
        --color-brown-700: #937b5b;
        --color-brown-900: #564538;

        --color-background: #fafaf9;
        --color-foreground: #171412;
        --color-card: #ffffff;
        --color-popover: #ffffff;
        --color-primary: #171412;
        --color-primary-foreground: #ffffff;
        --color-secondary: #f5f5f4;
        --color-secondary-foreground: #292524;
        --color-muted: #f5f5f4;
        --color-muted-foreground: #79716b;
        --color-accent: #e7e5e4;
        --color-accent-foreground: #292524;
        --color-destructive: #b4324f;
        --color-border: #e7e5e4;
        --color-input: #e7e5e4;
        --color-ring: #a9a29d;
      }
      /* skin:end */
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  </head>

  <body class="bg-background font-sans text-foreground antialiased">
    <main class="mx-auto max-w-3xl px-5 py-10 sm:px-8 sm:py-14">
      <!-- Every section below is a slot the shape names. Keep the sections;
           reorder, merge, restyle, and rebuild them freely. Delete this
           comment block and every placeholder before you are done. -->

      <header>
        <p
          class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase"
        >
          Recommendation guide
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: what was being decided, for whom, and the verdict in a
          sentence.
        </p>
      </header>

      <section id="verdict" class="mt-10">
        <!-- The pick, stated so it can be acted on: name, price, the one reason. -->
      </section>

      <section id="who" class="mt-10">
        <!-- Who this is for, and who should read no further. -->
      </section>

      <section id="picks" class="mt-10">
        <!-- Top pick, runner-up, budget, upgrade. Fewer when fewer exist.
             Each card carries the product's photo as an inline data URI. -->
      </section>

      <section id="flaws" class="mt-10">
        <!-- Flaws but not dealbreakers, for the pick. Honest, specific. -->
      </section>

      <section id="criteria" class="mt-10">
        <!-- What mattered, in order, and why. -->
      </section>

      <section id="how" class="mt-10">
        <!-- How the choice was made: what was compared, tested, read. -->
      </section>

      <section id="skipped" class="mt-10">
        <!-- The competition that was considered and set aside, one line each. -->
      </section>

      <footer
        class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground"
      >
        <!-- Sources and provenance: what was read, what is inferred, when. -->
      </footer>
    </main>
  </body>
</html>
