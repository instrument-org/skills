      <dialog
        id="viewer"
        class="m-0 h-dvh max-h-none w-screen max-w-none border-0 bg-[rgb(0_0_0/0.92)] p-0 [overscroll-behavior:contain] backdrop:bg-[rgb(0_0_0/0.92)]"
      >
        <div id="stage" autofocus tabindex="-1"></div>
        <div id="viewer-map" hidden><div class="map-frame"></div><div class="map-view"></div></div>
        <div id="viewer-top">
          <div class="controls">
            <span id="viewer-counter" class="rounded-lg font-mono text-[11px] tabular-nums"></span>
            <button id="viewer-zoom" hidden title="Back to fit (0)" aria-label="Back to fit" class="rounded-lg font-mono text-[11px] tabular-nums"><span data-chrome-text></span><i class="ph ph-x text-sm"></i></button>
          </div>
          <div class="controls">
            <button data-two title="Two frames side by side (T)" aria-label="Two up" aria-pressed="false" class="flex items-center gap-1.5 rounded-lg px-2.5 text-[12px] font-medium">
              <i class="ph ph-columns text-sm"></i><span class="hidden sm:inline" data-chrome-text="Two up"></span>
            </button>
            <button data-marks title="Show the annotations (A)" aria-label="Marks" aria-pressed="false" class="flex items-center gap-1.5 rounded-lg px-2.5 text-[12px] font-medium">
              <i class="ph ph-circle-dashed text-sm"></i><span class="hidden sm:inline" data-chrome-text="Marks"></span>
            </button>
            <button id="viewer-close" title="Close (Esc)" aria-label="Close" class="grid w-8 place-items-center rounded-lg">
              <i class="ph ph-x text-sm"></i>
            </button>
          </div>
        </div>
        <div id="viewer-bottom">
          <div id="viewer-strip" hidden></div>
          <div class="row controls">
            <button data-step="-1" title="Previous frame (←)" aria-label="Previous frame" class="grid place-items-center rounded-lg disabled:opacity-25"><i class="ph ph-caret-left"></i></button>
            <p id="viewer-caption"></p>
            <button data-step="1" title="Next frame (→)" aria-label="Next frame" class="grid place-items-center rounded-lg disabled:opacity-25"><i class="ph ph-caret-right"></i></button>
          </div>
        </div>
        <div class="chrome-hint pointer-events-none absolute top-0 right-0 hidden text-[12px] leading-none text-muted-foreground/70 [color-scheme:dark]"><span class="rounded-bl-md bg-background/80 p-2"></span></div>
      </dialog>

      <!-- Keep type="module". The share copy of this page is taken as the parser reaches the last script in the body, and a module script runs after that, so the copy carries this markup as written rather than as the script changed it. -->
      <script type="module">
        // Every frame is drawn once at the size the thing really is, then shown
        // at whatever scale fits. Nothing here is hand-shrunk and nothing sets a
        // scale: `transform` composites a box laid out once, where `zoom` would
        // re-run layout at the smaller size and let the text re-wrap, so the
        // miniature would stop matching the thing it depicts.

        // Default frame size. A whole desktop window is 1280x800; a phone is
        // 390x844; a panel is whatever it actually measures. States override
        // with their own `w` and `h`.
        const W = 1280;
        const H = 800;
        // Narrowest a tile may be before the grid drops a column.
        const TILE_MIN = 330;

        // ---- the kit -------------------------------------------------------
        // Neutral pieces of software, so a frame is the thing being proposed
        // rather than a shell rebuilt from scratch each time. Call what you need
        // and DELETE THE REST: this is a starting point, not furniture the page
        // has to carry.
        //
        // Write class names out whole. A class assembled by interpolation
        // (`bg-${tone}-500`) is invisible to Tailwind's scanner and silently
        // produces no styles, so pass the finished class: `dot: "bg-warning-500"`.

        /** Placeholder prose. Widths are CSS lengths: bars("100%", "72%"). */
        const bars = (...widths) =>
          widths
            .map((w) => `<div class="h-2.5 rounded-full bg-gray-300" style="width:${w}"></div>`)
            .join("");

        /** A desktop window. */
        const win = (title, inner) => `
          <div class="flex h-full flex-col bg-card">
            <div class="flex h-9 shrink-0 items-center gap-2 border-b border-border bg-background px-3">
              <span class="size-2.5 rounded-full bg-gray-300"></span>
              <span class="size-2.5 rounded-full bg-gray-300"></span>
              <span class="size-2.5 rounded-full bg-gray-300"></span>
              <span class="ml-2 text-xs text-muted-foreground">${title}</span>
            </div>
            <div class="min-h-0 flex-1">${inner}</div>
          </div>`;

        /** A browser, for anything that lives at a URL. */
        const web = (url, inner) => `
          <div class="flex h-full flex-col bg-card">
            <div class="shrink-0 bg-background px-3 pt-2">
              <div class="flex w-64 items-center gap-2 rounded-t-lg bg-card px-3 py-1.5 text-xs text-muted-foreground">
                <i class="ph ph-globe-simple"></i><span class="truncate">${url.replace(/^[^/]*\/\//, "").split("/")[0]}</span>
              </div>
            </div>
            <div class="flex h-10 shrink-0 items-center gap-2 border-b border-border bg-card px-3">
              <i class="ph ph-arrow-left text-base text-gray-400"></i>
              <i class="ph ph-arrow-right text-base text-gray-300"></i>
              <div class="ml-1 flex-1 rounded-full bg-accent px-3 py-1 font-mono text-[11px] text-muted-foreground">${url}</div>
            </div>
            <div class="min-h-0 flex-1">${inner}</div>
          </div>`;

        /** A phone. Draw these at 390x844. */
        const phone = (inner, { time = "9:41" } = {}) => `
          <div class="flex h-full flex-col bg-card">
            <div class="flex h-11 shrink-0 items-center justify-between px-6 pt-1 text-[13px] font-medium">
              <span>${time}</span>
              <span class="flex items-center gap-1 text-xs"><i class="ph ph-cell-signal-full"></i><i class="ph ph-wifi-high"></i><i class="ph ph-battery-full"></i></span>
            </div>
            <div class="min-h-0 flex-1">${inner}</div>
            <div class="flex h-6 shrink-0 items-end justify-center pb-2"><span class="h-1 w-32 rounded-full bg-gray-400"></span></div>
          </div>`;

        /** One piece of UI on its own, floated on the app's ground. Use a
         *  smaller w and h on those states. */
        const panel = (inner) => `
          <div class="grid h-full place-items-center bg-background p-6">
            <div class="w-full rounded-xl border border-border bg-card shadow-xl">${inner}</div>
          </div>`;

        /** Rail, content, and an optional right-hand pane. */
        const shell = (rail, body, aside = "") => `
          <div class="flex h-full">
            ${rail ? `<aside class="w-56 shrink-0 border-r border-border bg-background p-3">${rail}</aside>` : ""}
            <section class="relative min-w-0 flex-1 overflow-hidden">${body}</section>
            ${aside ? `<aside class="w-80 shrink-0 border-l border-border bg-card p-4">${aside}</aside>` : ""}
          </div>`;

        /** A row in the rail. */
        const navItem = (label, { active = false, icon = "ph-circle", badge = "" } = {}) => `
          <div class="flex items-center gap-2.5 rounded-md px-2.5 py-1.5 ${active ? "bg-accent font-medium" : "text-muted-foreground"}">
            <i class="ph ${icon} text-base"></i>
            <span class="flex-1 truncate text-[13px]">${label}</span>
            ${badge ? `<span class="text-[11px] text-muted-foreground">${badge}</span>` : ""}
          </div>`;

        /** A heading above a run of rail items. */
        const group = (text) =>
          `<p class="px-2.5 pt-4 pb-1 text-[10px] font-semibold tracking-[0.1em] text-muted-foreground uppercase">${text}</p>`;

        /** A button. Pass the finished classes, not a tone name. */
        const btn = (label, { cls = "bg-foreground text-background", icon = "", full = false } = {}) => `
          <button class="inline-flex ${full ? "w-full" : ""} items-center justify-center gap-1.5 rounded-lg px-3.5 py-2 text-[13px] font-medium ${cls}">
            ${icon ? `<i class="ph ${icon} text-sm"></i>` : ""}${label}
          </button>`;

        /** A labeled field. `value` fills it, `placeholder` leaves it empty,
         *  `error` puts the message under it and reddens the border. */
        const field = (label, { value = "", placeholder = "", hint = "", error = "" } = {}) => `
          <label class="block">
            <span class="text-[11px] font-medium text-muted-foreground">${label}</span>
            <div class="mt-1 rounded-lg border ${error ? "border-error-500" : "border-input"} bg-card px-3 py-2 text-[13px] ${value ? "" : "text-gray-400"}">${value || placeholder || "&nbsp;"}</div>
            ${error ? `<span class="mt-1 block text-[11px] text-error-700">${error}</span>` : ""}
            ${hint && !error ? `<span class="mt-1 block text-[11px] text-muted-foreground">${hint}</span>` : ""}
          </label>`;

        /** A switch. */
        const toggle = (label, { on = false } = {}) => `
          <div class="flex items-center justify-between gap-4 py-2">
            <span class="text-[13px]">${label}</span>
            <span class="flex h-5 w-9 shrink-0 items-center rounded-full ${on ? "justify-end bg-brand-600" : "bg-gray-300"} p-0.5">
              <span class="size-4 rounded-full bg-white shadow-sm"></span>
            </span>
          </div>`;

        /** A status pill. Pass the finished classes. */
        const chip = (label, cls = "bg-accent text-muted-foreground") =>
          `<span class="inline-block rounded-full px-2 py-0.5 text-[10px] font-medium ${cls}">${label}</span>`;

        /** A data table. Headers are strings; rows are arrays of cells. */
        const grid = (headers, rows) => `
          <table class="w-full text-left text-[12px]">
            <thead><tr class="border-b border-border">${headers
              .map((h) => `<th class="px-3 py-1.5 text-[10px] font-semibold tracking-wide text-muted-foreground uppercase">${h}</th>`)
              .join("")}</tr></thead>
            <tbody>${rows
              .map((cells) => `<tr class="border-b border-border">${cells.map((c) => `<td class="px-3 py-2">${c}</td>`).join("")}</tr>`)
              .join("")}</tbody>
          </table>`;

        /** Nothing here yet. The state everyone forgets to draw. */
        const empty = (icon, title, note) => `
          <div class="grid h-full place-items-center p-8 text-center">
            <div>
              <i class="ph ${icon} text-3xl text-gray-300"></i>
              <p class="mt-3 text-sm font-medium">${title}</p>
              <p class="mx-auto mt-1 max-w-56 text-xs text-muted-foreground">${note}</p>
            </div>
          </div>`;

        // ---- annotations -----------------------------------------------------
        // For the reader, not the product: a pointer on what is being clicked,
        // and a dashed ring with a label, in two colors no interface uses for
        // itself. Orange is a click; violet is what appeared or changed. Put the
        // click on the frame where it happens and let the next frame be the
        // result; when the clicked thing survives into the result, put the click
        // there instead. One click per frame, and never a green row or a check
        // mark standing in for either, because those look like the design.
        //
        // The helpers leave an invisible marker inside the element they name;
        // the ring and tag are drawn after render on a layer over the whole
        // frame (see drawMarks), so the element needs no `relative` and nothing
        // inside the frame can clip them. That layer carries `ann`, the class
        // the marks button switches off, and so must anything you draw by
        // hand: a ring without it stays on when the reader asked for the
        // drawing on its own.

        const TONE = {
          click: { line: "#ea580c", tag: "#c2410c" },
          new: { line: "#8b5cf6", tag: "#6d28d9" },
        };

        /** Marks the element that contains it: `label` is the tag's word, `tone` its color. */
        const ann = (label, tone = "click") => `<i class="mark" data-label="${label}" data-tone="${tone}"></i>`;

        /** Marks the element that contains it as the thing being clicked, with a pointer in the tag. */
        const cursor = `<i class="mark" data-label="click" data-tone="click" data-pointer></i>`;

        /** Wraps a block so it can be marked: a row, a card, a page section. */
        const noted = (inner, label, tone = "click", { pointer = false, cls = "" } = {}) =>
          `<div class="${cls}">${inner}${ann(label, tone)}${pointer ? cursor : ""}</div>`;
        const clickable = (inner, cls = "") => noted(inner, "click", "click", { pointer: true, cls });
        const fresh = (inner, cls = "") => noted(inner, "new", "new", { cls });

        // ---- the frames ------------------------------------------------------
        // Order frames the way you'd walk a teammate through them. Name each one
        // like an artboard ("Choose a plan"), and write its note as one sentence
        // in the first person saying what we're doing on that screen and why.
        // SKILL.md has the full rules for titles and notes.
        //
        // When the frames fall into sets the reader will name back to you
        // (options, the current design, rounds), declare each set here and
        // give its frames `group: "A"`. `mark` is what the reader says: a
        // letter for an option, a word such as "Now", or "" for none. `note`
        // says in one line what the whole set tries. `tone` is optional, one
        // of gray, sky, emerald, amber, rose or indigo; without it sets take
        // colors in order. Leave it empty for a plain sequence.
        const groups = {};

        const states = [
          {
            title: "Screen name",
            note: "Say in one first-person sentence what we're doing on this screen and why.",
            body: win(
              "Application",
              shell(
                group("Section") + navItem("A place", { active: true, icon: "ph-tray" }) + navItem("Another", { icon: "ph-archive" }),
                `<div class="p-6"><div class="space-y-2.5">${bars("100%", "78%", "62%")}</div></div>`,
              ),
            ),
          },
        ];

        // ---- render ----------------------------------------------------------
        // Everything from here down sits in its own block, so the frames above
        // may name a helper `stage` or `layout` without redeclaring one of these
        // and blanking the page with a SyntaxError.
        {
        const rack = document.querySelector("#rack");

        // ---- groups ----------------------------------------------------------
        // A frame in a group is labeled by the group's mark and its place in
        // the group, A2, or "Now 2" for a longer mark. A frame outside any
        // group keeps its plain number.
        const GROUPS = typeof groups === "object" && groups ? groups : {};
        const TONES = ["gray", "sky", "emerald", "amber", "rose", "indigo"];
        const RAMP = TONES.slice(1);
        const groupKeys = [...new Set(states.map((s) => s.group).filter((g) => g in GROUPS))];
        const groupAt = (k) => {
          const g = GROUPS[groupKeys[k]];
          const ramped = groupKeys.slice(0, k).filter((gk) => !TONES.includes(GROUPS[gk].tone)).length;
          return { mark: "", name: "", note: "", ...g, k, tone: TONES.includes(g.tone) ? g.tone : RAMP[ramped % RAMP.length] };
        };
        const groupOf = (i) => (groupKeys.includes(states[i].group) ? groupAt(groupKeys.indexOf(states[i].group)) : null);
        const inGroup = (k) => states.flatMap((s, i) => (s.group === groupKeys[k] ? [i] : []));
        const startsGroup = (i) => Boolean(groupOf(i)) && (i === 0 || states[i - 1].group !== states[i].group);
        const label = (i) => {
          const g = groupOf(i);
          const n = states.slice(0, i + 1).filter((_, j) => (groupOf(j)?.k ?? -1) === (g?.k ?? -1)).length;
          if (!g) return String(n);
          if (!g.mark) return "";
          return g.mark.length === 1 ? `${g.mark}${n}` : `${g.mark} ${n}`;
        };
        // The label as it leads a line of text: "B2 Pricing", "3. Pricing".
        const lead = (i) => (label(i) ? `${label(i)}${groupOf(i) ? " " : ". "}` : "");
        const groupTag = (g, text) =>
          `<span class="tone-${g.tone} tone-tag inline-grid h-[18px] min-w-[18px] place-items-center rounded-[4px] px-1 font-mono text-[11px] leading-none font-semibold">${text}</span>`;
        // A set opens with one slim line across the grid: its mark, its name
        // and its note, so the grid still reads as tiles.
        const heading = (i) => {
          if (!startsGroup(i)) return "";
          const g = groupOf(i);
          return `<div class="col-span-full flex min-w-0 flex-wrap items-center gap-x-2 px-1 text-[12px] leading-5 ${i ? "pt-3" : ""}">${g.mark ? groupTag(g, g.mark) : ""}<span class="font-semibold">${g.name}</span><span class="text-muted-foreground">${g.note}</span></div>`;
        };
        const captionLead = (i) => {
          const g = groupOf(i);
          if (!g) return `${label(i)}. `;
          return label(i) ? `<span class="mr-1 align-[1px]">${groupTag(g, label(i))}</span>` : "";
        };

        // In a caption the number takes a column of its own, so every line of
        // the note starts at the title's left edge. The badge stays inline
        // inside that column to keep the size it has in a line of text.
        rack.innerHTML = states
          .map(
            (state, i) => `${heading(i)}
          <figure class="${groupOf(i) ? `tone-${groupOf(i).tone} tone-edge` : ""} tile m-0 flex flex-col overflow-hidden border-[0.5px] border-border bg-card p-3 break-inside-avoid">
            <div class="slot flex h-[var(--slot-h)] items-center justify-center">
              <div
                class="frame w-[calc(var(--w)*var(--s))] cursor-zoom-in overflow-hidden rounded-sm ring-[0.5px] ring-border h-[calc(var(--h)*var(--s))]"
                data-w="${state.w || W}"
                data-h="${state.h || H}"
                style="--w:${state.w || W}px; --h:${state.h || H}px; --s:0.2"
              >
                <div class="relative w-[var(--w)] origin-top-left scale-[var(--s)] h-[var(--h)]">${state.body}</div>
              </div>
            </div>
            <figcaption class="mt-3 text-xs leading-5 text-muted-foreground/80">
              <span class="font-medium text-foreground/70">${captionLead(i)}${state.title}.</span> ${state.note}
            </figcaption>
          </figure>`,
          )
          .join("");

        // ---- marks -----------------------------------------------------------
        // Measures each marked element against its frame in true-size pixels,
        // so the layer scales with the drawing and the enlarged copy, a clone,
        // carries it along. A narrow thing takes its tag beside it at the right,
        // a wide one above it, a whole pane inside its own corner; each falls
        // back to the next, then to below.
        const MARK_PAD = 5;
        const TAG_H = 18;

        const drawMarks = () => {
          for (const root of rack.querySelectorAll(".frame > *")) {
            root.querySelector(".marks")?.remove();
            const markers = [...root.querySelectorAll("i.mark")];
            if (markers.length === 0) continue;
            const frame = root.parentElement;
            const s = parseFloat(frame.style.getPropertyValue("--s")) || 1;
            const fw = Number(frame.dataset.w);
            const fh = Number(frame.dataset.h);
            const rr = root.getBoundingClientRect();
            // A ring and a pointer on one element draw as one mark.
            const groups = new Map();
            for (const m of markers) {
              const el = m.parentElement;
              const g = groups.get(el) || { el, label: m.dataset.label, tone: m.dataset.tone, pointer: false };
              if ("pointer" in m.dataset) g.pointer = true;
              else Object.assign(g, { label: m.dataset.label, tone: m.dataset.tone });
              groups.set(el, g);
            }
            const layer = document.createElement("div");
            layer.className = "marks ann";
            for (const g of groups.values()) {
              const r = g.el.getBoundingClientRect();
              if (r.width === 0 || r.height === 0) continue;
              const left = (r.left - rr.left) / s - MARK_PAD;
              const top = (r.top - rr.top) / s - MARK_PAD;
              const width = r.width / s + MARK_PAD * 2;
              const height = r.height / s + MARK_PAD * 2;
              const tagW = g.label.length * 7 + (g.pointer ? 15 : 0) + 12;
              const beside = left + width + 6 + tagW <= fw;
              const above = top - TAG_H - 4 >= 0;
              let tagLeft = Math.max(0, Math.min(left, fw - tagW));
              let tagTop = top - TAG_H - 4;
              if (height > 240) {
                tagLeft = left + 8;
                tagTop = top + 8;
              } else if (beside && (width < fw * 0.4 || !above)) {
                tagLeft = left + width + 6;
                tagTop = top + (height - TAG_H) / 2;
              } else if (!above) {
                tagTop = top + height + 4 + TAG_H <= fh ? top + height + 4 : top + 3;
              }
              const tone = TONE[g.tone] || TONE.click;
              layer.insertAdjacentHTML(
                "beforeend",
                `<span class="mark-ring" style="left:${left}px;top:${top}px;width:${width}px;height:${height}px;--line:${tone.line}"></span>` +
                  `<span class="mark-tag" style="left:${tagLeft}px;top:${tagTop}px;--tag:${tone.tag}">${g.pointer ? `<i class="ph ph-cursor"></i>` : ""}<span data-chrome-text="${g.label.replaceAll('"', "&quot;")}"></span></span>`,
              );
              // The Markdown a shared link answers with holds every element's
              // text, hidden or not, so the tag's word is drawn from an
              // attribute like the page's own controls, and the mark reads as
              // this line instead: its word and what it sits on, the element's
              // words or, for an icon alone, the icon's name.
              const words = g.el.textContent.replace(/\s+/g, " ").trim();
              const icons = [...g.el.querySelectorAll("i.ph")].map((i) => /\bph-([\w-]+)/.exec(i.className)?.[1].replaceAll("-", " ")).join(", ");
              const on = words.length > 60 ? `${words.slice(0, 60)}…` : words || icons;
              const note = document.createElement("p");
              note.className = "mark-note";
              note.textContent = `(${g.label} mark${on ? `: ${on}` : ""})`;
              layer.append(note);
            }
            root.appendChild(layer);
          }
        };

        // Idempotent, so it runs at every point text can have moved: now, once
        // the browser Tailwind build has applied, when the fonts settle, and
        // after load.
        drawMarks();
        setTimeout(drawMarks, 250);
        document.fonts?.ready.then(() => setTimeout(drawMarks, 0));
        document.fonts?.addEventListener("loadingdone", drawMarks);
        window.addEventListener("load", () => setTimeout(drawMarks, 300));

        // ---- density ---------------------------------------------------------
        // Fit as many tiles per row as the width allows, then derive each frame's
        // scale from the tile. Nothing ever renders above its true size. The
        // slider in the title bar sets the count instead, from one frame at the
        // full width to four across, or more where the width already fits more.
        const GAP = 8;
        const PAD = 25; // tile padding plus its border
        // The most tiles the slider offers in a row, by the width of the
        // screen: four from a laptop up, three on a tablet held upright, two
        // on a phone on its side, and one on a phone held upright, where the
        // slider hides. Most phones on their side are wider than a tablet held
        // upright, so they are told apart by their short height under a touch
        // pointer instead.
        const MOST = [
          [1024, 4],
          [744, 3],
          [480, 2],
          [0, 1],
        ];
        const sideways = matchMedia("(pointer: coarse) and (orientation: landscape) and (max-height: 500px)");
        const views = document.querySelector("#views");
        const perRow = document.querySelector("#per-row");
        const [oneButton, mostButton] = views.querySelectorAll("button");
        // What the reader set the slider to. Until then the width decides, and
        // goes on deciding as the window changes. Like the open frame, the
        // setting stays through a reload in the same tab.
        const perRowKey = `wireframe-per-row:${location.pathname}:${document.title}`;
        let chosen = 0;
        try {
          chosen = Number(sessionStorage.getItem(perRowKey)) || 0;
        } catch {}
        const choose = (columns) => {
          chosen = columns;
          try {
            sessionStorage.setItem(perRowKey, String(columns));
          } catch {}
          layout();
        };

        const layout = () => {
          const avail = rack.clientWidth;
          if (avail <= 0) return;
          const natural = Math.max(1, Math.floor((avail + GAP) / (TILE_MIN + GAP)));
          let most = MOST.find(([from]) => innerWidth >= from)[1];
          if (sideways.matches) most = Math.min(most, 2);
          // A screen that already fits more than four keeps them.
          if (most === MOST[0][1]) most = Math.max(most, natural);
          const columns = Math.min(chosen || natural, most);
          const single = columns === 1;
          views.hidden = most < 2;
          perRow.max = most;
          perRow.value = columns;
          perRow.style.setProperty("--stops", most);
          perRow.title = single ? "One per row" : `${columns} per row`;
          perRow.setAttribute("aria-valuetext", perRow.title);
          mostButton.title = `${most} per row`;
          // The icon at whichever end the slider rests on lights, as the
          // picked half of a toggle would.
          oneButton.classList.toggle("text-foreground", single);
          mostButton.classList.toggle("text-foreground", columns === most);
          const inner = (avail - GAP * (columns - 1)) / columns - PAD;
          rack.style.setProperty("--cols", columns);
          const frames = [...rack.querySelectorAll(".frame")];
          const widthFit = (frame) => Math.min(inner / Number(frame.dataset.w), 1);
          // In the grid every tile shares one slot height, so captions line up
          // down the whole grid even where frames mix aspect ratios. The slot is
          // as tall as the middle frame of the set drawn at the tile's full
          // width, so a typical frame reaches both edges of its tile and only an
          // unusually tall one is capped by the slot and centered in it.
          const heights = frames.map((frame) => Number(frame.dataset.h) * widthFit(frame)).sort((a, b) => a - b);
          const slot = heights[Math.floor(heights.length / 2)] ?? 0;
          for (const frame of frames) {
            // One column has no row to keep even, so the frame scales by width
            // alone and the slot shrinks to match rather than centering it in a
            // height sized for the grid.
            const fit = single ? widthFit(frame) : Math.min(widthFit(frame), slot / Number(frame.dataset.h));
            const s = Math.max(0.05, fit);
            frame.style.setProperty("--s", s);
            frame.closest(".slot").style.setProperty("--slot-h", `${single ? Number(frame.dataset.h) * s : slot}px`);
          }
        };

        new ResizeObserver(layout).observe(rack);
        layout();

        perRow.addEventListener("input", () => choose(Number(perRow.value)));

        views.addEventListener("click", (event) => {
          const button = event.target.closest("[data-to]");
          if (!button) return;
          choose(Number(perRow[button.dataset.to]));
        });

        // ---- annotations on and off ------------------------------------------
        // One attribute on the body, so the grid and the enlarged copy of a frame
        // answer to the same switch and there is no second state to keep in step.
        // The marks start off, and only data-marks="on" shows them.
        // The frames underneath are the design; this is what was said about them.
        // In the grid the switch is an item in the ⋯ menu; in the viewer it's
        // a button that fills while the marks are on.
        const marksItem = document.querySelector("#marks");
        const viewerMarks = document.querySelector("#viewer [data-marks]");
        const ON = "flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] font-medium border border-transparent bg-accent text-foreground";
        const OFF = "flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] font-medium border border-border text-muted-foreground";

        const paintMarks = () => {
          const on = document.body.dataset.marks === "on";
          marksItem.querySelector("span").dataset.chromeText = on ? "Hide marks" : "Show marks";
          marksItem.setAttribute("aria-label", on ? "Hide marks" : "Show marks");
          viewerMarks.className = on ? ON : OFF;
          viewerMarks.title = on ? "Hide the annotations (A)" : "Show the annotations (A)";
          viewerMarks.setAttribute("aria-pressed", String(on));
        };

        const flipMarks = () => {
          document.body.dataset.marks = document.body.dataset.marks === "on" ? "off" : "on";
          paintMarks();
        };

        marksItem.addEventListener("click", () => {
          document.querySelector("#more-menu").hidePopover();
          flipMarks();
        });
        paintMarks();

        // ---- chrome ----------------------------------------------------------
        // Cmd+. (Ctrl+. off a Mac) hides everything around the frames: the
        // title bar, the source line, the share widget, and the viewer's
        // buttons and caption. Press it again to bring them back. Like the
        // open frame, it stays that way through a reload in the same tab.
        const chromeKey = `wireframe-chrome:${location.pathname}:${document.title}`;
        const flipChrome = () => {
          const off = document.body.dataset.chrome !== "off";
          document.body.dataset.chrome = off ? "off" : "on";
          try {
            if (off) sessionStorage.setItem(chromeKey, "off");
            else sessionStorage.removeItem(chromeKey);
          } catch {}
        };
        try {
          if (sessionStorage.getItem(chromeKey) === "off") document.body.dataset.chrome = "off";
        } catch {}
        const onMac = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform ?? navigator.platform);
        const shortcut = onMac ? "⌘." : "Ctrl+.";
        for (const hint of document.querySelectorAll(".chrome-hint span")) {
          hint.dataset.chromeText = `Press ${shortcut} to show controls`;
        }

        // The ⋯ menu opens under the bar's buttons, lined up with their right
        // edge so it stays inside the window.
        const more = document.querySelector("#more");
        const moreMenu = document.querySelector("#more-menu");
        moreMenu.querySelector("[data-hide-controls] kbd").dataset.chromeText = shortcut;
        moreMenu.addEventListener("beforetoggle", (event) => {
          if (event.newState !== "open") return;
          const button = more.getBoundingClientRect();
          moreMenu.style.top = `${button.bottom + 4}px`;
          moreMenu.style.right = `${document.documentElement.clientWidth - more.parentElement.getBoundingClientRect().right}px`;
        });
        moreMenu.querySelector("[data-hide-controls]").addEventListener("click", () => {
          moreMenu.hidePopover();
          flipChrome();
        });
        // The hint shows when the pointer is over the hint's own box. Both
        // copies sit in the same corner, and while the controls are shown
        // the box measures nothing, so this never fires then.
        const hintBox = document.querySelector(".chrome-hint");
        addEventListener("pointermove", (event) => {
          const box = hintBox.getBoundingClientRect();
          const near = event.clientX >= box.left && event.clientX <= box.right && event.clientY >= box.top && event.clientY <= box.bottom;
          if (near !== document.body.hasAttribute("data-corner")) document.body.toggleAttribute("data-corner", near);
        });
        document.documentElement.addEventListener("pointerleave", () => document.body.removeAttribute("data-corner"));

        // ---- enlarge ---------------------------------------------------------
        // Everything is reachable by tap as well as by key: prev and next
        // buttons, a horizontal swipe, an explicit close. On a phone there is no
        // hover and no Escape to fall back on.
        const viewer = document.querySelector("#viewer");
        const stage = document.querySelector("#stage");
        const viewerTop = document.querySelector("#viewer-top");
        const viewerBottom = document.querySelector("#viewer-bottom");
        const viewerCaption = document.querySelector("#viewer-caption");
        const viewerCounter = document.querySelector("#viewer-counter");
        const viewerMap = document.querySelector("#viewer-map");
        const viewerZoom = document.querySelector("#viewer-zoom");
        const coarse = matchMedia("(pointer: coarse)");
        // A phone on its side has little height to give the frame.
        const short = matchMedia("(max-height: 500px)");
        let openIndex = -1;

        const frameOf = () => stage.querySelector(".frame");
        const sizeOf = (frame = frameOf()) => ({ w: Number(frame.dataset.w), h: Number(frame.dataset.h) });
        // The bands over the stage. The frame fits between them, so their
        // heights are part of every measurement; they keep their height while
        // hidden, so hiding them moves nothing. The bottom band is measured
        // with the caption folded, so a note opened to read never moves the
        // frame. A phone on its side gives the frame the top strip too: the
        // controls there keep to the corners, clear of a frame centered at
        // fit.
        const topReserve = () => (short.matches ? 0 : viewerTop.offsetHeight);
        let bottomH = 0;
        const measureBand = () => {
          const open = viewerBottom.hasAttribute("data-open");
          viewerBottom.toggleAttribute("data-open", false);
          bottomH = viewerBottom.offsetHeight;
          viewerBottom.toggleAttribute("data-more", viewerCaption.scrollHeight > viewerCaption.clientHeight + 1);
          viewerBottom.toggleAttribute("data-open", open);
          viewer.style.setProperty("--bottom-h", `${bottomH}px`);
        };
        const bands = () => ({ top: topReserve(), bottom: bottomH });
        // Room round the frame at fit: none on a phone, where every pixel of
        // width is the drawing's.
        const pad = () => (innerWidth < 640 || short.matches ? 0 : 16);
        const fitScale = (frame = frameOf()) => {
          const { w, h } = sizeOf(frame);
          const top = topReserve();
          const bottom = bottomH;
          const p = pad();
          return Math.max(0.05, Math.min((stage.clientWidth - p * 2) / w, (stage.clientHeight - top - bottom - p * 2) / h));
        };

        // ---- the caption and the thumbnail -----------------------------------
        // The caption keeps to two lines, and a tap on it opens the whole
        // note over the frame, as tall as two fifths of the screen if it
        // must be, until the next tap or the next frame. The thumbnail
        // appears while the frame is zoomed.
        viewerCaption.addEventListener("click", () => {
          // A drag that selected some of the note is not a tap on it.
          if (getSelection()?.toString()) return;
          viewerBottom.toggleAttribute("data-open", !viewerBottom.hasAttribute("data-open"));
        });

        // The thumbnail is a third copy of the frame, drawn at the width the
        // map has, with the part on screen boxed. `window` is the visible
        // part in the frame's own pixels.
        const paintMap = (zoomed, window) => {
          const frame = frameOf();
          if (!frame || !zoomed) {
            viewerMap.hidden = true;
            return;
          }
          const { w, h } = sizeOf(frame);
          const mw = coarse.matches ? 88 : 120;
          const ms = mw / w;
          viewerMap.hidden = false;
          if (viewerMap.dataset.for !== String(openIndex)) {
            viewerMap.dataset.for = String(openIndex);
            const copy = frame.cloneNode(true);
            copy.style.setProperty("--s", ms);
            copy.style.transform = "";
            viewerMap.querySelector(".map-frame").replaceChildren(copy);
            viewerMap.style.width = `${mw}px`;
            viewerMap.style.height = `${h * ms}px`;
          }
          const box = viewerMap.querySelector(".map-view");
          const x0 = Math.max(0, window.x0);
          const y0 = Math.max(0, window.y0);
          box.style.left = `${x0 * ms}px`;
          box.style.top = `${y0 * ms}px`;
          box.style.width = `${(Math.min(w, window.x1) - x0) * ms}px`;
          box.style.height = `${(Math.min(h, window.y1) - y0) * ms}px`;
        };
        // A tap or a drag on the map puts that spot in the middle of the screen.
        const mapPoint = (event) => {
          const r = viewerMap.getBoundingClientRect();
          const { w } = sizeOf();
          const ms = r.width / w;
          return { fx: (event.clientX - r.left) / ms, fy: (event.clientY - r.top) / ms };
        };
        viewerMap.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
          viewerMap.setPointerCapture(event.pointerId);
          lookAt(mapPoint(event));
        });
        viewerMap.addEventListener("pointermove", (event) => {
          if (event.buttons) lookAt(mapPoint(event));
        });

        // The scale shows only while the frame is zoomed, and a tap on it
        // is the way back to fit.
        const paintReadout = (zoomed) => {
          viewerZoom.hidden = !zoomed;
          if (zoomed) viewerZoom.firstElementChild.dataset.chromeText = `${Math.round(view.s * 100)}%`;
        };
        viewerZoom.addEventListener("click", () => toFit(true));

        // The point to open at true size: the frame's first mark if it has
        // one, since that is what the frame is about, else its middle.
        const focusPoint = () => {
          const frame = frameOf();
          const { w, h } = sizeOf(frame);
          const ring = frame.querySelector(".mark-ring");
          if (!ring) return { fx: w / 2, fy: h / 2 };
          return {
            fx: parseFloat(ring.style.left) + parseFloat(ring.style.width) / 2,
            fy: parseFloat(ring.style.top) + parseFloat(ring.style.height) / 2,
          };
        };

        // ---- opening a frame -------------------------------------------------
        const showFrame = (index) => {
          const state = states[index];
          const tile = rack.querySelectorAll(".frame")[index];
          if (!tile) return;
          const before = frameOf() ? sizeOf() : null;
          openIndex = index;
          const copy = tile.cloneNode(true);
          stage.querySelector(".frame")?.remove();
          mount(copy);
          const g = groupOf(index);
          const tagged = g && label(index) ? `<span class="tag-slot">${groupTag(g, label(index))}</span>` : lead(index);
          viewerCaption.innerHTML = `<span class="font-medium">${tagged}${state.title}.</span> ${state.note}`;
          viewerCounter.textContent = `${index + 1} / ${states.length}`;
          paintStrip(index);
          if (!viewer.open) viewer.showModal();
          viewerBottom.removeAttribute("data-open");
          measureBand();
          viewerMap.dataset.for = "";
          // A frame the size of the last keeps the view, so a set that walks
          // one screen through its states is read at one spot across them.
          // Any other size opens at fit.
          const same = before && before.w === Number(copy.dataset.w) && before.h === Number(copy.dataset.h);
          if (same) relayout();
          else toFit(false);
          // Replaced rather than pushed, so walking the set leaves one history
          // entry and the address bar always holds a link to the frame on screen.
          setFrameParam(index + 1);
          keepFrame(index);
          describe(index);
        };

        const step = (delta) => showFrame((openIndex + delta + states.length) % states.length);

        // ---- the strip -------------------------------------------------------
        // Only a page with groups has one. Every frame gets a bar, in page
        // order, in runs: a group's frames in its color, and frames outside
        // any group, such as a lead-in shared by every option, in a neutral
        // run of their own. A tap on a bar opens that frame.
        const viewerStrip = document.querySelector("#viewer-strip");
        function paintStrip(index) {
          viewerStrip.hidden = groupKeys.length === 0;
          if (viewerStrip.hidden) return;
          const runs = [];
          states.forEach((_, i) => {
            const g = groupOf(i);
            const last = runs.at(-1);
            if (last && last.k === (g?.k ?? -1)) last.frames.push(i);
            else runs.push({ k: g?.k ?? -1, tone: g ? `tone-${g.tone}` : "tone-plain", frames: [i] });
          });
          const g = groupOf(index);
          const name = g ? `<span class="name tone-${g.tone}">${g.name}</span>` : "";
          viewerStrip.innerHTML = `<div class="bars">${name}${runs
            .map(
              (run) =>
                `<span class="run ${run.tone}">${run.frames
                  .map((i) => `<button data-go="${i}" title="${lead(i)}${states[i].title}" aria-label="${lead(i)}${states[i].title}" class="${i < index ? "passed" : ""}"${i === index ? ' aria-current="true"' : ""}></button>`)
                  .join("")}</span>`,
            )
            .join("")}</div>`;
        }
        viewerStrip.addEventListener("click", (event) => {
          const bar = event.target.closest("[data-go]");
          if (bar) showFrame(Number(bar.dataset.go));
        });

        // Up and down open the same place in the set before or after, so A2
        // goes to B2 and one screen can be compared across the options.
        const hop = (delta) => {
          const g = groupOf(openIndex);
          if (!g || groupKeys.length < 2) return;
          const at = inGroup(g.k).indexOf(openIndex);
          const next = inGroup((g.k + delta + groupKeys.length) % groupKeys.length);
          showFrame(next[Math.min(at, next.length - 1)]);
        };

        // ---- two up ----------------------------------------------------------
        // T in the enlarged view puts a second frame beside the open one. Left
        // and right step both, and up and down move the right one to the same
        // place in another set, so Now 2 can sit beside A2, then B2. A zoom
        // key, or a tap on either frame, goes back to that one frame alone,
        // where the zoom works.
        const pair = document.createElement("div");
        pair.id = "pair";
        pair.hidden = true;
        viewer.append(pair);
        const twoButton = viewerTop.querySelector("[data-two]");
        let twoUp = false;
        let offset = 1;
        const partner = () => Math.min(states.length - 1, Math.max(0, openIndex + (offset || 1)));
        const pane = (i) => {
          const g = groupOf(i);
          const copy = rack.querySelectorAll(".frame")[i].cloneNode(true);
          return `<figure class="pane" data-index="${i}"><figcaption class="pane-head">${g && label(i) ? `<span class="tag-slot">${groupTag(g, label(i))}</span>` : lead(i)}<span class="font-medium">${states[i].title}.</span> <span class="opacity-70">${states[i].note}</span></figcaption><div class="pane-slot">${copy.outerHTML}</div></figure>`;
        };
        const paintPair = () => {
          if (!twoUp || openIndex < 0) return;
          const right = partner();
          pair.style.top = `${topReserve()}px`;
          pair.style.bottom = `${bottomH}px`;
          pair.innerHTML = pane(openIndex) + pane(right);
          for (const slot of pair.querySelectorAll(".pane-slot")) {
            const f = slot.firstElementChild;
            f.style.transform = "";
            f.style.setProperty("--s", 0.01);
            const s = Math.min(slot.clientWidth / Number(f.dataset.w), slot.clientHeight / Number(f.dataset.h));
            f.style.setProperty("--s", s);
          }
          for (const b of viewerStrip.querySelectorAll("[data-go]")) b.classList.toggle("partner", Number(b.dataset.go) === right);
          viewerCaption.innerHTML = `<span class="font-medium">Two up.</span> Left and right step both frames. Up and down move the right one to the same place in another set.`;
        };
        // On a page of sets the right side starts at the same place in the
        // next set, so the first view is the comparison; otherwise it is the
        // next frame.
        const firstPartner = () => {
          const g = groupOf(openIndex);
          if (!g || groupKeys.length < 2) return 1;
          const at = inGroup(g.k).indexOf(openIndex);
          const next = inGroup((g.k + 1) % groupKeys.length);
          return next[Math.min(at, next.length - 1)] - openIndex;
        };
        function setTwoUp(on) {
          if (on && (states.length < 2 || innerWidth <= 640)) return;
          twoUp = on;
          offset = on ? firstPartner() : 1;
          pair.hidden = !on;
          viewer.toggleAttribute("data-two", on);
          twoButton.setAttribute("aria-pressed", String(on));
          if (on) {
            toFit(false);
            paintPair();
          } else showFrame(openIndex);
        }
        pair.addEventListener("click", (event) => {
          const chosen = event.target.closest(".pane");
          if (!chosen) return;
          setTwoUp(false);
          showFrame(Number(chosen.dataset.index));
        });
        new MutationObserver(() => requestAnimationFrame(paintPair)).observe(viewerCounter, { childList: true, characterData: true, subtree: true });
        addEventListener("resize", () => requestAnimationFrame(paintPair));
        viewer.addEventListener("close", () => {
          if (!twoUp) return;
          twoUp = false;
          pair.hidden = true;
          viewer.removeAttribute("data-two");
          twoButton.setAttribute("aria-pressed", "false");
        });
        document.addEventListener(
          "keydown",
          (event) => {
            if (!viewer.open || event.metaKey || event.ctrlKey || event.altKey) return;
            if (event.key === "t" || event.key === "T") {
              event.preventDefault();
              return setTwoUp(!twoUp);
            }
            if (twoUp && zoomKeys.has(event.key)) return setTwoUp(false);
            if (!twoUp || (event.key !== "ArrowUp" && event.key !== "ArrowDown")) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            const right = partner();
            const g = groupOf(right);
            if (!g || groupKeys.length < 2) return;
            const at = inGroup(g.k).indexOf(right);
            const next = inGroup((g.k + (event.key === "ArrowDown" ? 1 : -1) + groupKeys.length) % groupKeys.length);
            offset = next[Math.min(at, next.length - 1)] - openIndex;
            paintPair();
          },
          true,
        );

        rack.addEventListener("click", (event) => {
          const frame = event.target.closest(".frame");
          if (!frame) return;
          showFrame([...rack.querySelectorAll(".frame")].indexOf(frame));
        });

        viewer.addEventListener("click", (event) => {
          const button = event.target.closest(".controls button");
          if (!button) return;
          if (button.dataset.marks !== undefined) return flipMarks();
          if (button.dataset.two !== undefined) return setTwoUp(!twoUp);
          if (button.dataset.step) return step(Number(button.dataset.step));
          if (button.id === "viewer-close") viewer.close();
        });

        viewer.addEventListener("close", () => {
          openIndex = -1;
          stage.querySelector(".frame")?.remove();
          viewer.removeAttribute("data-controls");
        });

        // A tap on the ground hides the bands and brings them back; a double
        // tap zooms in at that spot, or back to fit. A mouse keeps the
        // desktop's ways: a click on the ground closes, a double click on
        // the frame zooms.
        let tapTimer = 0;
        let lastTap = null;
        const tapped = (type, p, onFrame) => {
          if (type === "mouse") {
            if (!onFrame) viewer.close();
            return;
          }
          const now = performance.now();
          if (lastTap && now - lastTap.t < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40) {
            clearTimeout(tapTimer);
            lastTap = null;
            return doubleTap(p);
          }
          lastTap = { t: now, ...p };
          tapTimer = setTimeout(() => {
            lastTap = null;
            viewer.dataset.controls = viewer.dataset.controls === "hidden" ? "shown" : "hidden";
          }, 320);
        };
        // A double tap on a touch screen is handled above; some browsers also
        // send it as a double click, which must not undo it.
        let lastType = "mouse";
        stage.addEventListener("pointerdown", (event) => (lastType = event.pointerType), true);
        stage.addEventListener("dblclick", (event) => {
          if (lastType !== "mouse") return;
          doubleTap(local(event));
        });
        const local = (event) => {
          const r = stage.getBoundingClientRect();
          return { x: event.clientX - r.left, y: event.clientY - r.top };
        };

        // Safari announces a pinch of the page with its own events as well;
        // declining them is what keeps the page from zooming under the viewer.
        for (const name of ["gesturestart", "gesturechange"]) {
          viewer.addEventListener(name, (event) => event.preventDefault(), { passive: false });
        }

        // The zoom keys of a canvas: + and − step the scale, 0 fits, 1 is
        // true size. Cmd or Ctrl may be held for all but 1, since those are
        // the browser's keys for zooming the page, which must not happen
        // under the viewer. Cmd+1 stays the browser's.
        const zoomKeys = new Map([
          ["0", () => toFit(true)],
          ["1", () => toTrue(focusPoint())],
          ["=", () => zoomBy(1.25)],
          ["+", () => zoomBy(1.25)],
          ["-", () => zoomBy(1 / 1.25)],
          ["_", () => zoomBy(1 / 1.25)],
        ]);
        document.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === ".") {
            event.preventDefault();
            return flipChrome();
          }
          if (event.target?.closest?.("input, textarea, select, [contenteditable]")) return;
          const zoom = viewer.open && !event.altKey ? zoomKeys.get(event.key) : undefined;
          if (zoom && !(event.key === "1" && (event.metaKey || event.ctrlKey))) {
            event.preventDefault();
            return zoom();
          }
          // With Cmd, Ctrl or Alt held the key belongs to the browser: select
          // all, back and forward.
          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (event.key === "a" || event.key === "A") {
            event.preventDefault();
            return flipMarks();
          }
          if (viewer.open && (event.key === "ArrowUp" || event.key === "ArrowDown") && groupOf(openIndex)) {
            event.preventDefault();
            return hop(event.key === "ArrowDown" ? 1 : -1);
          }
          if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
          // From the rack, right opens the set at its first frame, so the whole
          // set can be walked from the keyboard without reaching for a pointer.
          // Nothing sits behind that frame, so left has nothing to do there.
          if (!viewer.open) {
            if (event.key === "ArrowLeft") return;
            event.preventDefault();
            return showFrame(0);
          }
          event.preventDefault();
          step(event.key === "ArrowRight" ? 1 : -1);
        });

        // The stage, not the window: this also catches the page being laid out
        // for the first time after being hidden, which fires no resize event.
        new ResizeObserver(() => {
          if (viewer.open && frameOf()) relayout();
        }).observe(stage);

        // ---- the view: pinch, wheel, drag, double tap and keys ---------------
        // The frame's scale and where its top-left corner sits on the stage.
        // The view never goes below fit, and above it the frame can reach
        // four times its true size. A pinch scales the frame about the
        // fingers and a wheel with Cmd or Ctrl held about the pointer, a
        // drag moves it and keeps going for a moment when let go, a double
        // tap zooms in at that spot and back, and the zoom keys step the
        // scale about the middle of the screen.
        const view = { s: 1, x: 0, y: 0 };
        // The scale the frame's content was last drawn at. While the scale
        // moves, the compositor scales that drawing, which is cheap enough
        // for every frame of a pinch; at rest the content is drawn again at
        // the view's scale, so it is sharp.
        let raster = 1;
        // Whether the view is above fit. Set by the gestures and by the moves
        // to fit, never read off the view while it moves, so a glide through
        // fit cannot show and hide the thumbnail on the way.
        let isZoomed = false;
        const maxScale = () => Math.max(4, fitScale());
        const setZoomed = (z) => {
          isZoomed = z;
        };

        const mount = (copy) => {
          raster = view.s;
          copy.style.setProperty("--s", raster);
          copy.style.transform = `translate(${view.x}px, ${view.y}px)`;
          stage.appendChild(copy);
        };

        // Where the frame may sit at a scale: centered between the bands while
        // it fits there, else anywhere that leaves no edge short of them, so
        // every part of the frame can be brought into the clear.
        const clamp = (v) => {
          const { w, h } = sizeOf();
          const { top, bottom } = bands();
          const fw = w * v.s;
          const fh = h * v.s;
          const W = stage.clientWidth;
          const safeH = stage.clientHeight - top - bottom;
          v.x = fw <= W ? (W - fw) / 2 : Math.min(0, Math.max(W - fw, v.x));
          v.y = fh <= safeH ? top + (safeH - fh) / 2 : Math.min(top, Math.max(top + safeH - fh, v.y));
          return v;
        };

        // Applies the view as it stands.
        const place = () => {
          const frame = frameOf();
          if (!frame) return;
          clamp(view);
          frame.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s / raster})`;
          paintReadout(isZoomed);
          const { top, bottom } = bands();
          paintMap(isZoomed, {
            x0: -view.x / view.s,
            y0: (top - view.y) / view.s,
            x1: (stage.clientWidth - view.x) / view.s,
            y1: (stage.clientHeight - bottom - view.y) / view.s,
          });
        };

        // Draws the content again at the view's scale once the scale has
        // come to rest. `rerasterSoon` waits out a wheel still turning.
        let rasterTimer = 0;
        const reraster = () => {
          clearTimeout(rasterTimer);
          rasterTimer = 0;
          const frame = frameOf();
          if (!frame || raster === view.s) return;
          raster = view.s;
          frame.style.setProperty("--s", raster);
          place();
        };
        const rerasterSoon = () => {
          clearTimeout(rasterTimer);
          rasterTimer = setTimeout(reraster, 150);
        };

        // After a gesture moved the scale: above fit the view is zoomed; at
        // fit it is fit exactly, with the caption open.
        const settle = () => {
          const fit = fitScale();
          setZoomed(view.s > fit * 1.001);
          if (!isZoomed) view.s = fit;
          place();
        };

        // After the stage, the bands or the caption changed size: a view at
        // fit fits again, a zoomed one keeps its scale and stays in bounds.
        const relayout = () => {
          measureBand();
          if (!isZoomed) view.s = fitScale();
          place();
          reraster();
        };

        // A short glide between two views, so a jump reads as a move. `then`
        // runs once it lands.
        let glideId = 0;
        const stopGlide = () => {
          cancelAnimationFrame(glideId);
          glideId = 0;
        };
        const glide = (target, animate, then) => {
          stopGlide();
          stopFling();
          stopWheel();
          const land = () => {
            Object.assign(view, target);
            then?.();
            place();
            reraster();
          };
          if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return land();
          const from = { ...view };
          const t0 = performance.now();
          const tick = (t) => {
            const k = Math.min(1, (t - t0) / 220);
            if (k >= 1) {
              glideId = 0;
              return land();
            }
            const e = 1 - (1 - k) ** 3;
            view.s = from.s + (target.s - from.s) * e;
            view.x = from.x + (target.x - from.x) * e;
            view.y = from.y + (target.y - from.y) * e;
            place();
            glideId = requestAnimationFrame(tick);
          };
          glideId = requestAnimationFrame(tick);
        };

        // Back to fit. The thumbnail goes once the frame has landed.
        const toFit = (animate) => glide(clamp({ s: fitScale(), x: 0, y: 0 }), animate, () => setZoomed(false));
        // The middle of the clear part of the screen, between the bands.
        const clearCenter = () => {
          const { top, bottom } = bands();
          return { x: stage.clientWidth / 2, y: top + (stage.clientHeight - top - bottom) / 2 };
        };
        // True size with the frame point (fx, fy) in the middle of the clear
        // part of the screen.
        const toTrue = ({ fx, fy }) => {
          const s = Math.max(1, fitScale());
          // A screen that shows the frame at true size or above is at it already.
          if (s <= fitScale() * 1.001) return toFit(true);
          setZoomed(true);
          const c = clearCenter();
          glide(clamp({ s, x: c.x - fx * s, y: c.y - fy * s }), true);
        };
        const lookAt = ({ fx, fy }) => {
          const c = clearCenter();
          view.x = c.x - fx * view.s;
          view.y = c.y - fy * view.s;
          place();
        };
        // The frame point under a stage point.
        const pointAt = (p) => ({ fx: (p.x - view.x) / view.s, fy: (p.y - view.y) / view.s });
        // Scales about a stage point, keeping the frame point under it there.
        // A scale at or under fit is fit.
        const zoomTo = (s, p, animate) => {
          s = Math.min(maxScale(), Math.max(fitScale(), s));
          if (s <= fitScale() * 1.001) return toFit(animate);
          setZoomed(true);
          const k = s / view.s;
          glide(clamp({ s, x: p.x - (p.x - view.x) * k, y: p.y - (p.y - view.y) * k }), animate);
        };
        // One step of the zoom keys, about the middle of the clear part.
        const zoomBy = (k) => zoomTo(view.s * k, clearCenter(), true);
        // A double tap or click: back to fit from above it; else in, to true
        // size, or to twice fit where true size is no larger, about the spot.
        const doubleTap = (p) => (isZoomed ? toFit(true) : zoomTo(Math.max(1, fitScale() * 2), p, true));

        // ---- fingers ---------------------------------------------------------
        const pointers = new Map();
        let gesture = null;
        let flingId = 0;
        const stopFling = () => {
          cancelAnimationFrame(flingId);
          flingId = 0;
        };
        const pinchOf = () => {
          const [a, b] = [...pointers.values()];
          return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        };
        const startPan = (p, type, moved, onFrame = false) => ({ kind: "pan", type, onFrame, x0: p.x, y0: p.y, x: p.x, y: p.y, t: performance.now(), vx: 0, vy: 0, moved, slide: 0 });

        stage.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          stage.setPointerCapture(event.pointerId);
          const p = local(event);
          pointers.set(event.pointerId, p);
          stopFling();
          stopGlide();
          stopWheel();
          if (pointers.size === 1) gesture = startPan(p, event.pointerType, false, Boolean(event.target.closest(".frame")));
          else if (pointers.size === 2) {
            const m = pinchOf();
            gesture = { kind: "pinch", d0: m.d, s0: view.s, fx: (m.x - view.x) / view.s, fy: (m.y - view.y) / view.s };
          }
        });

        stage.addEventListener("pointermove", (event) => {
          if (!pointers.has(event.pointerId) || !gesture) return;
          const p = local(event);
          pointers.set(event.pointerId, p);
          if (gesture.kind === "pinch") {
            if (pointers.size !== 2) return;
            const m = pinchOf();
            // The frame point that was between the fingers stays between them.
            view.s = Math.min(maxScale(), Math.max(fitScale(), (gesture.s0 * m.d) / gesture.d0));
            view.x = m.x - gesture.fx * view.s;
            view.y = m.y - gesture.fy * view.s;
            return settle();
          }
          const dx = p.x - gesture.x;
          const dy = p.y - gesture.y;
          const now = performance.now();
          const dt = Math.max(1, now - gesture.t);
          gesture.vx = 0.7 * (dx / dt) + 0.3 * gesture.vx;
          gesture.vy = 0.7 * (dy / dt) + 0.3 * gesture.vy;
          gesture.x = p.x;
          gesture.y = p.y;
          gesture.t = now;
          if (!gesture.moved && Math.hypot(p.x - gesture.x0, p.y - gesture.y0) < 6) return;
          gesture.moved = true;
          if (!isZoomed) {
            // At fit there is nowhere to go, so a sideways drag slides the frame
            // with the finger, as the start of a swipe to the next one.
            gesture.slide += dx;
            frameOf().style.transform = `translate(${view.x + gesture.slide / 2}px, ${view.y}px)`;
            return;
          }
          view.x += dx;
          view.y += dy;
          place();
        });

        const release = (event) => {
          if (!pointers.has(event.pointerId)) return;
          pointers.delete(event.pointerId);
          const g = gesture;
          if (!g) return;
          if (g.kind === "pinch") {
            // The finger still down carries on as a drag.
            if (pointers.size === 1) {
              const [p] = pointers.values();
              gesture = startPan(p, event.pointerType, true);
            } else gesture = null;
            reraster();
            return;
          }
          gesture = null;
          if (event.type === "pointercancel") return place();
          if (!g.moved) return tapped(g.type, { x: g.x0, y: g.y0 }, g.onFrame);
          if (!isZoomed) {
            if (states.length > 1 && Math.abs(g.slide) >= 48 && Math.abs(g.slide) > Math.abs(g.y - g.y0) * 1.5) return step(g.slide < 0 ? 1 : -1);
            return place();
          }
          // A finger lifted while moving keeps the frame going for a moment.
          if (performance.now() - g.t < 80 && Math.hypot(g.vx, g.vy) > 0.08) fling(g.vx, g.vy);
        };
        stage.addEventListener("pointerup", release);
        stage.addEventListener("pointercancel", release);

        const fling = (vx, vy) => {
          let last = performance.now();
          const tick = (now) => {
            const dt = Math.min(32, now - last);
            last = now;
            const x = view.x;
            const y = view.y;
            view.x += vx * dt;
            view.y += vy * dt;
            clamp(view);
            if (view.x === x) vx = 0;
            if (view.y === y) vy = 0;
            const decay = 0.994 ** dt;
            vx *= decay;
            vy *= decay;
            place();
            flingId = Math.hypot(vx, vy) > 0.02 ? requestAnimationFrame(tick) : 0;
          };
          flingId = requestAnimationFrame(tick);
        };

        // ---- wheel -----------------------------------------------------------
        // A wheel with Cmd or Ctrl held zooms about the pointer, which is also
        // how a trackpad pinch arrives; a plain wheel moves a zoomed frame.
        // Neither reaches the page. A pinch tracks the fingers as they are. A
        // mouse wheel's notches can be large, so with Cmd held, or past the
        // size a pinch sends, the view eases toward where the wheel has sent
        // it rather than jumping there.
        let wheelTarget = null;
        let wheelId = 0;
        const stopWheel = () => {
          cancelAnimationFrame(wheelId);
          wheelId = 0;
          wheelTarget = null;
        };
        const wheelStep = (rate) => {
          wheelId = 0;
          if (!wheelTarget) return;
          const { s, p } = wheelTarget;
          const next = rate === 1 || Math.abs(s - view.s) < 0.002 ? s : view.s + (s - view.s) * rate;
          const k = next / view.s;
          view.x = p.x - (p.x - view.x) * k;
          view.y = p.y - (p.y - view.y) * k;
          view.s = next;
          if (next !== s) {
            setZoomed(view.s > fitScale() * 1.001);
            place();
            wheelId = requestAnimationFrame(() => wheelStep(rate));
            return;
          }
          wheelTarget = null;
          settle();
          rerasterSoon();
        };
        const wheelZoom = (factor, p, eased) => {
          const s = Math.min(maxScale(), Math.max(fitScale(), (wheelTarget?.s ?? view.s) * factor));
          wheelTarget = { s, p };
          if (!eased) return wheelStep(1);
          if (!wheelId) wheelId = requestAnimationFrame(() => wheelStep(0.35));
        };
        stage.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            if (event.ctrlKey || event.metaKey) {
              const d = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
              const factor = Math.exp(-Math.max(-30, Math.min(30, d)) * 0.01);
              return wheelZoom(factor, local(event), event.metaKey || Math.abs(d) >= 30);
            }
            if (!isZoomed) return;
            stopWheel();
            view.x -= event.deltaX;
            view.y -= event.deltaY;
            place();
            rerasterSoon();
          },
          { passive: false },
        );

        // ---- links to a frame ------------------------------------------------
        // `?frame=3` opens the page on the third frame enlarged, numbered as the
        // tiles are, so a link can send someone straight to the state in question.
        // A query rather than a fragment, because a fragment never reaches the
        // server that answers the link.
        // The line under the title is the page's description, which a link to
        // it shows under the title; a link to a frame describes that frame.
        const description =
          document.querySelector('meta[name="description"]') ??
          document.head.appendChild(Object.assign(document.createElement("meta"), { name: "description" }));
        const pageLine = document.querySelector("#line")?.textContent.trim() ?? "";
        // The document's title names what is on screen, the open frame first,
        // so a tab, a history entry or a recording of the page can say which
        // frame was showing without knowing how this page is built.
        const pageTitle = document.title;
        const describe = (index) => {
          if (index === null) {
            description.content = pageLine;
            document.title = pageTitle;
            return;
          }
          const note = document.createElement("div");
          note.innerHTML = states[index].note;
          description.content = `${lead(index)}${states[index].title}. ${note.textContent.trim()}`;
          const shown = `${lead(index)}${states[index].title}`;
          document.title = pageTitle ? `${shown} · ${pageTitle}` : shown;
        };
        describe(null);

        const setFrameParam = (number) => {
          const url = new URL(location.href);
          if (number === null) url.searchParams.delete("frame");
          else url.searchParams.set("frame", String(number));
          // A srcdoc or sandboxed host refuses any rewrite beyond the fragment,
          // and the page works the same without the link.
          try {
            history.replaceState(null, "", url);
          } catch {}
        };

        // Some viewers reload the page without the ?frame= query, so we also
        // save the open frame in session storage and reopen it on load. We find
        // it by title, so adding a frame above it still reopens the same one.
        // If its title changed, we use its number.
        const keptKey = `wireframe-frame:${location.pathname}:${document.title}`;
        const keepFrame = (index) => {
          try {
            if (index === null) sessionStorage.removeItem(keptKey);
            else sessionStorage.setItem(keptKey, JSON.stringify({ title: states[index].title, index }));
          } catch {}
        };
        const keptFrame = () => {
          try {
            const kept = JSON.parse(sessionStorage.getItem(keptKey) ?? "null");
            if (!kept) return -1;
            const byTitle = states.findIndex((state) => state.title === kept.title);
            return byTitle >= 0 ? byTitle : kept.index < states.length ? kept.index : -1;
          } catch {
            return -1;
          }
        };

        const openFromQuery = () => {
          const index = Number(new URLSearchParams(location.search).get("frame")) - 1;
          if (Number.isInteger(index) && index >= 0 && index < states.length) return showFrame(index);
          const kept = keptFrame();
          if (kept >= 0) showFrame(kept);
        };

        viewer.addEventListener("close", () => {
          setFrameParam(null);
          keepFrame(null);
          describe(null);
        });
        openFromQuery();

        for (const button of document.querySelectorAll("[data-step]")) button.disabled = states.length < 2;
        }
      </script>
