      <!-- This page is the drawing. <main> fills the window and carries no prose
           column: `flex min-h-dvh flex-col px-4 pb-8`. The top padding is the
           title bar's own, so the bar can pin flush to the top edge. One 16px
           gutter runs round the bar's contents, down the grid's sides and
           between the bar and the first row, so every edge lines up. The
           buttons line up with the top of the title block, so they sit 16px
           from the top as well as from the right. -->

      <style>
        /* The page's side gutter is 16px at every width. The title bar's
           -mx-4 and the grid both depend on it, so it's set here, where it
           also covers a project kit that writes its own <main> tag. */
        body > main {
          padding-inline: 1rem;
        }

        /* The rings and their tags are the one thing on these frames that is
           not the design, so they start hidden and the reader turns them on.
           Anything short of data-marks="on" hides them, so a page shows the
           bare design before its script runs too. The rule hangs off the
           body, which is what puts the enlarged copy of a frame under it
           too: one button, both views, no second piece of state. */
        body:not([data-marks="on"]) .ann {
          display: none;
        }

        /* A mark is drawn on a layer over the whole frame, measured from the
           element it names once layout has settled, so no overflow-hidden
           pane, column or bar can clip a ring or its tag. The marker left
           inside the element takes no space of its own. */
        .frame i.mark {
          display: none;
        }
        .marks {
          position: absolute;
          inset: 0;
          z-index: 60;
          pointer-events: none;
        }
        .mark-ring {
          position: absolute;
          border-radius: 8px;
          box-shadow:
            0 0 0 2px var(--line),
            0 0 0 6px color-mix(in srgb, var(--line) 16%, transparent);
        }
        .mark-tag {
          position: absolute;
          display: inline-flex;
          align-items: center;
          gap: 4px;
          height: 18px;
          padding: 0 6px;
          border-radius: 5px;
          background: var(--tag);
          color: #fff;
          font: 600 10px/1 Inter, ui-sans-serif, system-ui, sans-serif;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          white-space: nowrap;
        }
        .mark-tag i {
          font-size: 11px;
        }
        /* A mark's note is for whoever reads the page as text, never drawn. */
        .mark-note {
          display: none;
        }

        /* A tile's ground steps a little toward the ink under the pointer. Only
           the frame opens larger on click, so only the frame takes the brand
           outline, standing 2px off its edge outside the hairline, and the
           caption stays free to select. Only in the grid: the enlarged copy is
           a clone, and clicking it opens nothing. */
        #rack .tile {
          transition: background-color 120ms ease-out;
        }
        /* Group colors. Each tone sets --tone for both themes, which paints a
           group's rule in the grid, its mark and labels, and its bars in the
           enlarged view's strip. */
        .tone-gray {
          --tone: light-dark(#78716c, #d6d3d1);
        }
        .tone-sky {
          --tone: light-dark(#0284c7, #7dd3fc);
        }
        .tone-emerald {
          --tone: light-dark(#059669, #6ee7b7);
        }
        .tone-amber {
          --tone: light-dark(#d97706, #fcd34d);
        }
        .tone-rose {
          --tone: light-dark(#e11d48, #fda4af);
        }
        .tone-indigo {
          --tone: light-dark(#4f46e5, #a5b4fc);
        }
        .tone-plain {
          --tone: light-dark(#57534e, #f5f5f4);
        }
        .tone-text {
          color: var(--tone);
        }
        /* A group in the grid: its heading and tiles behind one rule in its
           color down the left margin, so where it starts and ends shows at a
           glance and the tiles stay on the plain page. The section sits in
           the page's gutter, so its tiles are exactly as wide as loose ones,
           and keeps the rack's columns and gap. */
        #rack .group {
          grid-column: 1 / -1;
          display: grid;
          grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
          gap: 0.5rem;
          margin: 0 0 1.25rem -1rem;
          padding-left: 13px;
          border-left: 3px solid var(--tone);
        }
        #rack .tile:hover {
          background-color: color-mix(in oklab, var(--color-card) 95%, var(--color-foreground));
        }
        #rack .frame {
          outline: 2px solid transparent;
          outline-offset: 2px;
          transition: outline-color 120ms ease-out;
        }
        #rack .frame:hover {
          outline-color: var(--color-brand-300);
        }

        /* The frames-per-row slider, drawn by hand so it sits in the bar like
           the buttons beside it. Each count it can stop at is a dot on the
           rail, 20px apart, and the slider is as long as its stops need
           (--stops, set with its max), so it reads as a choice of counts
           rather than a dial. The rail's grey is mixed into the page's ground
           rather than see-through, or the line darkens each dot it crosses. */
        #per-row {
          --rail: color-mix(in srgb, var(--color-foreground) 22%, var(--color-background));
          appearance: none;
          width: calc(14px + (var(--stops, 4) - 1) * 20px);
          height: 16px;
          margin: 0 2px;
          background: transparent;
          cursor: pointer;
        }
        #per-row::-webkit-slider-runnable-track {
          height: 16px;
          background:
            radial-gradient(circle, var(--rail) 0 2px, transparent 2.5px) -3px 50% / 20px 100% repeat-x,
            linear-gradient(var(--rail), var(--rail)) 7px 50% / calc(100% - 14px) 1px no-repeat;
        }
        #per-row::-moz-range-track {
          height: 16px;
          background:
            radial-gradient(circle, var(--rail) 0 2px, transparent 2.5px) -3px 50% / 20px 100% repeat-x,
            linear-gradient(var(--rail), var(--rail)) 7px 50% / calc(100% - 14px) 1px no-repeat;
        }
        #per-row::-webkit-slider-thumb {
          appearance: none;
          box-sizing: border-box;
          width: 14px;
          height: 14px;
          margin-top: 1px;
          border-radius: 50%;
          border: 1px solid color-mix(in srgb, var(--color-foreground) 30%, transparent);
          background: var(--color-card);
          box-shadow: 0 1px 2px rgb(0 0 0 / 0.14);
        }
        #per-row::-moz-range-thumb {
          box-sizing: border-box;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          border: 1px solid color-mix(in srgb, var(--color-foreground) 30%, transparent);
          background: var(--color-card);
          box-shadow: 0 1px 2px rgb(0 0 0 / 0.14);
        }
        #per-row:hover::-webkit-slider-thumb {
          border-color: color-mix(in srgb, var(--color-foreground) 55%, transparent);
        }
        #per-row:hover::-moz-range-thumb {
          border-color: color-mix(in srgb, var(--color-foreground) 55%, transparent);
        }
        #per-row:focus-visible {
          outline: 2px solid var(--color-ring);
          outline-offset: 2px;
          border-radius: 4px;
        }

        /* Cmd+. sets data-chrome="off" and this hides everything around the
           frames. In the grid the title bar goes, and the frames move up to
           the top gutter. In the viewer the controls keep their space, so the
           open frame doesn't move or rescale. */
        body[data-chrome="off"] :is(header, #source, instrument-page) {
          display: none;
        }
        body[data-chrome="off"] #rack {
          margin-top: 1rem;
        }
        body[data-chrome="off"] :is(#viewer-top, #viewer-bottom, #viewer-map) {
          visibility: hidden;
        }
        /* While they're hidden, a faint hint for bringing them back shows
           when the pointer is in the top-right corner (data-corner, set by
           the script). Its backing sits flush in the corner. It takes no
           clicks, so frames under it stay usable. */
        body[data-chrome="off"] .chrome-hint {
          display: flex;
        }
        .chrome-hint span {
          opacity: 0;
          transition: opacity 0.2s;
        }
        body[data-corner] .chrome-hint span {
          opacity: 1;
        }
        /* The words on the page's own controls are drawn from an attribute,
           so the Markdown a shared link answers with, and any reader of the
           page's text, holds the frames and not "Show callouts" or "Hide
           controls". Each control carries its name in aria-label too. */
        [data-chrome-text]::before {
          content: attr(data-chrome-text);
        }
      </style>

      <header class="sticky top-0 z-20 -mx-4 mb-4 flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-border bg-background/95 p-4 backdrop-blur">
        <!-- The page name is the part of the product and what this version
             tries ("Checkout: sold out mid-payment"). The line under it says
             what we're proposing. Everything else goes in the frame notes, so
             this page has no intro paragraph. -->
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-[13px] leading-4 font-medium tracking-[-0.01em]">TITLE</h1>
          <p id="line" class="mt-1 truncate text-[12px] leading-4 text-muted-foreground">ONE LINE: what we're proposing, and what these frames should help decide.</p>
        </div>

        <div class="flex shrink-0 items-center gap-1.5 self-start print:hidden">
          <!-- The ⋯ menu. The script places it under its button when it opens. -->
          <button id="more" popovertarget="more-menu" title="More" aria-label="More" class="grid size-8 place-items-center rounded-lg border border-border text-muted-foreground hover:text-foreground">
            <i class="ph ph-dots-three text-base"></i>
          </button>
          <div id="more-menu" popover class="m-0 min-w-48 rounded-lg border border-border bg-popover p-1 text-[12px] text-foreground shadow-lg [inset:auto]">
            <button id="marks" class="flex h-8 w-full items-center justify-between gap-6 rounded-md px-2 hover:bg-accent">
              <span data-chrome-text></span><kbd class="font-sans text-muted-foreground" data-chrome-text="A"></kbd>
            </button>
            <button data-hide-controls aria-label="Hide controls" class="flex h-8 w-full items-center justify-between gap-6 rounded-md px-2 hover:bg-accent">
              <span data-chrome-text="Hide controls"></span><kbd class="font-sans text-muted-foreground" data-chrome-text></kbd>
            </button>
          </div>
          <!-- How many frames a row holds, from one at the full width to four
               across, with a jump to either end on the icons. On a page too
               narrow for two it hides rather than sitting there as a dead
               target. -->
          <div id="views" class="flex h-8 items-center gap-1 rounded-lg border border-border px-1 text-muted-foreground">
            <button data-to="min" title="One per row" class="grid size-6 place-items-center rounded-md hover:text-foreground"><i class="ph ph-square"></i></button>
            <input id="per-row" type="range" min="1" max="4" step="1" value="1" aria-label="Frames per row" />
            <button data-to="max" title="Four per row" class="grid size-6 place-items-center rounded-md hover:text-foreground"><i class="ph ph-squares-four"></i></button>
          </div>
        </div>
      </header>
      <div class="chrome-hint pointer-events-none fixed top-0 right-0 z-30 hidden text-[12px] leading-none text-muted-foreground/70"><span class="rounded-bl-md bg-background/80 p-2"></span></div>

      <div id="rack" class="grid flex-1 content-start gap-2 [grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))]"></div>

      <!-- One line, small, after the frames: what they are drawn against, and
           anything invented to fill a row. Not a section, not an essay. Delete
           it when there is nothing true to put in it. -->
      <p id="source" class="mt-5 text-[11px] leading-5 text-muted-foreground">
        Drawn against WHAT, on WHEN. Grey bars are placeholder text; every label,
        button and warning is the copy being proposed.
      </p>

      <!-- The enlarged view. One frame on a dark ground, with everything else
           laid over it. At the top left, which frame this is, as the page's
           own title bar says which page: its place in the page, its label,
           its title, and the note on a second line, one line long until a
           tap opens the rest. Beside the title, when the agent paired this
           frame with another, a button saying what Compare will show. At
           the top right, the switches: Recommended when the page stars any
           frames, Marks, and Close. Every one is the same kind of button, its
           word and then its key, with no icon. Along the bottom, only the
           strip, with the frame's label and its group's name under its own run, and prev and
           next: small arrow keys at the lower right on a desktop, buttons
           under the thumbs on a touch screen. The frame fits between the two
           and never sits under them until the reader zooms, when everything
           but the scale fades so the drawing has the screen. Zoom has no
           control of its own: a pinch, a wheel with Cmd or Ctrl held, a
           double tap or the keys take the frame in, and then the lower right
           shows a thumbnail with the visible part marked, which a tap or a
           drag on moves the view. -->
      <style>
        /* The page itself never zooms while the viewer is open, so the
           controls stay where they are: every touch on the dialog is the
           viewer's own, and only an opened note keeps a native scroll. */
        #viewer {
          touch-action: none;
          -webkit-user-select: none;
          user-select: none;
          --bottom-h: 0px;
          --control-h: 1.75rem;
          --vw-pill: #161616;
          --vw-line: rgb(255 255 255 / 0.16);
          --vw-ink: rgb(255 255 255 / 0.92);
          --vw-dim: rgb(255 255 255 / 0.62);
          --vw-faint: rgb(255 255 255 / 0.42);
        }
        html:has(#viewer[open]) {
          background: #000;
        }
        #stage {
          position: absolute;
          inset: 0;
          outline: none;
          overflow: hidden;
          touch-action: none;
        }
        #stage .frame {
          cursor: default;
          transform-origin: 0 0;
          will-change: transform;
        }
        #viewer-top,
        #viewer-bottom {
          position: absolute;
          left: 0;
          right: 0;
          z-index: 2;
          color-scheme: dark;
          color: var(--vw-dim);
          pointer-events: none;
        }
        /* The top band takes no taps itself, so the ground under it still
           answers one; the title block and each button take their own. */
        #viewer-top {
          top: 0;
          display: flex;
          align-items: flex-start;
          gap: 1.5rem;
          padding: calc(0.75rem + env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) 0.625rem max(1rem, env(safe-area-inset-left, 0px));
        }
        #viewer-top .ident {
          flex: 1;
          min-width: 0;
          pointer-events: auto;
        }
        #viewer-top .head {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          min-width: 0;
          height: var(--control-h);
          white-space: nowrap;
          font-size: 13px;
          line-height: 16px;
          font-weight: 500;
          color: var(--vw-ink);
        }
        #viewer-counter {
          flex: none;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-variant-numeric: tabular-nums;
        }
        #viewer-counter span {
          color: var(--vw-faint);
        }
        #viewer-label {
          flex: none;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-weight: 600;
          color: var(--tone);
        }
        #viewer-label:empty {
          display: none;
        }
        /* A recommended frame's star sits after its label, drawn as an
           icon the size of the label and centered on the line. */
        #viewer-pick {
          display: inline-flex;
          flex: none;
          margin-left: -0.25rem;
          color: var(--tone);
        }
        #viewer-pick svg {
          width: 13px;
          height: 13px;
          fill: currentColor;
        }
        #viewer-pick[hidden] {
          display: none;
        }
        #viewer-title {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        /* The note: one line, so the band is the same height for every
           frame. A tap opens the rest over the frame and a tap folds it. */
        #viewer-caption {
          margin-top: 0.125rem;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
          font-size: 12px;
          line-height: 16px;
          color: var(--vw-dim);
          -webkit-user-select: text;
          user-select: text;
          touch-action: pan-y;
        }
        #viewer-top[data-more] #viewer-caption {
          cursor: pointer;
        }
        #viewer-top[data-open] {
          background: rgb(0 0 0 / 0.92);
        }
        #viewer-top[data-open] #viewer-caption {
          max-height: 40dvh;
          overflow-y: auto;
          overscroll-behavior: contain;
          white-space: normal;
        }
        #viewer-top .controls {
          display: flex;
          flex: none;
          align-items: center;
          gap: 0.375rem;
        }
        /* The one kind of button: its word, then its key. Pressed, it takes
           a quiet fill. */
        #viewer .vbtn {
          display: inline-flex;
          flex: none;
          align-items: center;
          gap: 0.375rem;
          height: var(--control-h);
          padding: 0 0.3125rem 0 0.5rem;
          border: 1px solid var(--vw-line);
          border-radius: 6px;
          background: var(--vw-pill);
          color: var(--vw-ink);
          font-size: 12px;
          font-weight: 500;
          white-space: nowrap;
          pointer-events: auto;
          box-shadow: 0 1px 2px rgb(0 0 0 / 0.4);
          transition: opacity 0.2s;
        }
        #viewer .vbtn:hover {
          border-color: rgb(255 255 255 / 0.32);
        }
        #viewer .vbtn[aria-pressed="true"] {
          background: #2e2e2e;
          border-color: rgb(255 255 255 / 0.4);
        }
        #viewer .vbtn[hidden] {
          display: none;
        }
        #viewer .vbtn kbd {
          display: inline-grid;
          place-items: center;
          min-width: 1rem;
          height: 1rem;
          padding: 0 0.25rem;
          border-radius: 4px;
          box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2);
          color: var(--vw-dim);
          font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        #viewer .vbtn .star {
          color: var(--tone);
        }
        /* Compare belongs to the frame, so it sits in the frame's own title
           line, in its group's color. */
        #viewer [data-compare] {
          height: 1.5rem;
          margin-left: 0.5rem;
          color: var(--tone);
        }
        #viewer-zoom {
          padding-right: 0.375rem;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 11px;
          font-variant-numeric: tabular-nums;
          color: var(--vw-dim);
        }
        /* The bottom band: the strip, and the arrow keys at the right. */
        #viewer-bottom {
          bottom: 0;
          padding: 0.5rem max(1rem, env(safe-area-inset-right, 0px)) max(0.5rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
        }
        #viewer-bottom .row {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          max-width: 48rem;
          min-height: 1.5rem;
          margin: 0 auto;
        }
        #viewer-bottom .keys {
          position: absolute;
          right: max(1rem, env(safe-area-inset-right, 0px));
          bottom: max(0.5rem, env(safe-area-inset-bottom, 0px));
          display: flex;
          gap: 0.25rem;
        }
        #viewer-bottom .key {
          display: grid;
          place-items: center;
          min-width: 1.5rem;
          height: 1.5rem;
          padding: 0 0.25rem;
          border-radius: 6px;
          box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2);
          color: var(--vw-dim);
          font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
          pointer-events: auto;
          transition: opacity 0.2s;
        }
        #viewer-bottom .key:hover {
          color: var(--vw-ink);
        }
        #viewer-bottom .thumb {
          display: none;
          flex: none;
          place-items: center;
          width: 2.75rem;
          height: 2.25rem;
          border: 1px solid var(--vw-line);
          border-radius: 8px;
          background: var(--vw-pill);
          color: var(--vw-dim);
          pointer-events: auto;
        }
        #viewer-bottom :is(.key, .thumb):disabled {
          opacity: 0.25;
        }
        /* A touch screen has no arrow keys, so prev and next are buttons
           under the thumbs and the keys' hints go. */
        @media (pointer: coarse) {
          #viewer {
            --control-h: 2.25rem;
          }
          #viewer .vbtn kbd,
          #viewer-bottom .keys {
            display: none;
          }
          #viewer-bottom .thumb {
            display: grid;
          }
        }
        /* A phone has no room for two frames, upright or on its side, and
           upright its Recommended button keeps only its star. */
        @media (max-width: 640px), (max-height: 500px) {
          #viewer [data-compare] {
            display: none;
          }
        }
        @media (max-width: 640px) {
          #viewer [data-picks] .word {
            display: none;
          }
        }
        /* A phone on its side has little height to give the frame, so the
           note goes and the bands keep close to the edges. */
        @media (max-height: 500px) {
          #viewer-top {
            padding-top: calc(0.5rem + env(safe-area-inset-top, 0px));
            padding-bottom: 0.375rem;
          }
          #viewer-caption {
            display: none;
          }
          #viewer-bottom {
            padding-top: 0.375rem;
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0px));
          }
        }

        /* The strip: a bar per frame in runs by group, centered so it holds
           still from frame to frame. The open frame's bar is the large one,
           frames before it are half lit, and frames to come are faint. A
           recommended frame is a star in place of its bar, scaled up when
           open so the row never changes size. The frame's label and its
           group's name hang under its own run, kept inside the strip by the
           script. The script narrows the bars and their gaps until the strip
           fits on one row; it wraps only past the narrowest bar. */
        #viewer-strip {
          position: relative;
          flex: 1;
          min-width: 0;
          display: flex;
          justify-content: center;
          height: 26px;
          pointer-events: auto;
        }
        #viewer-strip[hidden] {
          display: none;
        }
        #viewer-strip .bars {
          position: relative;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: center;
          height: 10px;
          gap: 0.25rem var(--run-gap, 0.5rem);
        }
        #viewer-strip .name {
          position: absolute;
          top: 15px;
          left: var(--name-x, 0px);
          white-space: nowrap;
          font-size: 11px;
          line-height: 1;
          color: var(--tone);
          pointer-events: none;
        }
        /* The frame's label leads the name, as in the title block, so a
           glance at the strip reads it too. */
        #viewer-strip .name .pos {
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-weight: 600;
        }
        #viewer-strip .name .pos:not(:last-child) {
          margin-right: 0.375rem;
        }
        #viewer-strip .run {
          display: flex;
          align-items: center;
          gap: var(--gap, 3px);
        }
        #viewer-strip button {
          position: relative;
          width: var(--bar, 10px);
          height: 4px;
          padding: 0;
          border-radius: 9999px;
          background: var(--tone);
          opacity: 0.3;
        }
        #viewer-strip button.passed {
          opacity: 0.7;
        }
        #viewer-strip button[aria-current] {
          width: 14px;
          height: 6px;
          opacity: 1;
        }
        #viewer-strip button.pick {
          height: 10px;
          border-radius: 0;
          background: none;
          color: var(--tone);
          opacity: 0.75;
        }
        #viewer-strip button.pick::after {
          content: "★";
          position: absolute;
          inset: 0;
