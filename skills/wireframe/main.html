      <!-- This page is the drawing. <main> fills the window and carries no prose
           column: `flex min-h-dvh flex-col px-4 pb-8`. The top padding is the
           title bar's own, so the bar can pin flush to the top edge. One 16px
           gutter runs round the bar's contents, down the grid's sides and
           between the bar and the first row, so every edge lines up. The two
           title lines are 16px each, as tall as the 32px buttons, so the
           buttons sit 16px from the top as well as from the right. -->

      <style>
        /* The rings and their tags are the one thing on these frames that is
           not the design, so they start hidden and the reader turns them on.
           Anything short of data-marks="on" hides them, so a page shows the
           bare design before its script runs too. The rule hangs off the
           body, which is what puts the enlarged copy of a frame under it
           too: one button, both views, no second piece of state. */
        body:not([data-marks="on"]) .ann {
          display: none;
        }

        /* A mark is drawn on a layer over the whole frame, measured from the
           element it names once layout has settled, so no overflow-hidden
           pane, column or bar can clip a ring or its tag. The marker left
           inside the element takes no space of its own. */
        .frame i.mark {
          display: none;
        }
        .marks {
          position: absolute;
          inset: 0;
          z-index: 60;
          pointer-events: none;
        }
        .mark-ring {
          position: absolute;
          border-radius: 8px;
          box-shadow:
            0 0 0 2px var(--line),
            0 0 0 6px color-mix(in srgb, var(--line) 16%, transparent);
        }
        .mark-tag {
          position: absolute;
          display: inline-flex;
          align-items: center;
          gap: 4px;
          height: 18px;
          padding: 0 6px;
          border-radius: 5px;
          background: var(--tag);
          color: #fff;
          font: 600 10px/1 Inter, ui-sans-serif, system-ui, sans-serif;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          white-space: nowrap;
        }
        .mark-tag i {
          font-size: 11px;
        }

        /* A tile's ground steps a little toward the ink under the pointer. Only
           the frame opens larger on click, so only the frame takes the brand
           outline, standing 2px off its edge outside the hairline, and the
           caption stays free to select. Only in the grid: the enlarged copy is
           a clone, and clicking it opens nothing. */
        #rack .tile {
          transition: background-color 120ms ease-out;
        }
        #rack .tile:hover {
          background-color: color-mix(in oklab, var(--color-card) 95%, var(--color-foreground));
        }
        #rack .frame {
          outline: 2px solid transparent;
          outline-offset: 2px;
          transition: outline-color 120ms ease-out;
        }
        #rack .frame:hover {
          outline-color: var(--color-brand-300);
        }

        /* The frames-per-row slider, drawn by hand so it sits in the bar like
           the buttons beside it. Each count it can stop at is a dot on the
           rail, 20px apart, and the slider is as long as its stops need
           (--stops, set with its max), so it reads as a choice of counts
           rather than a dial. The rail's grey is mixed into the page's ground
           rather than see-through, or the line darkens each dot it crosses. */
        #per-row {
          --rail: color-mix(in srgb, var(--color-foreground) 22%, var(--color-background));
          appearance: none;
          width: calc(14px + (var(--stops, 4) - 1) * 20px);
          height: 16px;
          margin: 0 2px;
          background: transparent;
          cursor: pointer;
        }
        #per-row::-webkit-slider-runnable-track {
          height: 16px;
          background:
            radial-gradient(circle, var(--rail) 0 2px, transparent 2.5px) -3px 50% / 20px 100% repeat-x,
            linear-gradient(var(--rail), var(--rail)) 7px 50% / calc(100% - 14px) 1px no-repeat;
        }
        #per-row::-moz-range-track {
          height: 16px;
          background:
            radial-gradient(circle, var(--rail) 0 2px, transparent 2.5px) -3px 50% / 20px 100% repeat-x,
            linear-gradient(var(--rail), var(--rail)) 7px 50% / calc(100% - 14px) 1px no-repeat;
        }
        #per-row::-webkit-slider-thumb {
          appearance: none;
          box-sizing: border-box;
          width: 14px;
          height: 14px;
          margin-top: 1px;
          border-radius: 50%;
          border: 1px solid color-mix(in srgb, var(--color-foreground) 30%, transparent);
          background: var(--color-card);
          box-shadow: 0 1px 2px rgb(0 0 0 / 0.14);
        }
        #per-row::-moz-range-thumb {
          box-sizing: border-box;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          border: 1px solid color-mix(in srgb, var(--color-foreground) 30%, transparent);
          background: var(--color-card);
          box-shadow: 0 1px 2px rgb(0 0 0 / 0.14);
        }
        #per-row:hover::-webkit-slider-thumb {
          border-color: color-mix(in srgb, var(--color-foreground) 55%, transparent);
        }
        #per-row:hover::-moz-range-thumb {
          border-color: color-mix(in srgb, var(--color-foreground) 55%, transparent);
        }
        #per-row:focus-visible {
          outline: 2px solid var(--color-ring);
          outline-offset: 2px;
          border-radius: 4px;
        }

        /* Cmd+. sets data-chrome="off" and this hides everything around the
           frames. The grid gets a top gutter to replace the title bar's. */
        body[data-chrome="off"] :is(header, #source, #viewer-top, #viewer-bottom, instrument-page) {
          display: none;
        }
        body[data-chrome="off"] #rack {
          margin-top: 1rem;
        }
      </style>

      <header class="sticky top-0 z-20 -mx-4 mb-4 flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-border bg-background/95 p-4 backdrop-blur">
        <!-- The page name is the part of the product and what this version
             tries ("Checkout: sold out mid-payment"). The line under it says
             what we're proposing. Everything else goes in the frame notes, so
             this page has no intro paragraph. -->
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-[13px] leading-4 font-semibold tracking-[-0.01em]">TITLE</h1>
          <p id="line" class="truncate text-[12px] leading-4 text-muted-foreground">ONE LINE: what we're proposing, and what these frames should help decide.</p>
        </div>

        <!-- The legend, which is two words because the marks are two colors. -->
        <div id="legend" class="flex shrink-0 items-center gap-3 text-[11px] text-muted-foreground">
          <span class="flex items-center gap-1.5"><span class="size-2.5 rounded-full" style="background:#ea580c"></span>click</span>
          <span class="flex items-center gap-1.5"><span class="size-2.5 rounded-full" style="background:#8b5cf6"></span>changed</span>
        </div>

        <div class="flex shrink-0 items-center gap-1.5 print:hidden">
          <button id="marks" title="Show the annotations (A)" class="flex h-8 items-center gap-1.5 rounded-lg border border-border px-2.5 text-[12px] font-medium">
            <i class="ph ph-circle-dashed text-sm"></i><span class="hidden sm:inline">Marks</span>
          </button>
          <!-- How many frames a row holds, from one at the full width to four
               across, with a jump to either end on the icons. On a page too
               narrow for two it hides rather than sitting there as a dead
               target. -->
          <div id="views" class="flex h-8 items-center gap-1 rounded-lg border border-border px-1 text-muted-foreground">
            <button data-to="min" title="One per row" class="grid size-6 place-items-center rounded-md hover:text-foreground"><i class="ph ph-square"></i></button>
            <input id="per-row" type="range" min="1" max="4" step="1" value="1" aria-label="Frames per row" />
            <button data-to="max" title="Four per row" class="grid size-6 place-items-center rounded-md hover:text-foreground"><i class="ph ph-squares-four"></i></button>
          </div>
        </div>
      </header>

      <div id="rack" class="grid flex-1 content-start gap-2 [grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))]"></div>

      <!-- One line, small, after the frames: what they are drawn against, and
           anything invented to fill a row. Not a section, not an essay. Delete
           it when there is nothing true to put in it. -->
      <p id="source" class="mt-5 text-[11px] leading-5 text-muted-foreground">
        Drawn against WHAT, on WHEN. Grey bars are placeholder text; every label,
        button and warning is the copy being proposed.
      </p>

      <!-- The enlarged view. The top row is as tall as the title bar, so marks
           and close sit where the bar's own buttons do. Caption and controls
           take their space first and the frame is scaled into what is left,
           so a long caption shrinks the drawing instead of sliding off the
           bottom of the screen. The caption is centered on the page in a
           middle column, with the arrows in the right one. The controls are drawn like the bar's buttons, and
           the top and bottom rows use the dark theme whatever the page's,
           because the viewer is always dark. The frame keeps the page's. -->
      <dialog
        id="viewer"
        class="m-0 h-dvh max-h-none w-screen max-w-none border-0 bg-[rgb(0_0_0/0.92)] p-0 [overscroll-behavior:contain] backdrop:bg-[rgb(0_0_0/0.92)] open:flex open:flex-col"
      >
        <div id="viewer-top" class="flex h-16 shrink-0 items-center justify-end px-4 pt-[env(safe-area-inset-top)]">
          <div class="controls flex items-center gap-1.5 [color-scheme:dark]">
            <button data-marks title="Show the annotations (A)" aria-pressed="false" class="flex h-8 items-center gap-1.5 rounded-lg border border-border px-2.5 text-[12px] font-medium text-muted-foreground">
              <i class="ph ph-circle-dashed text-sm"></i><span class="hidden sm:inline">Marks</span>
            </button>
            <button id="viewer-close" title="Close (Esc)" class="grid size-8 place-items-center rounded-lg border border-border text-muted-foreground hover:text-foreground">
              <i class="ph ph-x text-sm"></i>
            </button>
          </div>
        </div>
        <div id="stage" autofocus tabindex="-1" class="flex min-h-0 flex-1 px-4 focus:outline-none *:m-auto *:flex-none"></div>
        <div id="viewer-bottom" class="grid shrink-0 grid-cols-[1fr_auto_1fr] items-center gap-4 px-4 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] [color-scheme:dark]">
          <p id="viewer-caption" class="col-start-2 max-h-[30vh] max-w-3xl min-w-0 overflow-y-auto text-center text-[13px] leading-5 text-muted-foreground"></p>
          <div class="controls col-start-3 flex h-8 items-center justify-self-end gap-1 rounded-lg border border-border px-1 text-muted-foreground">
            <button data-step="-1" title="Previous frame" class="grid size-6 place-items-center rounded-md hover:text-foreground disabled:opacity-25"><i class="ph ph-caret-left"></i></button>
            <span id="viewer-counter" class="min-w-10 text-center font-mono text-[11px] tabular-nums"></span>
            <button data-step="1" title="Next frame" class="grid size-6 place-items-center rounded-md hover:text-foreground disabled:opacity-25"><i class="ph ph-caret-right"></i></button>
          </div>
        </div>
      </dialog>

      <!-- Keep type="module". The share copy of this page is taken as the parser reaches the last script in the body, and a module script runs after that, so the copy carries this markup as written rather than as the script changed it. -->
      <script type="module">
        // Every frame is drawn once at the size the thing really is, then shown
        // at whatever scale fits. Nothing here is hand-shrunk and nothing sets a
        // scale: `transform` composites a box laid out once, where `zoom` would
        // re-run layout at the smaller size and let the text re-wrap, so the
        // miniature would stop matching the thing it depicts.

        // Default frame size. A whole desktop window is 1280x800; a phone is
        // 390x844; a panel is whatever it actually measures. States override
        // with their own `w` and `h`.
        const W = 1280;
        const H = 800;
        // Narrowest a tile may be before the grid drops a column.
        const TILE_MIN = 330;

        // ---- the kit -------------------------------------------------------
        // Neutral pieces of software, so a frame is the thing being proposed
        // rather than a shell rebuilt from scratch each time. Call what you need
        // and DELETE THE REST: this is a starting point, not furniture the page
        // has to carry.
        //
        // Write class names out whole. A class assembled by interpolation
        // (`bg-${tone}-500`) is invisible to Tailwind's scanner and silently
        // produces no styles, so pass the finished class: `dot: "bg-warning-500"`.

        /** Placeholder prose. Widths are CSS lengths: bars("100%", "72%"). */
        const bars = (...widths) =>
          widths
            .map((w) => `<div class="h-2.5 rounded-full bg-gray-300" style="width:${w}"></div>`)
            .join("");

        /** A desktop window. */
        const win = (title, inner) => `
          <div class="flex h-full flex-col bg-card">
            <div class="flex h-9 shrink-0 items-center gap-2 border-b border-border bg-background px-3">
              <span class="size-2.5 rounded-full bg-gray-300"></span>
              <span class="size-2.5 rounded-full bg-gray-300"></span>
              <span class="size-2.5 rounded-full bg-gray-300"></span>
              <span class="ml-2 text-xs text-muted-foreground">${title}</span>
            </div>
            <div class="min-h-0 flex-1">${inner}</div>
          </div>`;

        /** A browser, for anything that lives at a URL. */
        const web = (url, inner) => `
          <div class="flex h-full flex-col bg-card">
            <div class="shrink-0 bg-background px-3 pt-2">
              <div class="flex w-64 items-center gap-2 rounded-t-lg bg-card px-3 py-1.5 text-xs text-muted-foreground">
                <i class="ph ph-globe-simple"></i><span class="truncate">${url.replace(/^[^/]*\/\//, "").split("/")[0]}</span>
              </div>
            </div>
            <div class="flex h-10 shrink-0 items-center gap-2 border-b border-border bg-card px-3">
              <i class="ph ph-arrow-left text-base text-gray-400"></i>
              <i class="ph ph-arrow-right text-base text-gray-300"></i>
              <div class="ml-1 flex-1 rounded-full bg-accent px-3 py-1 font-mono text-[11px] text-muted-foreground">${url}</div>
            </div>
            <div class="min-h-0 flex-1">${inner}</div>
          </div>`;

        /** A phone. Draw these at 390x844. */
        const phone = (inner, { time = "9:41" } = {}) => `
          <div class="flex h-full flex-col bg-card">
            <div class="flex h-11 shrink-0 items-center justify-between px-6 pt-1 text-[13px] font-medium">
              <span>${time}</span>
              <span class="flex items-center gap-1 text-xs"><i class="ph ph-cell-signal-full"></i><i class="ph ph-wifi-high"></i><i class="ph ph-battery-full"></i></span>
            </div>
            <div class="min-h-0 flex-1">${inner}</div>
            <div class="flex h-6 shrink-0 items-end justify-center pb-2"><span class="h-1 w-32 rounded-full bg-gray-400"></span></div>
          </div>`;

        /** One piece of UI on its own, floated on the app's ground. Use a
         *  smaller w and h on those states. */
        const panel = (inner) => `
          <div class="grid h-full place-items-center bg-background p-6">
            <div class="w-full rounded-xl border border-border bg-card shadow-xl">${inner}</div>
          </div>`;

        /** Rail, content, and an optional right-hand pane. */
        const shell = (rail, body, aside = "") => `
          <div class="flex h-full">
            ${rail ? `<aside class="w-56 shrink-0 border-r border-border bg-background p-3">${rail}</aside>` : ""}
            <section class="relative min-w-0 flex-1 overflow-hidden">${body}</section>
            ${aside ? `<aside class="w-80 shrink-0 border-l border-border bg-card p-4">${aside}</aside>` : ""}
          </div>`;

        /** A row in the rail. */
        const navItem = (label, { active = false, icon = "ph-circle", badge = "" } = {}) => `
          <div class="flex items-center gap-2.5 rounded-md px-2.5 py-1.5 ${active ? "bg-accent font-medium" : "text-muted-foreground"}">
            <i class="ph ${icon} text-base"></i>
            <span class="flex-1 truncate text-[13px]">${label}</span>
            ${badge ? `<span class="text-[11px] text-muted-foreground">${badge}</span>` : ""}
          </div>`;

        /** A heading above a run of rail items. */
        const group = (text) =>
          `<p class="px-2.5 pt-4 pb-1 text-[10px] font-semibold tracking-[0.1em] text-muted-foreground uppercase">${text}</p>`;

        /** A button. Pass the finished classes, not a tone name. */
        const btn = (label, { cls = "bg-foreground text-background", icon = "", full = false } = {}) => `
          <button class="inline-flex ${full ? "w-full" : ""} items-center justify-center gap-1.5 rounded-lg px-3.5 py-2 text-[13px] font-medium ${cls}">
            ${icon ? `<i class="ph ${icon} text-sm"></i>` : ""}${label}
          </button>`;

        /** A labeled field. `value` fills it, `placeholder` leaves it empty,
         *  `error` puts the message under it and reddens the border. */
        const field = (label, { value = "", placeholder = "", hint = "", error = "" } = {}) => `
          <label class="block">
            <span class="text-[11px] font-medium text-muted-foreground">${label}</span>
            <div class="mt-1 rounded-lg border ${error ? "border-error-500" : "border-input"} bg-card px-3 py-2 text-[13px] ${value ? "" : "text-gray-400"}">${value || placeholder || "&nbsp;"}</div>
            ${error ? `<span class="mt-1 block text-[11px] text-error-700">${error}</span>` : ""}
            ${hint && !error ? `<span class="mt-1 block text-[11px] text-muted-foreground">${hint}</span>` : ""}
          </label>`;

        /** A switch. */
        const toggle = (label, { on = false } = {}) => `
          <div class="flex items-center justify-between gap-4 py-2">
            <span class="text-[13px]">${label}</span>
            <span class="flex h-5 w-9 shrink-0 items-center rounded-full ${on ? "justify-end bg-brand-600" : "bg-gray-300"} p-0.5">
              <span class="size-4 rounded-full bg-white shadow-sm"></span>
            </span>
          </div>`;

        /** A status pill. Pass the finished classes. */
        const chip = (label, cls = "bg-accent text-muted-foreground") =>
          `<span class="inline-block rounded-full px-2 py-0.5 text-[10px] font-medium ${cls}">${label}</span>`;

        /** A data table. Headers are strings; rows are arrays of cells. */
        const grid = (headers, rows) => `
          <table class="w-full text-left text-[12px]">
            <thead><tr class="border-b border-border">${headers
              .map((h) => `<th class="px-3 py-1.5 text-[10px] font-semibold tracking-wide text-muted-foreground uppercase">${h}</th>`)
              .join("")}</tr></thead>
            <tbody>${rows
              .map((cells) => `<tr class="border-b border-border">${cells.map((c) => `<td class="px-3 py-2">${c}</td>`).join("")}</tr>`)
              .join("")}</tbody>
          </table>`;

        /** Nothing here yet. The state everyone forgets to draw. */
        const empty = (icon, title, note) => `
          <div class="grid h-full place-items-center p-8 text-center">
            <div>
              <i class="ph ${icon} text-3xl text-gray-300"></i>
              <p class="mt-3 text-sm font-medium">${title}</p>
              <p class="mx-auto mt-1 max-w-56 text-xs text-muted-foreground">${note}</p>
            </div>
          </div>`;

        // ---- annotations -----------------------------------------------------
        // For the reader, not the product: a pointer on what is being clicked,
        // and a dashed ring with a label, in two colors no interface uses for
        // itself. Orange is a click; violet is what appeared or changed. Put the
        // click on the frame where it happens and let the next frame be the
        // result; when the clicked thing survives into the result, put the click
        // there instead. One click per frame, and never a green row or a check
        // mark standing in for either, because those look like the design.
        //
        // The helpers leave an invisible marker inside the element they name;
        // the ring and tag are drawn after render on a layer over the whole
        // frame (see drawMarks), so the element needs no `relative` and nothing
        // inside the frame can clip them. That layer carries `ann`, the class
        // the marks button switches off, and so must anything you draw by
        // hand: a ring without it stays on when the reader asked for the
        // drawing on its own.

        const TONE = {
          click: { line: "#ea580c", tag: "#c2410c" },
          new: { line: "#8b5cf6", tag: "#6d28d9" },
        };

        /** Marks the element that contains it: `label` is the tag's word, `tone` its color. */
        const ann = (label, tone = "click") => `<i class="mark" data-label="${label}" data-tone="${tone}"></i>`;

        /** Marks the element that contains it as the thing being clicked, with a pointer in the tag. */
        const cursor = `<i class="mark" data-label="click" data-tone="click" data-pointer></i>`;

        /** Wraps a block so it can be marked: a row, a card, a page section. */
        const noted = (inner, label, tone = "click", { pointer = false, cls = "" } = {}) =>
          `<div class="${cls}">${inner}${ann(label, tone)}${pointer ? cursor : ""}</div>`;
        const clickable = (inner, cls = "") => noted(inner, "click", "click", { pointer: true, cls });
        const fresh = (inner, cls = "") => noted(inner, "new", "new", { cls });

        // ---- the frames ------------------------------------------------------
        // Order frames the way you'd walk a teammate through them. Name each one
        // like an artboard ("Choose a plan"), and write its note as one sentence
        // in the first person saying what we're doing on that screen and why.
        // SKILL.md has the full rules for titles and notes.
        const states = [
          {
            title: "Screen name",
            note: "Say in one first-person sentence what we're doing on this screen and why.",
            body: win(
              "Application",
              shell(
                group("Section") + navItem("A place", { active: true, icon: "ph-tray" }) + navItem("Another", { icon: "ph-archive" }),
                `<div class="p-6"><div class="space-y-2.5">${bars("100%", "78%", "62%")}</div></div>`,
              ),
            ),
          },
        ];

        // ---- render ----------------------------------------------------------
        // Everything from here down sits in its own block, so the frames above
        // may name a helper `stage` or `layout` without redeclaring one of these
        // and blanking the page with a SyntaxError.
        {
        const rack = document.querySelector("#rack");

        // In a caption the number takes a column of its own, so every line of
        // the note starts at the title's left edge. The badge stays inline
        // inside that column to keep the size it has in a line of text.
        rack.innerHTML = states
          .map(
            (state, i) => `
          <figure class="tile m-0 flex flex-col overflow-hidden border-[0.5px] border-border bg-card p-3 break-inside-avoid">
            <div class="slot flex h-[var(--slot-h)] items-center justify-center">
              <div
                class="frame w-[calc(var(--w)*var(--s))] cursor-zoom-in overflow-hidden rounded-sm ring-[0.5px] ring-border h-[calc(var(--h)*var(--s))]"
                data-w="${state.w || W}"
                data-h="${state.h || H}"
                style="--w:${state.w || W}px; --h:${state.h || H}px; --s:0.2"
              >
                <div class="relative w-[var(--w)] origin-top-left scale-[var(--s)] h-[var(--h)]">${state.body}</div>
              </div>
            </div>
            <figcaption class="mt-3 text-xs leading-5 text-muted-foreground/80">
              <span class="font-medium text-foreground/70">${i + 1}. ${state.title}.</span> ${state.note}
            </figcaption>
          </figure>`,
          )
          .join("");

        // ---- marks -----------------------------------------------------------
        // Measures each marked element against its frame in true-size pixels,
        // so the layer scales with the drawing and the enlarged copy, a clone,
        // carries it along. A narrow thing takes its tag beside it at the right,
        // a wide one above it, a whole pane inside its own corner; each falls
        // back to the next, then to below.
        const MARK_PAD = 5;
        const TAG_H = 18;

        const drawMarks = () => {
          for (const root of rack.querySelectorAll(".frame > *")) {
            root.querySelector(".marks")?.remove();
            const markers = [...root.querySelectorAll("i.mark")];
            if (markers.length === 0) continue;
            const frame = root.parentElement;
            const s = parseFloat(frame.style.getPropertyValue("--s")) || 1;
            const fw = Number(frame.dataset.w);
            const fh = Number(frame.dataset.h);
            const rr = root.getBoundingClientRect();
            // A ring and a pointer on one element draw as one mark.
            const groups = new Map();
            for (const m of markers) {
              const el = m.parentElement;
              const g = groups.get(el) || { el, label: m.dataset.label, tone: m.dataset.tone, pointer: false };
              if ("pointer" in m.dataset) g.pointer = true;
              else Object.assign(g, { label: m.dataset.label, tone: m.dataset.tone });
              groups.set(el, g);
            }
            const layer = document.createElement("div");
            layer.className = "marks ann";
            for (const g of groups.values()) {
              const r = g.el.getBoundingClientRect();
              if (r.width === 0 || r.height === 0) continue;
              const left = (r.left - rr.left) / s - MARK_PAD;
              const top = (r.top - rr.top) / s - MARK_PAD;
              const width = r.width / s + MARK_PAD * 2;
              const height = r.height / s + MARK_PAD * 2;
              const tagW = g.label.length * 7 + (g.pointer ? 15 : 0) + 12;
              const beside = left + width + 6 + tagW <= fw;
              const above = top - TAG_H - 4 >= 0;
              let tagLeft = Math.max(0, Math.min(left, fw - tagW));
              let tagTop = top - TAG_H - 4;
              if (height > 240) {
                tagLeft = left + 8;
                tagTop = top + 8;
              } else if (beside && (width < fw * 0.4 || !above)) {
                tagLeft = left + width + 6;
                tagTop = top + (height - TAG_H) / 2;
              } else if (!above) {
                tagTop = top + height + 4 + TAG_H <= fh ? top + height + 4 : top + 3;
              }
              const tone = TONE[g.tone] || TONE.click;
              layer.insertAdjacentHTML(
                "beforeend",
                `<span class="mark-ring" style="left:${left}px;top:${top}px;width:${width}px;height:${height}px;--line:${tone.line}"></span>` +
                  `<span class="mark-tag" style="left:${tagLeft}px;top:${tagTop}px;--tag:${tone.tag}">${g.pointer ? `<i class="ph ph-cursor"></i>` : ""}${g.label}</span>`,
              );
            }
            root.appendChild(layer);
          }
        };

        // Idempotent, so it runs at every point text can have moved: now, once
        // the browser Tailwind build has applied, when the fonts settle, and
        // after load.
        drawMarks();
        setTimeout(drawMarks, 250);
        document.fonts?.ready.then(() => setTimeout(drawMarks, 0));
        document.fonts?.addEventListener("loadingdone", drawMarks);
        window.addEventListener("load", () => setTimeout(drawMarks, 300));

        // ---- density ---------------------------------------------------------
        // Fit as many tiles per row as the width allows, then derive each frame's
        // scale from the tile. Nothing ever renders above its true size. The
        // slider in the title bar sets the count instead, from one frame at the
        // full width to four across, or more where the width already fits more.
        const GAP = 8;
        const PAD = 25; // tile padding plus its border
        // The most tiles the slider offers in a row, by the width of the
        // screen: four from a laptop up, three on a tablet held upright, two
        // on a phone on its side, and one on a phone held upright, where the
        // slider hides. Most phones on their side are wider than a tablet held
        // upright, so they are told apart by their short height under a touch
        // pointer instead.
        const MOST = [
          [1024, 4],
          [744, 3],
          [480, 2],
          [0, 1],
        ];
        const sideways = matchMedia("(pointer: coarse) and (orientation: landscape) and (max-height: 500px)");
        const views = document.querySelector("#views");
        const perRow = document.querySelector("#per-row");
        const [oneButton, mostButton] = views.querySelectorAll("button");
        // What the reader set the slider to. Until then the width decides, and
        // goes on deciding as the window changes. Like the open frame, the
        // setting stays through a reload in the same tab.
        const perRowKey = `wireframe-per-row:${location.pathname}:${document.title}`;
        let chosen = 0;
        try {
          chosen = Number(sessionStorage.getItem(perRowKey)) || 0;
        } catch {}
        const choose = (columns) => {
          chosen = columns;
          try {
            sessionStorage.setItem(perRowKey, String(columns));
          } catch {}
          layout();
        };

        const layout = () => {
          const avail = rack.clientWidth;
          if (avail <= 0) return;
          const natural = Math.max(1, Math.floor((avail + GAP) / (TILE_MIN + GAP)));
          let most = MOST.find(([from]) => innerWidth >= from)[1];
          if (sideways.matches) most = Math.min(most, 2);
          // A screen that already fits more than four keeps them.
          if (most === MOST[0][1]) most = Math.max(most, natural);
          const columns = Math.min(chosen || natural, most);
          const single = columns === 1;
          views.hidden = most < 2;
          perRow.max = most;
          perRow.value = columns;
          perRow.style.setProperty("--stops", most);
          perRow.title = single ? "One per row" : `${columns} per row`;
          perRow.setAttribute("aria-valuetext", perRow.title);
          mostButton.title = `${most} per row`;
          // The icon at whichever end the slider rests on lights, as the
          // picked half of a toggle would.
          oneButton.classList.toggle("text-foreground", single);
          mostButton.classList.toggle("text-foreground", columns === most);
          const inner = (avail - GAP * (columns - 1)) / columns - PAD;
          rack.style.setProperty("--cols", columns);
          const frames = [...rack.querySelectorAll(".frame")];
          const widthFit = (frame) => Math.min(inner / Number(frame.dataset.w), 1);
          // In the grid every tile shares one slot height, so captions line up
          // down the whole grid even where frames mix aspect ratios. The slot is
          // as tall as the middle frame of the set drawn at the tile's full
          // width, so a typical frame reaches both edges of its tile and only an
          // unusually tall one is capped by the slot and centered in it.
          const heights = frames.map((frame) => Number(frame.dataset.h) * widthFit(frame)).sort((a, b) => a - b);
          const slot = heights[Math.floor(heights.length / 2)] ?? 0;
          for (const frame of frames) {
            // One column has no row to keep even, so the frame scales by width
            // alone and the slot shrinks to match rather than centering it in a
            // height sized for the grid.
            const fit = single ? widthFit(frame) : Math.min(widthFit(frame), slot / Number(frame.dataset.h));
            const s = Math.max(0.05, fit);
            frame.style.setProperty("--s", s);
            frame.closest(".slot").style.setProperty("--slot-h", `${single ? Number(frame.dataset.h) * s : slot}px`);
          }
        };

        new ResizeObserver(layout).observe(rack);
        layout();

        perRow.addEventListener("input", () => choose(Number(perRow.value)));

        views.addEventListener("click", (event) => {
          const button = event.target.closest("[data-to]");
          if (!button) return;
          choose(Number(perRow[button.dataset.to]));
        });

        // ---- annotations on and off ------------------------------------------
        // One attribute on the body, so the grid and the enlarged copy of a frame
        // answer to the same switch and there is no second state to keep in step.
        // The marks start off, and only data-marks="on" shows them.
        // The frames underneath are the design; this is what was said about them.
        const marksButton = document.querySelector("#marks");
        const ON = "flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] font-medium border border-transparent bg-accent text-foreground";
        const OFF = "flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[12px] font-medium border border-border text-muted-foreground";

        const paintMarks = () => {
          const on = document.body.dataset.marks === "on";
          const title = on ? "Hide the annotations (A)" : "Show the annotations (A)";
          marksButton.className = on ? ON : OFF;
          marksButton.title = title;
          const viewerMarks = document.querySelector("#viewer [data-marks]");
          viewerMarks.className = marksButton.className;
          viewerMarks.title = title;
          viewerMarks.setAttribute("aria-pressed", String(on));
          document.querySelector("#legend").style.opacity = on ? "1" : "0.3";
        };

        const flipMarks = () => {
          document.body.dataset.marks = document.body.dataset.marks === "on" ? "off" : "on";
          paintMarks();
        };

        marksButton.addEventListener("click", flipMarks);
        paintMarks();

        // ---- chrome ----------------------------------------------------------
        // Cmd+. (Ctrl+. off a Mac) hides everything around the frames: the
        // title bar, the source line, the share widget, and the viewer's
        // buttons and caption. Press it again to bring them back. Like the
        // open frame, it stays that way through a reload in the same tab.
        const chromeKey = `wireframe-chrome:${location.pathname}:${document.title}`;
        const flipChrome = () => {
          const off = document.body.dataset.chrome !== "off";
          document.body.dataset.chrome = off ? "off" : "on";
          try {
            if (off) sessionStorage.setItem(chromeKey, "off");
            else sessionStorage.removeItem(chromeKey);
          } catch {}
        };
        try {
          if (sessionStorage.getItem(chromeKey) === "off") document.body.dataset.chrome = "off";
        } catch {}

        // ---- enlarge ---------------------------------------------------------
        // Everything is reachable by tap as well as by key: prev and next
        // buttons, a horizontal swipe, an explicit close. On a phone there is no
        // hover and no Escape to fall back on.
        const viewer = document.querySelector("#viewer");
        const stage = document.querySelector("#stage");
        const viewerCaption = document.querySelector("#viewer-caption");
        const viewerCounter = document.querySelector("#viewer-counter");
        let openIndex = -1;

        /** Fits the enlarged frame to the stage, which measured itself after the
         *  caption took its space. */
        const fitFrame = () => {
          const frame = stage.firstElementChild;
          if (!frame) return;
          const fit = Math.min(
            (stage.clientWidth - 32) / Number(frame.dataset.w),
            (stage.clientHeight - 32) / Number(frame.dataset.h),
          );
          frame.style.setProperty("--s", Math.max(0.05, fit));
        };

        const showFrame = (index) => {
          const state = states[index];
          const tile = rack.querySelectorAll(".frame")[index];
          if (!tile) return;
          openIndex = index;
          stage.replaceChildren(tile.cloneNode(true));
          viewerCaption.innerHTML =
            `<span class="font-medium text-foreground/80">${index + 1}. ${state.title}.</span> ${state.note}`;
          viewerCounter.textContent = `${index + 1} / ${states.length}`;
          if (!viewer.open) viewer.showModal();
          fitFrame(); // The dialog is laid out by now, so the stage measures true.
          // Replaced rather than pushed, so walking the set leaves one history
          // entry and the address bar always holds a link to the frame on screen.
          setFrameParam(index + 1);
          keepFrame(index);
          describe(index);
        };

        const step = (delta) => showFrame((openIndex + delta + states.length) % states.length);

        rack.addEventListener("click", (event) => {
          const frame = event.target.closest(".frame");
          if (!frame) return;
          showFrame([...rack.querySelectorAll(".frame")].indexOf(frame));
        });

        // Clicking anywhere on the dark background closes the viewer, except on
        // the frame, the caption and the controls. Only the controls' buttons
        // act, because the enlarged frame has buttons of its own.
        viewer.addEventListener("click", (event) => {
          const button = event.target.closest(".controls button");
          if (!button) {
            if (!swiped && !event.target.closest(".frame, .controls, #viewer-caption")) viewer.close();
            return;
          }
          if (button.dataset.marks !== undefined) return flipMarks();
          if (button.dataset.step) return step(Number(button.dataset.step));
          if (button.id === "viewer-close") viewer.close();
        });

        // A tap in the space around the frame dismisses; a horizontal drag moves
        // on. The flag stops the click ending a swipe from also closing.
        let swipeX = 0;
        let swipeY = 0;
        let swiped = false;

        viewer.addEventListener("pointerdown", (event) => {
          swipeX = event.clientX;
          swipeY = event.clientY;
          swiped = false;
        });

        stage.addEventListener("pointerup", (event) => {
          if (states.length < 2) return;
          const dx = event.clientX - swipeX;
          if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(event.clientY - swipeY) * 1.5) return;
          swiped = true;
          step(dx < 0 ? 1 : -1);
        });

        document.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === ".") {
            event.preventDefault();
            return flipChrome();
          }
          if (event.target?.closest?.("input, textarea, select, [contenteditable]")) return;
          if (event.key === "a" || event.key === "A") {
            event.preventDefault();
            return flipMarks();
          }
          if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
          // From the rack, right opens the set at its first frame, so the whole
          // set can be walked from the keyboard without reaching for a pointer.
          // Nothing sits behind that frame, so left has nothing to do there.
          if (!viewer.open) {
            if (event.key === "ArrowLeft") return;
            event.preventDefault();
            return showFrame(0);
          }
          event.preventDefault();
          step(event.key === "ArrowRight" ? 1 : -1);
        });

        // The stage, not the window: this also catches the page being laid out
        // for the first time after being hidden, which fires no resize event.
        new ResizeObserver(() => {
          if (viewer.open) fitFrame();
        }).observe(stage);

        // ---- links to a frame ------------------------------------------------
        // `?frame=3` opens the page on the third frame enlarged, numbered as the
        // tiles are, so a link can send someone straight to the state in question.
        // A query rather than a fragment, because a fragment never reaches the
        // server that answers the link.
        // The line under the title is the page's description, which a link to
        // it shows under the title; a link to a frame describes that frame.
        const description =
          document.querySelector('meta[name="description"]') ??
          document.head.appendChild(Object.assign(document.createElement("meta"), { name: "description" }));
        const pageLine = document.querySelector("#line")?.textContent.trim() ?? "";
        const describe = (index) => {
          if (index === null) {
            description.content = pageLine;
            return;
          }
          const note = document.createElement("div");
          note.innerHTML = states[index].note;
          description.content = `${index + 1}. ${states[index].title}. ${note.textContent.trim()}`;
        };
        describe(null);

        const setFrameParam = (number) => {
          const url = new URL(location.href);
          if (number === null) url.searchParams.delete("frame");
          else url.searchParams.set("frame", String(number));
          // A srcdoc or sandboxed host refuses any rewrite beyond the fragment,
          // and the page works the same without the link.
          try {
            history.replaceState(null, "", url);
          } catch {}
        };

        // Some viewers reload the page without the ?frame= query, so we also
        // save the open frame in session storage and reopen it on load. We find
        // it by title, so adding a frame above it still reopens the same one.
        // If its title changed, we use its number.
        const keptKey = `wireframe-frame:${location.pathname}:${document.title}`;
        const keepFrame = (index) => {
          try {
            if (index === null) sessionStorage.removeItem(keptKey);
            else sessionStorage.setItem(keptKey, JSON.stringify({ title: states[index].title, index }));
          } catch {}
        };
        const keptFrame = () => {
          try {
            const kept = JSON.parse(sessionStorage.getItem(keptKey) ?? "null");
            if (!kept) return -1;
            const byTitle = states.findIndex((state) => state.title === kept.title);
            return byTitle >= 0 ? byTitle : kept.index < states.length ? kept.index : -1;
          } catch {
            return -1;
          }
        };

        const openFromQuery = () => {
          const index = Number(new URLSearchParams(location.search).get("frame")) - 1;
          if (Number.isInteger(index) && index >= 0 && index < states.length) return showFrame(index);
          const kept = keptFrame();
          if (kept >= 0) showFrame(kept);
        };

        viewer.addEventListener("close", () => {
          setFrameParam(null);
          keepFrame(null);
          describe(null);
        });
        openFromQuery();

        for (const button of document.querySelectorAll("[data-step]")) button.disabled = states.length < 2;
        }
      </script>
