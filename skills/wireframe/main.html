          const where = `${lead(i)}${s.title}`;
          if (found.length !== 1) {
            problems.push(`${where}: compare.with "${c.with}" ${found.length ? "names more than one frame; use its label, such as B2" : "names no other frame"}.`);
            return null;
          }
          if (!c.as) problems.push(`${where}: compare has no \`as\`, the words after "Compare with".`);
          return { j: found[0], as: c.as || states[found[0]].title };
        });
        const picks = states.flatMap((s, i) => (s.pick ? [i] : []));

        const tileHtml = (state, i) => `
          <figure class="tile m-0 flex flex-col overflow-hidden border-[0.5px] border-border bg-card p-3 break-inside-avoid">
            <div class="slot flex h-[var(--slot-h)] items-center justify-center">
              <div
                class="frame w-[calc(var(--w)*var(--s))] cursor-zoom-in overflow-hidden rounded-sm ring-[0.5px] ring-border h-[calc(var(--h)*var(--s))]"
                data-w="${state.w || W}"
                data-h="${state.h || H}"
                style="--w:${state.w || W}px; --h:${state.h || H}px; --s:0.2"
              >
                <div class="relative w-[var(--w)] origin-top-left scale-[var(--s)] h-[var(--h)]">${state.body}</div>
              </div>
            </div>
            <figcaption class="mt-3 text-xs leading-5 text-muted-foreground/80">
              <span class="font-medium text-foreground/70">${labelHtml(i)}${state.title}.</span> ${state.note}
            </figcaption>
          </figure>`;

        // Frames in page order: a run of one group's frames goes into one
        // section under its heading, and a frame outside any group stands
        // loose in the grid.
        const runs = [];
        states.forEach((state, i) => {
          const g = groupOf(i);
          if (g && runs.at(-1)?.g?.k === g.k) runs.at(-1).tiles.push(tileHtml(state, i));
          else runs.push({ g, tiles: [tileHtml(state, i)] });
        });
        rack.innerHTML = runs
          .map(({ g, tiles }) => (g ? `<section class="group tone-${g.tone}">${heading(g)}${tiles.join("")}</section>` : tiles.join("")))
          .join("");
        if (problems.length) {
          const list = document.createElement("div");
          list.className = "col-span-full rounded-md border border-error-500 p-3 text-[12px] leading-5 text-error-700";
          list.setAttribute("role", "alert");
          for (const p of problems) list.append(Object.assign(document.createElement("p"), { textContent: p }));
          rack.prepend(list);
          console.error(`wireframe: ${problems.join(" ")}`);
        }

        // ---- marks -----------------------------------------------------------
        // Measures each marked element against its frame in true-size pixels,
        // so the layer scales with the drawing and the enlarged copy, a clone,
        // carries it along. A narrow thing takes its tag beside it at the right,
        // a wide one above it, a whole pane inside its own corner; each falls
        // back to the next, then to below.
        const MARK_PAD = 5;
        const TAG_H = 18;

        const drawMarks = () => {
          for (const root of rack.querySelectorAll(".frame > *")) {
            root.querySelector(".marks")?.remove();
            const markers = [...root.querySelectorAll("i.mark")];
            if (markers.length === 0) continue;
            const frame = root.parentElement;
            const s = parseFloat(frame.style.getPropertyValue("--s")) || 1;
            const fw = Number(frame.dataset.w);
            const fh = Number(frame.dataset.h);
            const rr = root.getBoundingClientRect();
            // A ring and a pointer on one element draw as one mark.
            const groups = new Map();
            for (const m of markers) {
              const el = m.parentElement;
              const g = groups.get(el) || { el, label: m.dataset.label, tone: m.dataset.tone, pointer: false };
              if ("pointer" in m.dataset) g.pointer = true;
              else Object.assign(g, { label: m.dataset.label, tone: m.dataset.tone });
              groups.set(el, g);
            }
            const layer = document.createElement("div");
            layer.className = "marks ann";
            for (const g of groups.values()) {
              const r = g.el.getBoundingClientRect();
              if (r.width === 0 || r.height === 0) continue;
              const left = (r.left - rr.left) / s - MARK_PAD;
              const top = (r.top - rr.top) / s - MARK_PAD;
              const width = r.width / s + MARK_PAD * 2;
              const height = r.height / s + MARK_PAD * 2;
              const tagW = g.label.length * 7 + (g.pointer ? 15 : 0) + 12;
              const beside = left + width + 6 + tagW <= fw;
              const above = top - TAG_H - 4 >= 0;
              let tagLeft = Math.max(0, Math.min(left, fw - tagW));
              let tagTop = top - TAG_H - 4;
              if (height > 240) {
                tagLeft = left + 8;
                tagTop = top + 8;
              } else if (beside && (width < fw * 0.4 || !above)) {
                tagLeft = left + width + 6;
                tagTop = top + (height - TAG_H) / 2;
              } else if (!above) {
                tagTop = top + height + 4 + TAG_H <= fh ? top + height + 4 : top + 3;
              }
              const tone = TONE[g.tone] || TONE.click;
              layer.insertAdjacentHTML(
                "beforeend",
                `<span class="mark-ring" style="left:${left}px;top:${top}px;width:${width}px;height:${height}px;--line:${tone.line}"></span>` +
                  `<span class="mark-tag" style="left:${tagLeft}px;top:${tagTop}px;--tag:${tone.tag}">${g.pointer ? `<i class="ph ph-cursor"></i>` : ""}<span data-chrome-text="${g.label.replaceAll('"', "&quot;")}"></span></span>`,
              );
              // The Markdown a shared link answers with holds every element's
              // text, hidden or not, so the tag's word is drawn from an
              // attribute like the page's own controls, and the mark reads as
              // this line instead: its word and what it sits on, the element's
              // words or, for an icon alone, the icon's name.
              const words = g.el.textContent.replace(/\s+/g, " ").trim();
              const icons = [...g.el.querySelectorAll("i.ph")].map((i) => /\bph-([\w-]+)/.exec(i.className)?.[1].replaceAll("-", " ")).join(", ");
              const on = words.length > 60 ? `${words.slice(0, 60)}…` : words || icons;
              const note = document.createElement("p");
              note.className = "mark-note";
              note.textContent = `(${g.label} mark${on ? `: ${on}` : ""})`;
              layer.append(note);
            }
            root.appendChild(layer);
          }
        };

        // Idempotent, so it runs at every point text can have moved: now, once
        // the browser Tailwind build has applied, when the fonts settle, and
        // after load.
        drawMarks();
        setTimeout(drawMarks, 250);
        document.fonts?.ready.then(() => setTimeout(drawMarks, 0));
        document.fonts?.addEventListener("loadingdone", drawMarks);
        window.addEventListener("load", () => setTimeout(drawMarks, 300));

        // ---- density ---------------------------------------------------------
        // Fit as many tiles per row as the width allows, then derive each frame's
        // scale from the tile. Nothing ever renders above its true size. The
        // slider in the title bar sets the count instead, from one frame at the
        // full width to four across, or more where the width already fits more.
        const GAP = 8;
        const PAD = 25; // tile padding plus its border
        // The most tiles the slider offers in a row, by the width of the
        // screen: four from a laptop up, three on a tablet held upright, two
        // on a phone on its side, and one on a phone held upright, where the
        // slider hides. Most phones on their side are wider than a tablet held
        // upright, so they are told apart by their short height under a touch
        // pointer instead.
        const MOST = [
          [1024, 4],
          [744, 3],
          [480, 2],
          [0, 1],
        ];
        const sideways = matchMedia("(pointer: coarse) and (orientation: landscape) and (max-height: 500px)");
        const views = document.querySelector("#views");
        const perRow = document.querySelector("#per-row");
        const [oneButton, mostButton] = views.querySelectorAll("button");
        // What the reader set the slider to. Until then the width decides, and
        // goes on deciding as the window changes. Like the open frame, the
        // setting stays through a reload in the same tab.
        const perRowKey = `wireframe-per-row:${location.pathname}:${document.title}`;
        let chosen = 0;
        try {
          chosen = Number(sessionStorage.getItem(perRowKey)) || 0;
        } catch {}
        const choose = (columns) => {
          chosen = columns;
          try {
            sessionStorage.setItem(perRowKey, String(columns));
          } catch {}
          layout();
        };

        const layout = () => {
          const avail = rack.clientWidth;
          if (avail <= 0) return;
          const natural = Math.max(1, Math.floor((avail + GAP) / (TILE_MIN + GAP)));
          let most = MOST.find(([from]) => innerWidth >= from)[1];
          if (sideways.matches) most = Math.min(most, 2);
          // A screen that already fits more than four keeps them.
          if (most === MOST[0][1]) most = Math.max(most, natural);
          const columns = Math.min(chosen || natural, most);
          const single = columns === 1;
          views.hidden = most < 2;
          perRow.max = most;
          perRow.value = columns;
          perRow.style.setProperty("--stops", most);
          perRow.title = single ? "One per row" : `${columns} per row`;
          perRow.setAttribute("aria-valuetext", perRow.title);
          mostButton.title = `${most} per row`;
          // The icon at whichever end the slider rests on lights, as the
          // picked half of a toggle would.
          oneButton.classList.toggle("text-foreground", single);
          mostButton.classList.toggle("text-foreground", columns === most);
          const inner = (avail - GAP * (columns - 1)) / columns - PAD;
          rack.style.setProperty("--cols", columns);
          const frames = [...rack.querySelectorAll(".frame")];
          const widthFit = (frame) => Math.min(inner / Number(frame.dataset.w), 1);
          // In the grid every tile shares one slot height, so captions line up
          // down the whole grid even where frames mix aspect ratios. The slot is
          // as tall as the middle frame of the set drawn at the tile's full
          // width, so a typical frame reaches both edges of its tile and only an
          // unusually tall one is capped by the slot and centered in it.
          const heights = frames.map((frame) => Number(frame.dataset.h) * widthFit(frame)).sort((a, b) => a - b);
          const slot = heights[Math.floor(heights.length / 2)] ?? 0;
          for (const frame of frames) {
            // One column has no row to keep even, so the frame scales by width
            // alone and the slot shrinks to match rather than centering it in a
            // height sized for the grid.
            const fit = single ? widthFit(frame) : Math.min(widthFit(frame), slot / Number(frame.dataset.h));
            const s = Math.max(0.05, fit);
            frame.style.setProperty("--s", s);
            frame.closest(".slot").style.setProperty("--slot-h", `${single ? Number(frame.dataset.h) * s : slot}px`);
          }
        };

        new ResizeObserver(layout).observe(rack);
        layout();

        perRow.addEventListener("input", () => choose(Number(perRow.value)));

        views.addEventListener("click", (event) => {
          const button = event.target.closest("[data-to]");
          if (!button) return;
          choose(Number(perRow[button.dataset.to]));
        });

        // ---- annotations on and off ------------------------------------------
        // One attribute on the body, so the grid and the enlarged copy of a frame
        // answer to the same switch and there is no second state to keep in step.
        // The marks start off, and only data-marks="on" shows them.
        // The frames underneath are the design; this is what was said about them.
        // In the grid the switch is an item in the ⋯ menu; in the viewer it's
        // a button, pressed while the marks are on.
        const marksItem = document.querySelector("#marks");
        const viewerMarks = document.querySelector("#viewer [data-marks]");

        const paintMarks = () => {
          const on = document.body.dataset.marks === "on";
          marksItem.querySelector("span").dataset.chromeText = on ? "Hide callouts" : "Show callouts";
          marksItem.setAttribute("aria-label", on ? "Hide callouts" : "Show callouts");
          viewerMarks.title = on ? "Hide the callouts (A)" : "Show the callouts (A)";
          viewerMarks.setAttribute("aria-pressed", String(on));
        };

        const flipMarks = () => {
          document.body.dataset.marks = document.body.dataset.marks === "on" ? "off" : "on";
          paintMarks();
        };

        marksItem.addEventListener("click", () => {
          document.querySelector("#more-menu").hidePopover();
          flipMarks();
        });
        paintMarks();

        // ---- chrome ----------------------------------------------------------
        // Cmd+. (Ctrl+. off a Mac) hides everything around the frames: the
        // title bar, the source line, the share widget, and the viewer's
        // buttons and caption. Press it again to bring them back. Like the
        // open frame, it stays that way through a reload in the same tab.
        const chromeKey = `wireframe-chrome:${location.pathname}:${document.title}`;
        const flipChrome = () => {
          const off = document.body.dataset.chrome !== "off";
          document.body.dataset.chrome = off ? "off" : "on";
          try {
            if (off) sessionStorage.setItem(chromeKey, "off");
            else sessionStorage.removeItem(chromeKey);
          } catch {}
        };
        try {
          if (sessionStorage.getItem(chromeKey) === "off") document.body.dataset.chrome = "off";
        } catch {}
        const onMac = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform ?? navigator.platform);
        const shortcut = onMac ? "⌘." : "Ctrl+.";
        for (const hint of document.querySelectorAll(".chrome-hint span")) {
          hint.dataset.chromeText = `Press ${shortcut} to show controls`;
        }

        // The ⋯ menu opens under the bar's buttons, lined up with their right
        // edge so it stays inside the window.
        const more = document.querySelector("#more");
        const moreMenu = document.querySelector("#more-menu");
        moreMenu.querySelector("[data-hide-controls] kbd").dataset.chromeText = shortcut;
        moreMenu.addEventListener("beforetoggle", (event) => {
          if (event.newState !== "open") return;
          const button = more.getBoundingClientRect();
          moreMenu.style.top = `${button.bottom + 4}px`;
          moreMenu.style.right = `${document.documentElement.clientWidth - more.parentElement.getBoundingClientRect().right}px`;
        });
        moreMenu.querySelector("[data-hide-controls]").addEventListener("click", () => {
          moreMenu.hidePopover();
          flipChrome();
        });
        // The hint shows when the pointer is over the hint's own box. Both
        // copies sit in the same corner, and while the controls are shown
        // the box measures nothing, so this never fires then.
        const hintBox = document.querySelector(".chrome-hint");
        addEventListener("pointermove", (event) => {
          const box = hintBox.getBoundingClientRect();
          const near = event.clientX >= box.left && event.clientX <= box.right && event.clientY >= box.top && event.clientY <= box.bottom;
          if (near !== document.body.hasAttribute("data-corner")) document.body.toggleAttribute("data-corner", near);
        });
        document.documentElement.addEventListener("pointerleave", () => document.body.removeAttribute("data-corner"));

        // ---- enlarge ---------------------------------------------------------
        // Everything is reachable by tap as well as by key: prev and next
        // buttons, a horizontal swipe, an explicit close. On a phone there is no
        // hover and no Escape to fall back on.
        const viewer = document.querySelector("#viewer");
        const stage = document.querySelector("#stage");
        const viewerTop = document.querySelector("#viewer-top");
        const viewerBottom = document.querySelector("#viewer-bottom");
        const viewerCaption = document.querySelector("#viewer-caption");
        const viewerCounter = document.querySelector("#viewer-counter");
        const viewerLabel = document.querySelector("#viewer-label");
        const viewerPick = document.querySelector("#viewer-pick");
        const viewerTitle = document.querySelector("#viewer-title");
        const viewerMap = document.querySelector("#viewer-map");
        const viewerZoom = document.querySelector("#viewer-zoom");
        const compareButton = viewerTop.querySelector("[data-compare]");
        const picksButton = viewerTop.querySelector("[data-picks]");
        const coarse = matchMedia("(pointer: coarse)");
        // A phone on its side has little height to give the frame.
        const short = matchMedia("(max-height: 500px)");
        let openIndex = -1;

        const frameOf = () => stage.querySelector(".frame");
        const sizeOf = (frame = frameOf()) => ({ w: Number(frame.dataset.w), h: Number(frame.dataset.h) });
        // The bands over the stage. The frame fits between them, so their
        // heights are part of every measurement; they keep their height while
        // hidden or faded, so neither moves anything. The top band is
        // measured with the note folded, so a note opened to read never
        // moves the frame.
        let topH = 0;
        let bottomH = 0;
        const measureBand = () => {
          const open = viewerTop.hasAttribute("data-open");
          viewerTop.toggleAttribute("data-open", false);
          topH = viewerTop.offsetHeight;
          viewerTop.toggleAttribute("data-more", viewerCaption.scrollWidth > viewerCaption.clientWidth + 1);
          viewerTop.toggleAttribute("data-open", open);
          bottomH = viewerBottom.offsetHeight;
          viewer.style.setProperty("--bottom-h", `${bottomH}px`);
        };
        const topReserve = () => topH;
        const bands = () => ({ top: topH, bottom: bottomH });
        // Room round the frame at fit: none on a phone, where every pixel of
        // width is the drawing's.
        const pad = () => (innerWidth < 640 || short.matches ? 0 : 16);
        const fitScale = (frame = frameOf()) => {
          const { w, h } = sizeOf(frame);
          const p = pad();
          return Math.max(0.05, Math.min((stage.clientWidth - p * 2) / w, (stage.clientHeight - topH - bottomH - p * 2) / h));
        };

        // ---- the note and the thumbnail --------------------------------------
        // The note keeps to one line, and a tap on it opens the whole note
        // over the frame, as tall as two fifths of the screen if it must be,
        // until the next tap or the next frame. The thumbnail appears while
        // the frame is zoomed.
        viewerCaption.addEventListener("click", () => {
          // A drag that selected some of the note is not a tap on it.
          if (getSelection()?.toString()) return;
          if (!viewerTop.hasAttribute("data-more") && !viewerTop.hasAttribute("data-open")) return;
          viewerTop.toggleAttribute("data-open", !viewerTop.hasAttribute("data-open"));
        });

        // The thumbnail is a third copy of the frame, drawn at the width the
        // map has, with the part on screen boxed. `window` is the visible
        // part in the frame's own pixels.
        const paintMap = (zoomed, window) => {
          const frame = frameOf();
          if (!frame || !zoomed) {
            viewerMap.hidden = true;
            return;
          }
          const { w, h } = sizeOf(frame);
          const mw = coarse.matches ? 88 : 120;
          const ms = mw / w;
          viewerMap.hidden = false;
          if (viewerMap.dataset.for !== String(openIndex)) {
            viewerMap.dataset.for = String(openIndex);
            const copy = frame.cloneNode(true);
            copy.style.setProperty("--s", ms);
            copy.style.transform = "";
            viewerMap.querySelector(".map-frame").replaceChildren(copy);
            viewerMap.style.width = `${mw}px`;
            viewerMap.style.height = `${h * ms}px`;
          }
          const box = viewerMap.querySelector(".map-view");
          const x0 = Math.max(0, window.x0);
          const y0 = Math.max(0, window.y0);
          box.style.left = `${x0 * ms}px`;
          box.style.top = `${y0 * ms}px`;
          box.style.width = `${(Math.min(w, window.x1) - x0) * ms}px`;
          box.style.height = `${(Math.min(h, window.y1) - y0) * ms}px`;
        };
        // A tap or a drag on the map puts that spot in the middle of the screen.
        const mapPoint = (event) => {
          const r = viewerMap.getBoundingClientRect();
          const { w } = sizeOf();
          const ms = r.width / w;
          return { fx: (event.clientX - r.left) / ms, fy: (event.clientY - r.top) / ms };
        };
        viewerMap.addEventListener("pointerdown", (event) => {
          event.stopPropagation();
          viewerMap.setPointerCapture(event.pointerId);
          lookAt(mapPoint(event));
        });
        viewerMap.addEventListener("pointermove", (event) => {
          if (event.buttons) lookAt(mapPoint(event));
        });

        // The scale shows only while the frame is zoomed, and a tap on it
        // is the way back to fit.
        const paintReadout = (zoomed) => {
          viewerZoom.hidden = !zoomed;
          if (zoomed) viewerZoom.firstElementChild.dataset.chromeText = `${Math.round(view.s * 100)}%`;
        };
        viewerZoom.addEventListener("click", () => toFit(true));

        // The point to open at true size: the frame's first mark if it has
        // one, since that is what the frame is about, else its middle.
        const focusPoint = () => {
          const frame = frameOf();
          const { w, h } = sizeOf(frame);
          const ring = frame.querySelector(".mark-ring");
          if (!ring) return { fx: w / 2, fy: h / 2 };
          return {
            fx: parseFloat(ring.style.left) + parseFloat(ring.style.width) / 2,
            fy: parseFloat(ring.style.top) + parseFloat(ring.style.height) / 2,
          };
        };

        // ---- the open frame ------------------------------------------------
        // The viewer shows one frame, or the open frame beside the one the
        // agent paired it with. Three values say what: openIndex; comparing,
        // which once on stays on from frame to frame, showing a pair wherever
        // the open frame has one and room allows; and picksOnly, which keeps
        // the walk to the recommended frames.
        // showFrame() paints everything from those, so every way in (keys,
        // buttons, the strip, a tap on a pane, a link) sets them and calls
        // it, and nothing else on screen keeps state of its own.
        let comparing = false;
        let picksOnly = false;
        const pair = document.querySelector("#pair");
        const viewerStrip = document.querySelector("#viewer-strip");
        const tiles = () => rack.querySelectorAll(".frame");
        // A phone has no room for two, upright or on its side.
        const canCompare = (i) => pairs[i] !== null && innerWidth > 640 && !short.matches;
        const paired = () => comparing && canCompare(openIndex);
        const partner = () => (paired() ? pairs[openIndex].j : null);
        const toneOf = (i) => `tone-${groupOf(i)?.tone ?? "plain"}`;

        const showFrame = (index) => {
          const tile = tiles()[index];
          if (!tile) return;
          const before = frameOf() ? sizeOf() : null;
          openIndex = index;
          stage.querySelector(".frame")?.remove();
          paintHead();
          paintStrip();
          if (!viewer.open) viewer.showModal();
          fitStrip();
          viewerTop.removeAttribute("data-open");
          measureBand();
          viewerMap.dataset.for = "";
          if (!paired()) {
            pair.hidden = true;
            pair.replaceChildren();
            const copy = tile.cloneNode(true);
            mount(copy);
            // A frame the size of the last keeps the view, so a set that
            // walks one screen through its states is read at one spot across
            // them. Any other size opens at fit.
            const same = before && before.w === Number(copy.dataset.w) && before.h === Number(copy.dataset.h);
            if (same) relayout();
            else toFit(false);
          } else {
            setZoomed(false);
            viewerZoom.hidden = true;
            viewerMap.hidden = true;
            paintPair();
          }
          // Replaced rather than pushed, so walking the set leaves one history
          // entry and the address bar always holds a link to the frame on screen.
          setFrameParam(index + 1);
          keepFrame(index);
          describe(index);
        };

        // The title block: place, label and star, title, the Compare button
        // when the frame has a pair, and the note under them. The switches
        // at the right follow what is on.
        const paintHead = () => {
          const state = states[openIndex];
          const g = groupOf(openIndex);
          viewerCounter.innerHTML = `${openIndex + 1}<span>/${states.length}</span>`;
          viewerLabel.className = toneOf(openIndex);
          viewerLabel.textContent = g ? label(openIndex) : "";
          viewerPick.className = toneOf(openIndex);
          viewerPick.hidden = !state.pick;
          viewerPick.innerHTML = state.pick ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.94 6.1 6.56.8-4.84 4.56 1.24 6.54L12 17.3l-5.9 3.2 1.24-6.54L2.5 9.4l6.56-.8z"/></svg>` : "";
          viewerPick.title = recommended(openIndex);
          viewerTitle.textContent = state.title;
          viewerCaption.innerHTML = state.note;
          const p = pairs[openIndex];
          compareButton.hidden = !p;
          compareButton.className = `vbtn ${toneOf(openIndex)}`;
          compareButton.setAttribute("aria-pressed", String(comparing));
          if (p) {
            compareButton.querySelector(".word").textContent = `Compare with ${p.as}`;
            compareButton.title = comparing ? "Back to this frame alone (C)" : `${lead(p.j)}${states[p.j].title} beside this one (C)`;
          }
          picksButton.hidden = picks.length === 0;
          picksButton.className = `vbtn ${toneOf(picks.includes(openIndex) ? openIndex : (picks[0] ?? openIndex))}`;
          picksButton.setAttribute("aria-pressed", String(picksOnly));
          picksButton.title = picksOnly ? "Show every frame (R)" : "Show only the recommended frames (R)";
        };

        // ---- the strip -------------------------------------------------------
        // Only a page with groups has one. Every frame gets a bar, in page
        // order, in runs: a group's frames in its color, and frames outside
        // any group, such as a lead-in shared by every option, in a neutral
        // run of their own. The open frame's bar is the large one, a
        // recommended frame is a star, and the frame compared with the open
        // one is ringed. A tap on a bar opens that frame.
        // Under the open run, the frame's label as the title block shows it,
        // and the group's name after a letter: "A2 First option", or
        // "Inbox 2" where the mark is a word and so the name already.
        const stripName = () => {
          const g = groupOf(openIndex);
          const tag = label(openIndex) ? `<span class="pos">${label(openIndex)}</span>` : "";
          return g && g.mark.length <= 1 && g.name ? `${tag}<span>${g.name}</span>` : tag;
        };
        const paintStrip = () => {
          viewerStrip.hidden = groupKeys.length === 0;
          if (viewerStrip.hidden) return;
          const runs = [];
          states.forEach((_, i) => {
            const k = groupOf(i)?.k ?? -1;
            if (runs.at(-1)?.k === k) runs.at(-1).frames.push(i);
            else runs.push({ k, tone: k < 0 ? "tone-plain" : `tone-${groupAt(k).tone}`, frames: [i] });
          });
          const g = groupOf(openIndex);
          const other = partner();
          const bar = (i) => {
            const name = `${lead(i)}${states[i].title}${states[i].pick ? ` · ${recommended(i)}` : ""}`;
            const cls = [i < openIndex ? "passed" : "", i === other ? "partner" : "", states[i].pick ? "pick" : ""].filter(Boolean).join(" ");
            return `<button data-go="${i}" title="${name}" aria-label="${name}" class="${cls}"${i === openIndex ? ' aria-current="true"' : ""}></button>`;
          };
          viewerStrip.toggleAttribute("data-only", picksOnly);
          viewerStrip.innerHTML = `<div class="bars">${runs
            .map((run) => `<span class="run ${run.tone}">${run.frames.map(bar).join("")}</span>`)
            .join("")}<span class="name ${g ? `tone-${g.tone}` : "tone-plain"}">${stripName()}</span></div>`;
        };

        // Every bar the same width, the widest that keeps the strip on one row:
        // 10px when there is room, down to 3px, with the gaps tightened once
        // bars drop under 6px. The open frame's bar keeps its 14px. Then the
        // group's name goes under the middle of its run, or of the open star
        // when only the stars show, moved in as far as it must be to stay
        // inside the strip.
        const fitStrip = () => {
          if (viewerStrip.hidden) return;
          const n = states.length;
          const runs = viewerStrip.querySelectorAll(".run").length;
          const room = viewerStrip.clientWidth - 14;
          const widest = (gap, runGap) => Math.floor((room - (runs - 1) * runGap - (n - runs) * gap) / Math.max(1, n - 1));
          let [gap, runGap] = [3, 8];
          if (widest(gap, runGap) < 6) [gap, runGap] = [2, 6];
          viewerStrip.style.setProperty("--bar", `${Math.max(3, Math.min(10, widest(gap, runGap)))}px`);
          viewerStrip.style.setProperty("--gap", `${gap}px`);
          viewerStrip.style.setProperty("--run-gap", `${runGap}px`);
          const name = viewerStrip.querySelector(".name");
          const current = viewerStrip.querySelector("[aria-current]");
          if (!name || !current) return;
          const under = picksOnly ? current : current.parentElement;
          const bars = name.parentElement;
          const center = under.offsetLeft + under.offsetWidth / 2;
          const x = Math.max(-bars.offsetLeft, Math.min(viewerStrip.clientWidth - bars.offsetLeft - name.offsetWidth, center - name.offsetWidth / 2));
          viewerStrip.style.setProperty("--name-x", `${Math.round(x)}px`);
        };

        // ---- moving between frames -------------------------------------------
        // With Recommended on, the arrows step from star to star.
        const step = (delta) => {
          if (picksOnly && picks.length) {
            const at = picks.indexOf(openIndex);
            const next = at >= 0 ? picks[(at + delta + picks.length) % picks.length] : (delta > 0 ? picks.find((i) => i > openIndex) ?? picks[0] : picks.findLast((i) => i < openIndex) ?? picks.at(-1));
            return showFrame(next);
          }
          showFrame((openIndex + delta + states.length) % states.length);
        };

        // R, or the Recommended button, keeps the walk to the starred frames.
        // Turned on away from a star, it opens the star of the frame's own
        // group, else the next one.
        const setPicks = (on) => {
          if (picks.length === 0) return;
          picksOnly = on;
          if (on && !picks.includes(openIndex)) {
            const g = groupOf(openIndex)?.k;
            const own = picks.find((i) => g !== undefined && groupOf(i)?.k === g);
            return showFrame(own ?? picks.find((i) => i > openIndex) ?? picks[0]);
          }
          showFrame(openIndex);
        };

        // ---- compare ---------------------------------------------------------
        // C, or the Compare button, puts the frame the agent paired with this
        // one at its left, each fitted to half the stage under its label and
        // title. C again, a zoom key, or a tap on either frame goes back to
        // that frame alone, where the zoom works.
        const setCompare = (on) => {
          if (on && !canCompare(openIndex)) return;
          comparing = on;
          showFrame(openIndex);
        };

        const pane = (i) => {
          const copy = tiles()[i].cloneNode(true);
          copy.style.transform = "";
          return `<figure class="pane" data-index="${i}"><figcaption class="pane-head">${labelHtml(i)}<span class="font-medium">${states[i].title}</span></figcaption><div class="pane-slot">${copy.outerHTML}</div></figure>`;
        };
        const paintPair = () => {
          pair.innerHTML = pane(partner()) + pane(openIndex);
          pair.hidden = false;
          fitPair();
        };
        // Each copy is measured at a token size first, so a frame copied at
        // the grid's scale can't widen its column before the fit is known.
        // Then both panes move down together by half the height the taller
        // frame leaves, so the pair sits in the middle with each label
        // right above its frame.
        const fitPair = () => {
          pair.style.top = `${topH}px`;
          pair.style.bottom = `${bottomH}px`;
          const panes = [...pair.querySelectorAll(".pane")];
          let spare = Infinity;
          for (const pane of panes) {
            pane.style.transform = "";
            const slot = pane.querySelector(".pane-slot");
            const frame = slot.firstElementChild;
            frame.style.setProperty("--s", 0.01);
            const s = Math.min(slot.clientWidth / Number(frame.dataset.w), slot.clientHeight / Number(frame.dataset.h));
            frame.style.setProperty("--s", s);
            spare = Math.min(spare, slot.clientHeight - Number(frame.dataset.h) * s);
          }
          for (const pane of panes) pane.style.transform = `translateY(${Math.max(0, spare / 2)}px)`;
        };
        pair.addEventListener("click", (event) => {
          const chosen = event.target.closest(".pane");
          if (!chosen) return;
          comparing = false;
          showFrame(Number(chosen.dataset.index));
        });

        // ---- ways in ---------------------------------------------------------
        rack.addEventListener("click", (event) => {
          const frame = event.target.closest(".frame");
          if (frame) showFrame([...tiles()].indexOf(frame));
        });
        viewerStrip.addEventListener("click", (event) => {
          const bar = event.target.closest("[data-go]");
          if (bar) showFrame(Number(bar.dataset.go));
        });
        viewer.addEventListener("click", (event) => {
          const button = event.target.closest("#viewer-top button, #viewer-bottom button:not([data-go])");
          if (!button) return;
          if (button.dataset.marks !== undefined) return flipMarks();
          if (button.dataset.compare !== undefined) return setCompare(!comparing);
          if (button.dataset.picks !== undefined) return setPicks(!picksOnly);
          if (button.dataset.step) return step(Number(button.dataset.step));
          if (button.id === "viewer-close") viewer.close();
        });
        viewer.addEventListener("close", () => {
          openIndex = -1;
          comparing = false;
          picksOnly = false;
          stage.querySelector(".frame")?.remove();
          pair.hidden = true;
          pair.replaceChildren();
          viewer.removeAttribute("data-controls");
          viewer.removeAttribute("data-zoomed");
          setFrameParam(null);
          keepFrame(null);
          describe(null);
        });

        // A tap on the ground hides the bands and brings them back, or, while
        // zoomed, brings the faded controls back and fades them again; a double
        // tap zooms in at that spot, or back to fit. A single mouse click does
        // nothing, since it is so often only a click to focus the window; a
        // double click zooms, and Escape or the close button closes.
        let tapTimer = 0;
        let lastTap = null;
        const tapped = (type, p) => {
          if (type === "mouse") return;
          const now = performance.now();
          if (lastTap && now - lastTap.t < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40) {
            clearTimeout(tapTimer);
            lastTap = null;
            return doubleTap(p);
          }
          lastTap = { t: now, ...p };
          tapTimer = setTimeout(() => {
            lastTap = null;
            const was = viewer.dataset.controls;
            viewer.dataset.controls = isZoomed ? (was === "shown" ? "faded" : "shown") : was === "hidden" ? "shown" : "hidden";
          }, 320);
        };
        // A double tap on a touch screen is handled above; some browsers also
        // send it as a double click, which must not undo it.
        let lastType = "mouse";
        stage.addEventListener("pointerdown", (event) => (lastType = event.pointerType), true);
        stage.addEventListener("dblclick", (event) => {
          if (lastType !== "mouse") return;
          doubleTap(local(event));
        });
        const local = (event) => {
          const r = stage.getBoundingClientRect();
          return { x: event.clientX - r.left, y: event.clientY - r.top };
        };

        // Safari announces a pinch of the page with its own events as well;
        // declining them is what keeps the page from zooming under the viewer.
        for (const name of ["gesturestart", "gesturechange"]) {
          viewer.addEventListener(name, (event) => event.preventDefault(), { passive: false });
        }

        // The zoom keys of a canvas: + and − step the scale, 0 fits, 1 is
        // true size. Cmd or Ctrl may be held for all but 1, since those are
        // the browser's keys for zooming the page, which must not happen
        // under the viewer. Cmd+1 stays the browser's.
        const zoomKeys = new Map([
          ["0", () => toFit(true)],
          ["1", () => toTrue(focusPoint())],
          ["=", () => zoomBy(1.25)],
          ["+", () => zoomBy(1.25)],
          ["-", () => zoomBy(1 / 1.25)],
          ["_", () => zoomBy(1 / 1.25)],
        ]);
        document.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === ".") {
            event.preventDefault();
            return flipChrome();
          }
          if (event.target?.closest?.("input, textarea, select, [contenteditable]")) return;
          const zoom = viewer.open && !event.altKey ? zoomKeys.get(event.key) : undefined;
          if (zoom && !(event.key === "1" && (event.metaKey || event.ctrlKey))) {
            event.preventDefault();
            if (comparing) setCompare(false);
            return zoom();
          }
          // With Cmd, Ctrl or Alt held the key belongs to the browser: select
          // all, back and forward.
          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (event.key === "a" || event.key === "A") {
            event.preventDefault();
            return flipMarks();
          }
          if (viewer.open && (event.key === "c" || event.key === "C")) {
            event.preventDefault();
            return setCompare(!comparing);
          }
          if (viewer.open && (event.key === "r" || event.key === "R")) {
            event.preventDefault();
            return setPicks(!picksOnly);
          }
          if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
          // From the rack, right opens the set at its first frame, so the whole
          // set can be walked from the keyboard without reaching for a pointer.
          // Nothing sits behind that frame, so left has nothing to do there.
          if (!viewer.open) {
            if (event.key === "ArrowLeft") return;
            event.preventDefault();
            return showFrame(0);
          }
          event.preventDefault();
          step(event.key === "ArrowRight" ? 1 : -1);
        });

        // The stage, not the window: this also catches the page being laid out
        // for the first time after being hidden, which fires no resize event.
        new ResizeObserver(() => {
          if (!viewer.open) return;
          fitStrip();
          if (comparing && pair.hidden === canCompare(openIndex)) showFrame(openIndex);
          else if (paired()) {
            measureBand();
            fitPair();
          } else if (frameOf()) relayout();
        }).observe(stage);

        // ---- the view: pinch, wheel, drag, double tap and keys ---------------
        // The frame's scale and where its top-left corner sits on the stage.
        // The view never goes below fit, and above it the frame can reach
        // four times its true size. A pinch scales the frame about the
        // fingers and a wheel with Cmd or Ctrl held about the pointer, a
        // drag moves it and keeps going for a moment when let go, a double
        // tap zooms in at that spot and back, and the zoom keys step the
        // scale about the middle of the screen.
        const view = { s: 1, x: 0, y: 0 };
        // The scale the frame's content was last drawn at. While the scale
        // moves, the compositor scales that drawing, which is cheap enough
        // for every frame of a pinch; at rest the content is drawn again at
        // the view's scale, so it is sharp.
        let raster = 1;
        // Whether the view is above fit. Set by the gestures and by the moves
        // to fit, never read off the view while it moves, so a glide through
        // fit cannot show and hide the thumbnail on the way.
        let isZoomed = false;
        const maxScale = () => Math.max(4, fitScale());
        // Zoomed, the controls fade; a zoom that starts after a tap brought
        // them back fades them again.
        const setZoomed = (z) => {
          if (z && !isZoomed && viewer.dataset.controls === "shown") delete viewer.dataset.controls;
          isZoomed = z;
          viewer.toggleAttribute("data-zoomed", z);
        };

        const mount = (copy) => {
          raster = view.s;
          copy.style.setProperty("--s", raster);
          copy.style.transform = `translate(${view.x}px, ${view.y}px)`;
          stage.appendChild(copy);
        };

        // Where the frame may sit at a scale: centered between the bands while
        // it fits there, else anywhere that leaves no edge short of them, so
        // every part of the frame can be brought into the clear.
        const clamp = (v) => {
          const { w, h } = sizeOf();
          const { top, bottom } = bands();
          const fw = w * v.s;
          const fh = h * v.s;
          const W = stage.clientWidth;
          const safeH = stage.clientHeight - top - bottom;
          v.x = fw <= W ? (W - fw) / 2 : Math.min(0, Math.max(W - fw, v.x));
          v.y = fh <= safeH ? top + (safeH - fh) / 2 : Math.min(top, Math.max(top + safeH - fh, v.y));
          return v;
        };

        // Applies the view as it stands.
        const place = () => {
          const frame = frameOf();
          if (!frame) return;
          clamp(view);
          frame.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s / raster})`;
          paintReadout(isZoomed);
          const { top, bottom } = bands();
          paintMap(isZoomed, {
            x0: -view.x / view.s,
            y0: (top - view.y) / view.s,
            x1: (stage.clientWidth - view.x) / view.s,
            y1: (stage.clientHeight - bottom - view.y) / view.s,
          });
        };

        // Draws the content again at the view's scale once the scale has
        // come to rest. `rerasterSoon` waits out a wheel still turning.
        let rasterTimer = 0;
        const reraster = () => {
          clearTimeout(rasterTimer);
          rasterTimer = 0;
          const frame = frameOf();
          if (!frame || raster === view.s) return;
          raster = view.s;
          frame.style.setProperty("--s", raster);
          place();
        };
        const rerasterSoon = () => {
          clearTimeout(rasterTimer);
          rasterTimer = setTimeout(reraster, 150);
        };

        // After a gesture moved the scale: above fit the view is zoomed; at
        // fit it is fit exactly, with the caption open.
        const settle = () => {
          const fit = fitScale();
          setZoomed(view.s > fit * 1.001);
          if (!isZoomed) view.s = fit;
          place();
        };

        // After the stage, the bands or the caption changed size: a view at
        // fit fits again, a zoomed one keeps its scale and stays in bounds.
        const relayout = () => {
          measureBand();
          if (!isZoomed) view.s = fitScale();
          place();
          reraster();
        };

        // A short glide between two views, so a jump reads as a move. `then`
        // runs once it lands.
        let glideId = 0;
        const stopGlide = () => {
          cancelAnimationFrame(glideId);
          glideId = 0;
        };
        const glide = (target, animate, then) => {
          stopGlide();
          stopFling();
          stopWheel();
          const land = () => {
            Object.assign(view, target);
            then?.();
            place();
            reraster();
          };
          if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return land();
          const from = { ...view };
          const t0 = performance.now();
          const tick = (t) => {
            const k = Math.min(1, (t - t0) / 220);
            if (k >= 1) {
              glideId = 0;
              return land();
            }
            const e = 1 - (1 - k) ** 3;
            view.s = from.s + (target.s - from.s) * e;
            view.x = from.x + (target.x - from.x) * e;
            view.y = from.y + (target.y - from.y) * e;
            place();
            glideId = requestAnimationFrame(tick);
          };
          glideId = requestAnimationFrame(tick);
        };

        // Back to fit. The thumbnail goes once the frame has landed.
        const toFit = (animate) => glide(clamp({ s: fitScale(), x: 0, y: 0 }), animate, () => setZoomed(false));
        // The middle of the clear part of the screen, between the bands.
        const clearCenter = () => {
          const { top, bottom } = bands();
          return { x: stage.clientWidth / 2, y: top + (stage.clientHeight - top - bottom) / 2 };
        };
        // True size with the frame point (fx, fy) in the middle of the clear
        // part of the screen.
        const toTrue = ({ fx, fy }) => {
          const s = Math.max(1, fitScale());
          // A screen that shows the frame at true size or above is at it already.
          if (s <= fitScale() * 1.001) return toFit(true);
          setZoomed(true);
          const c = clearCenter();
          glide(clamp({ s, x: c.x - fx * s, y: c.y - fy * s }), true);
        };
        const lookAt = ({ fx, fy }) => {
          const c = clearCenter();
          view.x = c.x - fx * view.s;
          view.y = c.y - fy * view.s;
          place();
        };
        // The frame point under a stage point.
        const pointAt = (p) => ({ fx: (p.x - view.x) / view.s, fy: (p.y - view.y) / view.s });
        // Scales about a stage point, keeping the frame point under it there.
        // A scale at or under fit is fit.
        const zoomTo = (s, p, animate) => {
          s = Math.min(maxScale(), Math.max(fitScale(), s));
          if (s <= fitScale() * 1.001) return toFit(animate);
          setZoomed(true);
          const k = s / view.s;
          glide(clamp({ s, x: p.x - (p.x - view.x) * k, y: p.y - (p.y - view.y) * k }), animate);
        };
        // One step of the zoom keys, about the middle of the clear part.
        const zoomBy = (k) => zoomTo(view.s * k, clearCenter(), true);
        // A double tap or click: back to fit from above it; else in, to true
        // size, or to twice fit where true size is no larger, about the spot.
        const doubleTap = (p) => (isZoomed ? toFit(true) : zoomTo(Math.max(1, fitScale() * 2), p, true));

        // ---- fingers ---------------------------------------------------------
        const pointers = new Map();
        let gesture = null;
        let flingId = 0;
        const stopFling = () => {
          cancelAnimationFrame(flingId);
          flingId = 0;
        };
        const pinchOf = () => {
          const [a, b] = [...pointers.values()];
          return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        };
        const startPan = (p, type, moved) => ({ kind: "pan", type, x0: p.x, y0: p.y, x: p.x, y: p.y, t: performance.now(), vx: 0, vy: 0, moved, slide: 0 });

        stage.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          stage.setPointerCapture(event.pointerId);
          const p = local(event);
          pointers.set(event.pointerId, p);
          stopFling();
          stopGlide();
          stopWheel();
          if (pointers.size === 1) gesture = startPan(p, event.pointerType, false);
          else if (pointers.size === 2) {
            const m = pinchOf();
            gesture = { kind: "pinch", d0: m.d, s0: view.s, fx: (m.x - view.x) / view.s, fy: (m.y - view.y) / view.s };
          }
        });

        stage.addEventListener("pointermove", (event) => {
          if (!pointers.has(event.pointerId) || !gesture) return;
          const p = local(event);
          pointers.set(event.pointerId, p);
          if (gesture.kind === "pinch") {
            if (pointers.size !== 2) return;
            const m = pinchOf();
            // The frame point that was between the fingers stays between them.
            view.s = Math.min(maxScale(), Math.max(fitScale(), (gesture.s0 * m.d) / gesture.d0));
            view.x = m.x - gesture.fx * view.s;
            view.y = m.y - gesture.fy * view.s;
            return settle();
          }
          const dx = p.x - gesture.x;
          const dy = p.y - gesture.y;
          const now = performance.now();
          const dt = Math.max(1, now - gesture.t);
          gesture.vx = 0.7 * (dx / dt) + 0.3 * gesture.vx;
          gesture.vy = 0.7 * (dy / dt) + 0.3 * gesture.vy;
          gesture.x = p.x;
          gesture.y = p.y;
          gesture.t = now;
          if (!gesture.moved && Math.hypot(p.x - gesture.x0, p.y - gesture.y0) < 6) return;
          gesture.moved = true;
          if (!isZoomed) {
            // At fit there is nowhere to go, so a sideways drag slides the frame
            // with the finger, as the start of a swipe to the next one.
            gesture.slide += dx;
            frameOf().style.transform = `translate(${view.x + gesture.slide / 2}px, ${view.y}px)`;
            return;
          }
          view.x += dx;
          view.y += dy;
          place();
        });

        const release = (event) => {
          if (!pointers.has(event.pointerId)) return;
          pointers.delete(event.pointerId);
          const g = gesture;
          if (!g) return;
          if (g.kind === "pinch") {
            // The finger still down carries on as a drag.
            if (pointers.size === 1) {
              const [p] = pointers.values();
              gesture = startPan(p, event.pointerType, true);
            } else gesture = null;
            reraster();
            return;
          }
          gesture = null;
          if (event.type === "pointercancel") return place();
          if (!g.moved) return tapped(g.type, { x: g.x0, y: g.y0 });
          if (!isZoomed) {
            if (states.length > 1 && Math.abs(g.slide) >= 48 && Math.abs(g.slide) > Math.abs(g.y - g.y0) * 1.5) return step(g.slide < 0 ? 1 : -1);
            return place();
          }
          // A finger lifted while moving keeps the frame going for a moment.
          if (performance.now() - g.t < 80 && Math.hypot(g.vx, g.vy) > 0.08) fling(g.vx, g.vy);
        };
        stage.addEventListener("pointerup", release);
        stage.addEventListener("pointercancel", release);

        const fling = (vx, vy) => {
          let last = performance.now();
          const tick = (now) => {
            const dt = Math.min(32, now - last);
            last = now;
            const x = view.x;
            const y = view.y;
            view.x += vx * dt;
            view.y += vy * dt;
            clamp(view);
            if (view.x === x) vx = 0;
            if (view.y === y) vy = 0;
            const decay = 0.994 ** dt;
            vx *= decay;
            vy *= decay;
            place();
            flingId = Math.hypot(vx, vy) > 0.02 ? requestAnimationFrame(tick) : 0;
          };
          flingId = requestAnimationFrame(tick);
        };

        // ---- wheel -----------------------------------------------------------
        // A wheel with Cmd or Ctrl held zooms about the pointer, which is also
        // how a trackpad pinch arrives; a plain wheel moves a zoomed frame.
        // Neither reaches the page. A pinch tracks the fingers as they are. A
        // mouse wheel's notches can be large, so with Cmd held, or past the
        // size a pinch sends, the view eases toward where the wheel has sent
        // it rather than jumping there.
        let wheelTarget = null;
        let wheelId = 0;
        const stopWheel = () => {
          cancelAnimationFrame(wheelId);
          wheelId = 0;
          wheelTarget = null;
        };
        const wheelStep = (rate) => {
          wheelId = 0;
          if (!wheelTarget) return;
          const { s, p } = wheelTarget;
          const next = rate === 1 || Math.abs(s - view.s) < 0.002 ? s : view.s + (s - view.s) * rate;
          const k = next / view.s;
          view.x = p.x - (p.x - view.x) * k;
          view.y = p.y - (p.y - view.y) * k;
          view.s = next;
          if (next !== s) {
            setZoomed(view.s > fitScale() * 1.001);
            place();
            wheelId = requestAnimationFrame(() => wheelStep(rate));
            return;
          }
          wheelTarget = null;
          settle();
          rerasterSoon();
        };
        const wheelZoom = (factor, p, eased) => {
          const s = Math.min(maxScale(), Math.max(fitScale(), (wheelTarget?.s ?? view.s) * factor));
          wheelTarget = { s, p };
          if (!eased) return wheelStep(1);
          if (!wheelId) wheelId = requestAnimationFrame(() => wheelStep(0.35));
        };
        stage.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            if (event.ctrlKey || event.metaKey) {
              const d = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
              const factor = Math.exp(-Math.max(-30, Math.min(30, d)) * 0.01);
              return wheelZoom(factor, local(event), event.metaKey || Math.abs(d) >= 30);
            }
            if (!isZoomed) return;
            stopWheel();
            view.x -= event.deltaX;
            view.y -= event.deltaY;
            place();
            rerasterSoon();
          },
          { passive: false },
        );

        // ---- links to a frame ------------------------------------------------
        // `?frame=3` opens the page on the third frame enlarged, numbered as the
        // tiles are, so a link can send someone straight to the state in question.
        // A query rather than a fragment, because a fragment never reaches the
        // server that answers the link.
        // The line under the title is the page's description, which a link to
        // it shows under the title; a link to a frame describes that frame.
        const description =
          document.querySelector('meta[name="description"]') ??
          document.head.appendChild(Object.assign(document.createElement("meta"), { name: "description" }));
        const pageLine = document.querySelector("#line")?.textContent.trim() ?? "";
        // The document's title names what is on screen, the open frame first,
        // so a tab, a history entry or a recording of the page can say which
        // frame was showing without knowing how this page is built.
        const pageTitle = document.title;
        const describe = (index) => {
          if (index === null) {
            description.content = pageLine;
            document.title = pageTitle;
            return;
          }
          const note = document.createElement("div");
          note.innerHTML = states[index].note;
          description.content = `${lead(index)}${states[index].title}. ${note.textContent.trim()}`;
          const shown = `${lead(index)}${states[index].title}`;
          document.title = pageTitle ? `${shown} · ${pageTitle}` : shown;
        };
        describe(null);

        const setFrameParam = (number) => {
          const url = new URL(location.href);
          if (number === null) url.searchParams.delete("frame");
          else url.searchParams.set("frame", String(number));
          // A srcdoc or sandboxed host refuses any rewrite beyond the fragment,
          // and the page works the same without the link.
          try {
            history.replaceState(null, "", url);
          } catch {}
        };

        // Some viewers reload the page without the ?frame= query, so we also
        // save the open frame in session storage and reopen it on load. We find
        // it by title, so adding a frame above it still reopens the same one.
        // If its title changed, we use its number.
        const keptKey = `wireframe-frame:${location.pathname}:${document.title}`;
        const keepFrame = (index) => {
          try {
            if (index === null) sessionStorage.removeItem(keptKey);
            else sessionStorage.setItem(keptKey, JSON.stringify({ title: states[index].title, index }));
          } catch {}
        };
        const keptFrame = () => {
          try {
            const kept = JSON.parse(sessionStorage.getItem(keptKey) ?? "null");
            if (!kept) return -1;
            const byTitle = states.findIndex((state) => state.title === kept.title);
            return byTitle >= 0 ? byTitle : kept.index < states.length ? kept.index : -1;
          } catch {
            return -1;
          }
        };

        const openFromQuery = () => {
          const index = Number(new URLSearchParams(location.search).get("frame")) - 1;
          if (Number.isInteger(index) && index >= 0 && index < states.length) return showFrame(index);
          const kept = keptFrame();
          if (kept >= 0) showFrame(kept);
        };

        openFromQuery();

        for (const button of document.querySelectorAll("[data-step]")) button.disabled = states.length < 2;
        }
      </script>
