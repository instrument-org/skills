<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TITLE</title>
    <!-- Lineage, so a future share button knows which idea made this file. -->
    <meta name="instrument:idea" content="one-pager@1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Roboto+Serif:opsz,wght@8..144,400;8..144,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css" />
    <style type="text/tailwindcss">
      /* skin:start */
      /* The one look every idea shares: Studio's light theme as Tailwind tokens, plus
         the one element these pages style directly, the link.
         A starter inlines this block verbatim inside its <style type="text/tailwindcss">,
         and scripts/check-ideas.ts fails when a starter's copy has drifted.
         `static` matters: without it Tailwind emits only the variables some utility
         on the page uses, so a var(--color-...) in generated SVG can resolve to
         nothing and the fill falls back to black. */
      @import "tailwindcss";

      @theme static {
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Roboto Serif", ui-serif, Georgia, serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

        --radius: 0.5rem;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);

        --shadow-sm:
          0 2px 4px 0 rgb(10 13 18 / 0.04), 0 1px 2px -1px rgb(10 13 18 / 0.06),
          0 0 0 1px rgb(10 13 18 / 0.06);
        --shadow-xl:
          0 12px 24px -4px rgb(10 13 18 / 0.07),
          0 6px 10px -6px rgb(10 13 18 / 0.07), 0 0 0 1px rgb(10 13 18 / 0.06);

        --color-gray-25: #fdfdfc;
        --color-gray-50: #fafaf9;
        --color-gray-100: #f5f5f4;
        --color-gray-200: #e7e5e4;
        --color-gray-300: #d7d3d0;
        --color-gray-400: #a9a29d;
        --color-gray-500: #79716b;
        --color-gray-600: #57534e;
        --color-gray-700: #44403c;
        --color-gray-800: #292524;
        --color-gray-900: #1c1917;
        --color-gray-950: #171412;

        --color-brand-25: #f1f4f2;
        --color-brand-50: #e2eae7;
        --color-brand-100: #c5d5d0;
        --color-brand-200: #9dbfb6;
        --color-brand-300: #6ca89c;
        --color-brand-400: #338c81;
        --color-brand-500: #0e7869;
        --color-brand-600: #0b6056;
        --color-brand-700: #0a4a42;
        --color-brand-800: #093a34;
        --color-brand-900: #082c28;
        --color-brand-950: #051b18;

        --color-error-50: #fbeef0;
        --color-error-100: #f8e4e8;
        --color-error-300: #e197a6;
        --color-error-500: #b4324f;
        --color-error-700: #7a1f30;
        --color-error-900: #3f121a;

        --color-warning-50: #fffaeb;
        --color-warning-100: #fef0c7;
        --color-warning-300: #fec84b;
        --color-warning-500: #f79009;
        --color-warning-700: #b54708;
        --color-warning-900: #7a2e0e;

        --color-success-50: #e9f5eb;
        --color-success-100: #d9f1db;
        --color-success-300: #7dcb87;
        --color-success-500: #29a845;
        --color-success-700: #176229;
        --color-success-900: #0b3216;

        --color-yellow-50: #fdf6e2;
        --color-yellow-100: #fbebc9;
        --color-yellow-300: #f1cc8e;
        --color-yellow-500: #d58f4f;
        --color-yellow-700: #b26747;
        --color-yellow-900: #59301e;

        --color-brown-50: #fcfbf8;
        --color-brown-100: #f6f4f0;
        --color-brown-300: #e8e3da;
        --color-brown-500: #bbaa8e;
        --color-brown-700: #937b5b;
        --color-brown-900: #564538;

        --color-background: #fafaf9;
        --color-foreground: #171412;
        --color-card: #ffffff;
        --color-popover: #ffffff;
        --color-primary: #171412;
        --color-primary-foreground: #ffffff;
        --color-secondary: #f5f5f4;
        --color-secondary-foreground: #292524;
        --color-muted: #f5f5f4;
        --color-muted-foreground: #79716b;
        --color-accent: #e7e5e4;
        --color-accent-foreground: #292524;
        --color-destructive: #b4324f;
        --color-border: #e7e5e4;
        --color-input: #e7e5e4;
        --color-ring: #a9a29d;
      }

      /* A page that names something living at a URL links it, so a link is house
         furniture rather than something each page restyles. In the base layer, so any
         utility on the anchor still wins: a jump list that reads as plain text, a
         photo credit that stays muted. Color and underline only, never weight or
         size, so a link inside a heading or a table cell keeps the type it sits in. */
      @layer base {
        a {
          color: var(--color-brand-700);
          text-decoration-line: underline;
          text-decoration-color: var(--color-brand-300);
          text-underline-offset: 2px;
        }

        a:hover {
          text-decoration-color: var(--color-brand-600);
        }
      }
      /* skin:end */
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  </head>

  <body class="bg-background font-sans text-foreground antialiased">
    <main class="mx-auto max-w-5xl px-5 py-8 sm:px-8 sm:py-10">
      <!-- Every section below is a slot the shape names. Keep the sections;
           reorder, merge, restyle, and rebuild them freely. The whole page
           should fit one screen at laptop width. Delete this comment block
           and every placeholder before you are done. -->

      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          One-pager
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE SENTENCE: what it is, said so the reader can repeat it to a
          colleague.
        </p>
      </header>

      <section id="problem" class="mt-8">
        <!-- What is wrong or missing today, in the reader's terms, with the
             evidence the prompt gave. Often one column of a band with the
             proposal and the outcome beside it. -->
      </section>

      <section id="proposal" class="mt-8">
        <!-- What would exist or happen, concretely: who, what, how often, where. -->
      </section>

      <section id="why-now" class="mt-8">
        <!-- The window, the forcing event, or the cost of waiting. -->
      </section>

      <section id="costs-returns" class="mt-8">
        <!-- What it takes and what it gives back, in the units the prompt used.
             Nothing the prompt did not give or arithmetic cannot derive. -->
      </section>

      <section id="ask" class="mt-8">
        <!-- The decision needed, from whom, by when. Boxed so it cannot be missed. -->
      </section>

      <section id="risks" class="mt-8">
        <!-- The two to five things most likely to go wrong, each with how it is handled. -->
      </section>

      <section id="next-step" class="mt-8">
        <!-- One line: what happens the week after a yes. -->
      </section>

      <footer class="mt-12 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Provenance: who prepared it, where each figure came from, what is an estimate. -->
      </footer>
    </main>
  </body>
</html>
