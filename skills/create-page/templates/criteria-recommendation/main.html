      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Recommendation with criteria
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: what was being decided, for whom, how many options and
          criteria, and the winner with its score in a sentence.
        </p>
      </header>

      <section id="goal" class="mt-10">
        <!-- The goal: what is being chosen, for whom, and the constraints
             that shaped the criteria. -->
      </section>

      <section id="criteria" class="mt-10">
        <!-- Criteria and weights: each criterion, its weight, and why that
             weight. Weights sum to 100. -->
      </section>

      <section id="scores" class="mt-10">
        <!-- The score grid: every option on every criterion on one stated
             scale, with totals computed from the shown numbers. -->
      </section>

      <section id="winner" class="mt-10">
        <!-- The winner, called out with its total and the criteria it won
             and lost on. -->
      </section>

      <section id="sensitivity" class="mt-10">
        <!-- Sensitivity: which weights would change the answer and to what,
             with recomputed totals. Interaction, if any, is progressive. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: what was read, whose scores these are,
             what is inferred, when. -->
      </footer>
