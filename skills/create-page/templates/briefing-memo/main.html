      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Briefing memo
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <!-- Memo header block: To, From, Date, Re. -->
      </header>

      <section id="bluf" class="mt-10">
        <!-- Bottom line up front: the recommended option, the one reason, and
             the date a decision is needed by, boxed so it is seen first. -->
      </section>

      <section id="context" class="mt-10">
        <!-- What changed, why it is on the desk now, what happens if nothing is decided. -->
      </section>

      <section id="facts" class="mt-10">
        <!-- Key facts: the numbers and constraints the options are judged against, as a tight list. -->
      </section>

      <section id="options" class="mt-10">
        <!-- Two or three options in parallel, the same fields for each:
             what it is, cost, risk, what it forecloses. Mark the recommended one. -->
      </section>

      <section id="recommendation" class="mt-10">
        <!-- Which option, why that one over the others, and the first steps
             with an owner and a date each. -->
      </section>

      <section id="questions" class="mt-10">
        <!-- Open questions, numbered: what would answer each and who owns finding out. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Annex: what was read, what was measured, what is estimated, when figures were seen. -->
      </footer>
