      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          One-pager
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE SENTENCE: what it is, said so the reader can repeat it to a
          colleague.
        </p>
      </header>

      <section id="problem" class="mt-8">
        <!-- What is wrong or missing today, in the reader's terms, with the
             evidence the prompt gave. Often one column of a band with the
             proposal and the outcome beside it. -->
      </section>

      <section id="proposal" class="mt-8">
        <!-- What would exist or happen, concretely: who, what, how often, where. -->
      </section>

      <section id="why-now" class="mt-8">
        <!-- The window, the forcing event, or the cost of waiting. -->
      </section>

      <section id="costs-returns" class="mt-8">
        <!-- What it takes and what it gives back, in the units the prompt used.
             Nothing the prompt did not give or arithmetic cannot derive. -->
      </section>

      <section id="ask" class="mt-8">
        <!-- The decision needed, from whom, by when. Boxed so it cannot be missed. -->
      </section>

      <section id="risks" class="mt-8">
        <!-- The two to five things most likely to go wrong, each with how it is handled. -->
      </section>

      <section id="next-step" class="mt-8">
        <!-- One line: what happens the week after a yes. -->
      </section>

      <footer class="mt-12 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Provenance: who prepared it, where each figure came from, what is an estimate. -->
      </footer>
