      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Checklist
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: what this list is for, when to run it, and who runs it.
        </p>
      </header>

      <section id="context" class="mt-8">
        <!-- Context: what this assumes, how long it takes, and the legend for
             the priority mark. The counter line lives here too; it reads as a
             count of items with scripts off. -->
      </section>

      <section id="groups" class="mt-10">
        <!-- Grouped items: one group per heading in the order the reader meets
             them (by time, by area, by category). Each item is a label with a
             real checkbox and one line of text. -->
      </section>

      <section id="priority" class="mt-10">
        <!-- Priority marks: the mark goes on the few items that cost money,
             cannot be undone, or block the rest. Usually inline in the groups
             above; this slot is for a list of them when the page is long. -->
      </section>

      <section id="tips" class="mt-10">
        <!-- Tips: one line under an item that usually goes wrong, or a column
             of them keyed to the items. Only where earned. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Print footer: what the list was based on, what it assumes, how it
             prints, and that the items are illustrative when they are. -->
      </footer>
