      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Itinerary
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: where, how long, for whom, and the shape of the trip in
          a sentence.
        </p>
      </header>

      <section id="glance" class="mt-10">
        <!-- The trip at a glance: dates or day count, the base, the pace, who it is for. -->
      </section>

      <section id="days" class="mt-10">
        <!-- One block per day with morning, afternoon, and evening. Rests are
             blocks too; travel between cities is its own row. -->
      </section>

      <section id="logistics" class="mt-10">
        <!-- Getting around, what to book ahead and how far ahead, what to carry. -->
      </section>

      <section id="budget" class="mt-10">
        <!-- A rough figure only where the prompt gave one; otherwise what drives the cost. -->
      </section>

      <section id="backups" class="mt-10">
        <!-- Rain, tiredness, a closed place: one swap per day, or one plan for the trip. -->
      </section>

      <section id="places" class="mt-10">
        <!-- Every place on the page once, with what it is and its day. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: what was read, when hours and prices were seen, what is rough. -->
      </footer>
