      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Timeline
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: what span this covers, whose story it is, and why it
          matters now.
        </p>
      </header>

      <section id="scope" class="mt-10">
        <!-- Scope as three checkable facts: the span with its first and last
             date, whose story this is, and why now. -->
      </section>

      <section id="events" class="mt-10">
        <!-- The events, dated, oldest first: a spine, a changelog table, or
             weeks as columns. Group them into era bands when the span has
             chapters, and give every entry one line on what it changed. -->
      </section>

      <section id="turning-points" class="mt-10">
        <!-- The two to four moments after which things were different. Usually
             callouts on the spine itself; a separate list only when the
             events are a table or a grid. -->
      </section>

      <section id="now" class="mt-10">
        <!-- Where we are now: the marker on the spine, what holds today, and
             what is already on the calendar, labeled as scheduled. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: what was read, which dates are scheduled
             rather than passed, what is inferred, and when this was written. -->
      </footer>
