      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          How-to guide
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: what the reader will have at the end, who this is
          written for, and the one thing to know before starting.
        </p>
      </header>

      <section id="goal" class="mt-10">
        <!-- The goal, stated so it can be judged: time, cost, difficulty,
             and what "done" looks like, visible without scrolling. -->
      </section>

      <section id="before" class="mt-10">
        <!-- Tools, materials, access, and facts to have in hand, grouped for
             one trip. Include the check that says this guide fits their case.
             A stop-and-get-help condition goes here, before the first step. -->
      </section>

      <section id="steps" class="mt-10">
        <!-- Numbered steps. Each: an action line, a paragraph, a time chip,
             and the console, settings, or script it needs. Pitfalls sit
             inline at the step where they happen. -->
      </section>

      <section id="pitfalls" class="mt-10">
        <!-- Only pitfalls that span steps. Delete when every one sits inline. -->
      </section>

      <section id="variations" class="mt-10">
        <!-- What changes when the reader's situation differs, keyed to the
             step it alters. -->
      </section>

      <section id="done" class="mt-10">
        <!-- You are done when: observable results as real checkboxes. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: what was read, which version or model
             the steps assume, whether the procedure was run. -->
      </footer>
