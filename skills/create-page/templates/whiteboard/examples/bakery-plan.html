      /* The one look every idea shares: Studio's theme as Tailwind tokens, plus
         the one element these pages style directly, the link.
         A starter inlines this block verbatim inside its <style type="text/tailwindcss">,
         and scripts/check-ideas.ts fails when a starter's copy has drifted.
         `static` matters: without it Tailwind emits only the variables some utility

         nothing and the fill falls back to black. */
      @import "tailwindcss";

      /* Every color is `light-dark(light, dark)`, so the reader's setting picks the
         theme and a page is never written for one of them.

         A step on a ramp names distance from the paper rather than a lightness: 25 is
         the faintest wash the page can carry and 950 its darkest ink, and what
         changes between themes is which end of the spectrum each of those lands on.
         The saturated middle, 400 through 600, is written as one value because it
         holds still in both. That is also the whole rule for white: it rides the
         middle and nowhere else, because every other step moves out from under it.

         scripts/check-contrast.ts reads this file for both palettes and every page
         for what sits on what, so a page that fails in one theme fails the build. */

        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Roboto Serif", ui-serif, Georgia, serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);

        /* On dark the hairline is what draws a card, so it turns from ink to light
           while the cast shadow deepens. */
        --shadow-sm:
          0 2px 4px 0 light-dark(rgb(10 13 18 / 0.04), rgb(0 0 0 / 0.4)),
          0 1px 2px -1px light-dark(rgb(10 13 18 / 0.06), rgb(0 0 0 / 0.5)),

        --shadow-xl:

          0 6px 10px -6px light-dark(rgb(10 13 18 / 0.07), rgb(0 0 0 / 0.5)),
          0 0 0 1px light-dark(rgb(10 13 18 / 0.06), rgb(255 255 255 / 0.08));

      /* A page that names something living at a URL links it, so a link is house
         furniture rather than something each page restyles. In the base layer, so any
         utility on the anchor still wins: a jump list that reads as plain text, a
         photo credit that stays muted. Color and underline only, never weight or
         size, so a link inside a heading or a table cell keeps the type it sits in. */
      @layer base {
        /* What makes light-dark() resolve, and what tells the browser to draw
           scrollbars, form controls and the canvas to match. */
        :root {
          color-scheme: light dark;
        }

        a {
          color: var(--color-brand-700);
          text-decoration-line: underline;
          text-decoration-color: color-mix(
            in oklab,
            var(--color-brand-700) 40%,
            transparent
          );
          text-underline-offset: 2px;
        }

        a:hover {
          text-decoration-color: color-mix(
            in oklab,
            var(--color-brand-700) 70%,
            transparent
          );
        }

        /* A block that sets its own ink — a solid brand banner, an inverted panel, a
           code listing — has already chosen what reads on it, so a link inside takes
           that ink and keeps only its underline. Otherwise the one link in a verdict
           banner is brand on brand, which is the color nobody can read. */
        .text-white a,
        .text-background a,
        .text-code-foreground a {
          color: inherit;
          text-decoration-color: color-mix(in oklab, currentColor 45%, transparent);
        }
      }

      /* Paper has one theme. Pinning the scheme here rather than restating the
         palette means a page printed from a dark desktop comes out on white, with no
         second set of colors to keep in step. */
      @media print {
        :root {
          color-scheme: only light;
        }
      }

    <style>
      /* Page behavior every template gets. Nothing here is decoration a reader

      /* A footnote marker reaches its note and the note reaches its marker, so
         whichever end is jumped to lights up rather than leaving the reader to
         find it. */
      [id^="fn-"]:target,
      [id^="fnref-"]:target {

        border-radius: 3px;
        box-shadow: 0 0 0 3px var(--color-brand-50);

      [id^="fn-"],

      /* A link wears the icon of the site it goes to, so a reader can see where
         it lands before clicking. The square is reserved whether or not an icon
         arrives, so a line does not reflow when one does. */
      .site-icon {
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        margin-right: 0.3em;
        vertical-align: -0.05em;
        border-radius: 2px;
        background: var(--color-gray-100);
        box-shadow: 0 0 0 1px var(--color-gray-200);
      }

      /* A line may break between an image and the text beside it, which leaves
         the icon alone at the end of a line reading as a word gone missing. The
         icon and the first word of its link travel as one. */
      .site-icon-word {
        white-space: nowrap;
      }

        @page {

        }

      <script type="module">
        const scene = JSON.parse(document.querySelector("#scene").textContent);
        const elements = scene.elements.filter((e) => !e.isDeleted);
        const files = scene.files ?? {};

        // --- the sketch: nothing loaded, nothing fetched ------------------------
        // Enough of Excalidraw's element types to show any board this template
        // writes. Not hand-drawn, since that would need a library; a reader who
        // sees this for more than a moment is a reader with no network.
        const esc = (s) => s.replace(/[<&]/g, (c) => (c === "<" ? "&lt;" : "&amp;"));
        const dash = (e) => (e.strokeStyle === "dashed" ? ' stroke-dasharray="8 6"' : "");
        const paint = (e, fill = e.backgroundColor) =>
          ` fill="${fill && fill !== "transparent" ? fill : "none"}" stroke="${e.strokeColor || "#1e1e1e"}" stroke-width="${e.strokeWidth || 2}"${dash(e)}`;
        const words = (e, x, y, anchor) =>
          e.text.split("\n").map((line, i) =>
            `<text x="${x}" y="${y + i * e.fontSize * 1.25}" text-anchor="${anchor}" font-size="${e.fontSize}" fill="${e.strokeColor || "#1e1e1e"}">${esc(line)}</text>`).join("");
        const byId = new Map(elements.map((e) => [e.id, e]));
        const piece = (e) => {
          const { x, y, width: w, height: h } = e;
          switch (e.type) {
            case "rectangle":
              return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${e.roundness ? 12 : 0}"${paint(e)}/>`;
            case "ellipse":
              return `<ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}"${paint(e)}/>`;
            case "diamond":
              return `<polygon points="${x + w / 2},${y} ${x + w},${y + h / 2} ${x + w / 2},${y + h} ${x},${y + h / 2}"${paint(e)}/>`;
            case "frame":
              return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 5"/>` +
                `<text x="${x}" y="${y - 8}" font-size="14" fill="#888">${esc(e.name || "")}</text>`;
            case "image":
              return files[e.fileId] ? `<image href="${files[e.fileId].dataURL}" x="${x}" y="${y}" width="${w}" height="${h}"/>` : "";
            case "freedraw":
            case "line":
            case "arrow": {
              const pts = e.points.map(([px, py]) => [x + px, y + py]);
              let out = `<polyline points="${pts.map((p) => p.join(",")).join(" ")}"${paint(e, "transparent")} stroke-linecap="round" stroke-linejoin="round"/>`;
              if (e.type === "arrow" && e.endArrowhead !== null) {
                const [[hx, hy], [tx, ty]] = [pts[pts.length - 2], pts[pts.length - 1]];
                const a = Math.atan2(ty - hy, tx - hx);
                for (const s of [1, -1]) {
                  out += `<line x1="${tx}" y1="${ty}" x2="${tx - Math.cos(a + s * 0.45) * 13}" y2="${ty - Math.sin(a + s * 0.45) * 13}"${paint(e, "transparent")} stroke-linecap="round"/>`;
                }
              }
              return out;
            }
            case "text": {
              const host = e.containerId && byId.get(e.containerId);
              if (host && host.type !== "arrow" && host.type !== "line") {
                const lines = e.text.split("\n").length;
                return words(e, host.x + host.width / 2, host.y + host.height / 2 - ((lines - 1) * e.fontSize * 1.25) / 2 + e.fontSize * 0.35, "middle");
              }
              return words(e, x, y + e.fontSize, "start");
            }
            default:
              return "";
          }
        };
        const xs = elements.flatMap((e) => [e.x, e.x + e.width]);
        const ys = elements.flatMap((e) => [e.y, e.y + e.height]);
        const [x0, y0, x1, y1] = [Math.min(...xs) - 60, Math.min(...ys) - 60, Math.max(...xs) + 60, Math.max(...ys) + 60];
        const sketch = document.querySelector("#sketch");
        sketch.innerHTML =
          `<svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" preserveAspectRatio="xMidYMid meet">` +
          `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="${scene.appState?.viewBackgroundColor || "#ffffff"}"/>` +
          elements.map(piece).join("") + "</svg>";

        // --- which theme the page settled on -------------------------------------
        // Ask a resolved color, never matchMedia: the page's scheme is whatever
        // `light-dark()` chose, and a viewer that pins `color-scheme: only light`
        // leaves the media query still reporting the desktop's dark.
        const probe = document.createElement("div");
        probe.style.cssText = "position:absolute;visibility:hidden;color:light-dark(#000,#fff)";
        document.body.appendChild(probe);
        const theme = () => (getComputedStyle(probe).color === "rgb(255, 255, 255)" ? "dark" : "light");
        // Excalidraw's own dark mode is this filter over a light canvas.
        const tint = () => (sketch.style.filter = theme() === "dark" ? "invert(93%) hue-rotate(180deg)" : "");
        tint();

        // --- the editor -------------------------------------------------------------
        // 1.2 MB, which the board earns because the board is the page. Fonts and
        // locales are fetched relative to the asset path, so it is set before the
        // module is asked for. One React through the whole graph, or none of it
        // mounts: that is what `?deps=` is for.
        window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/";
        try {
          const React = await import("https://esm.sh/react@19.2.5");
          const { createRoot } = await import("https://esm.sh/react-dom@19.2.5/client");
          const { Excalidraw } = await import("https://esm.sh/@excalidraw/excalidraw@0.18.1?deps=react@19.2.5,react-dom@19.2.5");
          createRoot(document.querySelector("#editor")).render(
            React.createElement(Excalidraw, {
              initialData: { elements, appState: scene.appState, files },
              theme: theme(),
              excalidrawAPI: (api) => {
                // The scene lands a tick after the editor does. Fit the whole
                // board to the window once it has, then let the sketch go.
                let polls = 0;
                const settle = () => {
                  const drawn = api.getSceneElements();
                  if (!drawn.length && polls++ < 600) return requestAnimationFrame(settle);
                  api.scrollToContent(drawn, { fitToContent: true, animate: false });
                  sketch.remove();
                };
                requestAnimationFrame(settle);
                window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
                  api.updateScene({ appState: { theme: theme() } });
                });
              },
            }),
          );
        } catch {
          // The sketch stays, and the page is the board it was written as.
        }
      </script>
    </main>

    <!-- The page as written, kept for the share widget before any script has
         changed it. A page's own scripts are modules, and Tailwind is deferred,
         so both run after this and a shared copy carries the markup rather than
         what a script drew on it. -->
    <script>
      {
        // A script that failed while the page was still parsing has already
        // marked the root as shown; a copy starts held back, like the file.
        const page = document.documentElement.cloneNode(true);
        page.classList.remove("instrument-ready");
        window.__instrumentSource = "<!doctype html>\n" + page.outerHTML;
      }

      // Progressive: with scripts off, or offline, every link reads exactly as
      // it does now and nothing shifts. Only the origin is ever sent, never the
      // path, so a link's query string is not handed over to draw an icon.
      // Waits for the page's module scripts, so a link one of them draws gets
      // its icon like any other.
      const decorate = () => {
        const ABSENT = 16; // The service answers an unknown host with its own 16px globe.
        for (const link of document.querySelectorAll('a[href^="https://"]')) {
          const icon = document.createElement("img");
          icon.alt = "";
          icon.className = "site-icon";
          icon.src =
            "https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&size=64&url=" +
            encodeURIComponent(new URL(link.href).origin);

          // A line may break between an image and the text beside it, so the icon
          // and the first word it leads go in a span that cannot break. A link
          // with no text of its own takes the icon at the front of the link.
          const walker = document.createTreeWalker(link, NodeFilter.SHOW_TEXT);
          let text = walker.nextNode();
          while (text && !text.data.trim()) text = walker.nextNode();
          let host = link;
          if (text) {
            const at = text.data.search(/\S/);
            const word = at > 0 ? text.splitText(at) : text;
            const space = word.data.search(/\s/);
            if (space > 0) word.splitText(space); // The rest of the text stays put.
            host = document.createElement("span");
            host.className = "site-icon-word";
            word.replaceWith(host);
            host.append(word);
          }

          const drop = () => {
            icon.remove();
            if (host !== link) host.replaceWith(...host.childNodes);
          };
          icon.onerror = drop;
          icon.onload = () => {
            if (icon.naturalWidth <= ABSENT) drop();
          };
          host.prepend(icon);
        }
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", decorate, { once: true });
      } else {
        decorate();
      }
    </script>
