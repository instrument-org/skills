      <header>
        <p class="text-xs font-medium tracking-[0.12em] text-brand-700 uppercase">
          Data explorer &middot; HOW MANY ROWS &middot; WHAT SPAN
        </p>
        <h1 class="mt-2 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 font-serif text-[17px] leading-8 text-muted-foreground">
          ONE PARAGRAPH: what this dataset counts, where it came from, when it
          was read, and what the reader can do with it on this page.
        </p>
      </header>

      <section id="glance" class="mt-9">
        <!-- Four or five figures that size the set: how many, the extremes, the
             one that is surprising. Generate them from the data so they cannot
             drift from the rows. -->
      </section>

      <section id="shape" class="mt-12">
        <!-- Optional, and first when it is the finding: the view that only this
             data has. Place gets a map whose container holds the list of places;
             time gets a chart on a shared axis. Skip it entirely when position
             and time say nothing. -->
      </section>

      <section id="charts" class="mt-12">
        <!-- Two or three views of the same rows, each with the same numbers as a
             table or list directly beneath it. -->
      </section>

      <section id="findings" class="mt-12">
        <!-- Two to four sentences a reader could check against the grid. At
             least one about the dataset rather than its subject: why it looks
             the way it does, what is missing, what the collection distorts. -->
      </section>

      <section id="summarize" class="mt-12">
        <!-- Break it down: a dimension and a measure the reader picks, answered
             in the page. Print the query it built; never ask for one. -->
      </section>

      <section id="grid" class="mt-12">
        <!-- Every row. Sortable, filter under each heading, columns that hide,
             a live count, and a way to take the result away. A plain table of
             the most interesting rows renders first and is replaced. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Method: where the rows came from and how to fetch them again, when
             they were read, what was excluded and why, what is measurement and
             what is metadata, and what this data cannot answer. -->
      </footer>
