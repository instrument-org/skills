      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Scorecard
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: what is being graded, for whom, against what bar, and
          the overall grade in a sentence.
        </p>
      </header>

      <section id="grade" class="mt-10">
        <!-- The overall grade as the biggest thing on the page: a letter, a
             number, or a score out of N, with the scale named and one line on
             what it means for the reader's decision. -->
      </section>

      <section id="dimensions" class="mt-10">
        <!-- One row, dial, or segment per dimension, each with its score on the
             same scale as the overall. Order by what matters most to the
             reader. -->
      </section>

      <section id="evidence" class="mt-10">
        <!-- The evidence behind each score: a line under each dimension, or a
             compact ledger here when the scores are shown as a strip. Merge
             into #dimensions when the lines sit under the scores. -->
      </section>

      <section id="strengths" class="mt-10">
        <!-- Strengths and weaknesses, side by side, each specific enough to
             check. Three to five per column; never pad. -->
      </section>

      <section id="comparables" class="mt-10">
        <!-- How it stacks against two or three peers on the same scale: a
             strip, a small table, or one row per peer, with the subject first. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: what was read, tested, or measured, what is
             inferred, and when the figures were seen. -->
      </footer>
