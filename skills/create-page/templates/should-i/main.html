      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Should I…?
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          THE QUESTION, AS THE READER WOULD SAY IT
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: what was asked, the constraints that shape the answer,
          and the short answer in a sentence.
        </p>
      </header>

      <section id="question" class="mt-10">
        <!-- The question restated: what the reader gave, and what the answer had
             to assume. Often merged into the header. -->
      </section>

      <section id="answer" class="mt-10">
        <!-- The short answer: yes, no, or it depends, in a badge in the tone it
             earns, with one sentence that says why and one that names what would
             flip it. Visible without scrolling. -->
      </section>

      <section id="factors" class="mt-10">
        <!-- Three to five factors it depends on, each a condition the reader can
             check their own case against. -->
      </section>

      <section id="situations" class="mt-10">
        <!-- By situation: "if you are… then…", each with its own short answer. -->
      </section>

      <section id="risks" class="mt-10">
        <!-- What goes wrong when the reader's case differs, and what cannot be
             undone. -->
      </section>

      <section id="next" class="mt-10">
        <!-- The one thing to do this week, what it costs, and what would reopen
             the question. -->
      </section>

      <section id="faq" class="mt-10">
        <!-- Three to five questions people ask, answered in a sentence or two
             each. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: what the numbers rest on, what was assumed,
             when rates and prices were seen. -->
      </footer>
