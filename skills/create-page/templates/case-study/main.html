      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          Case study
        </p>
        <h1 class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">
          TITLE
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE PARAGRAPH: who the story is about, what they set out to do, and
          how it ended, in a sentence each.
        </p>
      </header>

      <section id="context" class="mt-10">
        <!-- Who they were and what they had: people, revenue, volume, stack,
             whatever the story turns on. -->
      </section>

      <section id="challenge" class="mt-10">
        <!-- What was hard, and why it had not been solved already. -->
      </section>

      <section id="approach" class="mt-10">
        <!-- What they did, in the order they did it, setbacks included.
             Pull quotes carry a role, never a bare name. -->
      </section>

      <section id="results" class="mt-10">
        <!-- What changed. Only the figures the story supplies, each with its
             caveat beside it; words where there is no figure. -->
      </section>

      <section id="lessons" class="mt-10">
        <!-- What they would tell someone starting the same thing, including
             what they would do differently. -->
      </section>

      <section id="apply" class="mt-10">
        <!-- When this transfers to the reader's situation and when it does
             not, and the first step for someone whose situation matches. -->
      </section>

      <footer class="mt-14 border-t border-border pt-6 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: where the story came from, what is
             quoted, what is reconstructed, what is inferred. -->
      </footer>
