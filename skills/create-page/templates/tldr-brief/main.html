      <header>
        <p class="text-xs font-medium tracking-[0.14em] text-brand-700 uppercase">
          TLDR brief
        </p>
        <h1 class="mt-3 text-3xl font-semibold leading-[1.15] tracking-[-0.03em] sm:text-4xl">
          THE VERDICT, AS A SENTENCE THE READER CAN REPEAT
        </h1>
        <p class="mt-4 text-base leading-7 text-muted-foreground">
          ONE LINE: who this is for, how long it takes to read, where the long
          version lives.
        </p>
      </header>

      <section id="bullets" class="mt-10">
        <!-- Five to seven bullets, each with a bold lead-in, one fact, and
             its consequence for this reader. Order by what changes the
             decision most. -->
      </section>

      <section id="figure" class="mt-10">
        <!-- At most one chart or table, small, only when it says something
             the bullets cannot. Delete the section when nothing does. -->
      </section>

      <section id="do-dont" class="mt-10">
        <!-- Do and do not, side by side, the same length, imperative. -->
      </section>

      <section id="go-deeper" class="mt-10">
        <!-- Three to five links, each with a clause on what it is good for. -->
      </section>

      <footer class="mt-12 border-t border-border pt-5 text-xs leading-6 text-muted-foreground">
        <!-- Sources and provenance: what was read, what is inferred, when. -->
      </footer>
