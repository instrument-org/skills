    <!-- shell:note The page is drawn from its first frame: the compiled floor
         sheet below styles it before any script runs. What is left to arrive
         is the type, and a page shown before it lands rewraps every line the
         moment it does. So a script holds the page back until its fonts are
         in, a second at most. The hold is set by that script and never by
         the stylesheet alone, because whatever takes a picture of a file
         without running it (the Finder's and Quick Look's previews, the app's
         own thumbnails) would otherwise picture a blank sheet: a page hidden
         in CSS and shown by a script is a page those never see. Only the
         ground is drawn meanwhile, the paper's own color in the reader's
         theme, so a dark reader is not shown a white window first. -->
    <style>
      html {
        color-scheme: light dark;
        /* The skin's page tokens, before the stylesheet is in. */
        background: light-dark(#fafaf9, #141210);
      }
      html.instrument-wait {
        visibility: hidden;
        /* A floor that needs no script, should the one that lifts it fail. */
        animation: instrument-floor 0s 1s forwards;
      }
      @keyframes instrument-floor {
        to {
          visibility: visible;
        }
      }
      /* A theme the reader chose over their system's, written on the root by
         the share widget's button or by whatever is showing the page. One
         property does it, because every color in the skin is light-dark().
         Absent, the page follows the system. Here rather than in the skin so it
         holds from the first frame, before the stylesheet is compiled. */
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
    </style>
    <script>
      (function () {
        const root = document.documentElement;
        const show = () => {
          root.classList.remove("instrument-wait");
          if (root.classList.length === 0) root.removeAttribute("class");
        };
        root.classList.add("instrument-wait");
        addEventListener("DOMContentLoaded", () => {
          // Laid out first, so every face the page uses has been asked for
          // and the fonts' promise waits on all of them.
          void document.body.offsetHeight;
          document.fonts.ready.then(show, show);
        });
      })();
    </script>
    <!-- shell:note The theme contract, in the head so a remembered choice is on
         the root before anything paints. `data-theme` on <html> is the whole
         switch. `window.__instrumentTheme` is the one way to write it, so the
         store key and the event live in a single place: the share widget draws
         the button and calls it, and a viewer may do the same. `instrument:theme`
         on document is what a script that resolved its own colors listens for,
         and it fires for a system change as well as a chosen one, so a page has
         one thing to hear. Any tool that pins a page to a theme, as capture does
         and as printing does, pins with !important, because the attribute's
         rule outranks a bare root. -->
    <script>
      // The theme the page shows, and the reader's say in it. `data-theme` on
      // the root overrides the system; nothing set means follow it. The choice
      // is remembered per origin, which for a file opened from disk is whatever
      // the browser makes of file URLs, and a frame with no origin refuses
      // storage outright, so the store is asked and never relied on.
      (function () {
        const root = document.documentElement;
        const KEY = "instrument:theme";
        const remember = (choice) => {
          try {
            if (choice) localStorage.setItem(KEY, choice);
            else localStorage.removeItem(KEY);
          } catch {}
        };
        // What the page resolves to, read from the root's own scheme rather than
        // the media query, so a viewer that pinned the page light is answered
        // correctly under a dark desktop.
        const theme = () => {
          const scheme = getComputedStyle(root).colorScheme;
          if (!scheme.includes("dark")) return "light";
          if (!scheme.includes("light")) return "dark";
          return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        };
        const announce = () => {
          document.dispatchEvent(new CustomEvent("instrument:theme", { detail: theme() }));
        };
        // Called with "light" or "dark" to choose, with null to follow the system
        // again, and with nothing to ask what the page shows.
        window.__instrumentTheme = (choice) => {
          if (choice !== undefined) {
            if (choice) root.dataset.theme = choice;
            else delete root.dataset.theme;
            remember(choice);
            announce();
          }
          return theme();
        };
        try {
          const kept = localStorage.getItem(KEY);
          if (kept === "light" || kept === "dark") root.dataset.theme = kept;
        } catch {}
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
          if (!root.dataset.theme) announce();
        });
      })();
    </script>

         changes between themes is which end of the spectrum each of those lands on.
         The saturated middle, 400 through 600, is written as one value because it
         holds still in both. That is also the whole rule for white: it rides the

      /* A page that names something living at a URL links it, so a link is house
         furniture rather than something each page restyles. In the base layer, so any
         utility on the anchor still wins: a jump list that reads as plain text, a
         photo credit that stays muted. Color and underline only, never weight or
         size, so a link inside a heading or a table cell keeps the type it sits in. */
      @layer base {
        /* What makes light-dark() resolve, and what tells the browser to draw
           scrollbars, form controls and the canvas to match. */
        :root {
          color-scheme: light dark;
        }

        a {
          color: var(--color-brand-700);
          text-decoration-line: underline;
          text-decoration-color: color-mix(
            in oklab,
            var(--color-brand-700) 40%,
            transparent
          );
          text-underline-offset: 2px;
        }

        a:hover {
          text-decoration-color: color-mix(
            in oklab,
            var(--color-brand-700) 70%,
            transparent
          );
        }

        /* A block that sets its own ink — a solid brand banner, an inverted panel, a
           code listing — has already chosen what reads on it, so a link inside takes
           that ink and keeps only its underline. Otherwise the one link in a verdict
           banner is brand on brand, which is the color nobody can read. */
        .text-white a,
        .text-background a,
        .text-code-foreground a {
          color: inherit;
          text-decoration-color: color-mix(in oklab, currentColor 45%, transparent);

      }

      .site-icon-word {

        delete page.dataset.theme;
        // The hold while the fonts load belongs to this visit, not the file.
        page.classList.remove("instrument-wait");
        if (page.classList.length === 0) page.removeAttribute("class");
        window.__instrumentSource = "<!doctype html>\n" + page.outerHTML;
      }

      // Progressive: with scripts off, or offline, every link reads exactly as
      // it does now and nothing shifts. Only the origin is ever sent, never the
      // path, so a link's query string is not handed over to draw an icon.
      // Waits for the page's module scripts, so a link one of them draws gets
      // its icon like any other.
      const decorate = () => {
        const ABSENT = 16; // The service answers an unknown host with its own 16px globe.
        // The credit carries the mark already; a second glyph beside it reads
        // as a rendering fault rather than as provenance.
        for (const link of document.querySelectorAll(
          'a[href^="https://"]:not(.instrument-credit)',
        )) {
          const icon = document.createElement("img");
          icon.alt = "";
          icon.className = "site-icon";
          icon.src =
            "https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&size=64&url=" +
            encodeURIComponent(new URL(link.href).origin);

          // A line may break between an image and the text beside it, so the icon
          // and the first word it leads go in a span that cannot break. A link
          // with no text of its own takes the icon at the front of the link.
          const walker = document.createTreeWalker(link, NodeFilter.SHOW_TEXT);
          let text = walker.nextNode();
          while (text && !text.data.trim()) text = walker.nextNode();
          let host = link;
          if (text) {
            const at = text.data.search(/\S/);
            const word = at > 0 ? text.splitText(at) : text;
            const space = word.data.search(/\s/);
            if (space > 0) word.splitText(space); // The rest of the text stays put.
            host = document.createElement("span");
            host.className = "site-icon-word";
            word.replaceWith(host);
            host.append(word);
          }

          const drop = () => {
            icon.remove();
            if (host !== link) host.replaceWith(...host.childNodes);
          };
          icon.onerror = drop;
          icon.onload = () => {
            if (icon.naturalWidth <= ABSENT) drop();
          };
          host.prepend(icon);
        }
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", decorate, { once: true });
      } else {
        decorate();
      }
    </script>
    <!-- shell:end -->
  </body>
</html>
