description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
    # pnpm-workspace.yaml included so allowBuilds/ignoredOptionalDependencies
    # changes bust the cache (setup-node only hashes pnpm-lock.yaml by default).
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml
        node-version: "24"
    # pnpm decides a github: dep's clone URL with a network probe at resolve
    # time and falls back to SSH when it fails, so any re-resolution can drop a
    # git+ssh URL into the lockfile. Runners have no key and every git dep here
    # is a public repo, so send those clones over anonymous HTTPS.
    - run: |
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      shell: bash
    - run: pnpm install --frozen-lockfile
      shell: bash
    # SHA should be pinned — run `pnpm update:actions` after merging
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
    - uses: rharkor/caching-for-turbo@75f8ebf4a43d2c60b23bc2a27082cfea94ffdad9 # v2.5.0
  using: composite
