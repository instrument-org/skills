description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    # pnpm-workspace.yaml included so allowBuilds/ignoredOptionalDependencies
    # changes bust the cache (setup-node only hashes pnpm-lock.yaml by default).
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pnpm-workspace.yaml
        node-version: "24"
    - run: pnpm install --frozen-lockfile
      shell: bash
    # SHA should be pinned — run `pnpm update:actions` after merging
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - uses: rharkor/caching-for-turbo@75f8ebf4a43d2c60b23bc2a27082cfea94ffdad9 # v2.5.0
  using: composite
