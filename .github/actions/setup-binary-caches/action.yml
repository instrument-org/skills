description: "Cache binary downloads (Python ML models) to skip re-downloading on repeated runs"
name: "Setup binary caches"
runs:
  steps:
    - name: Cache HuggingFace models
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        key: huggingface-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('skills/local-ml/pyproject.toml') }}
        path: ~/.cache/huggingface
    - name: Cache Whisper models
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        key: whisper-models-${{ runner.os }}-${{ runner.arch }}
        path: ~/.cache/whisper
  using: "composite"
