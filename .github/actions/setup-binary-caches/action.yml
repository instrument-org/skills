description: "Cache binary downloads (Python ML models) to skip re-downloading on repeated runs"
name: "Setup binary caches"
runs:
  steps:
    - name: Cache HuggingFace models
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: huggingface-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('skills/transformers-js/package.json') }}
        path: ~/.cache/huggingface
    - name: Cache Whisper models
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: whisper-models-${{ runner.os }}-${{ runner.arch }}
        path: ~/.cache/whisper
  using: "composite"
