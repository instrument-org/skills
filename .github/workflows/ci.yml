concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.ref }}

env:
  CI: "true"
  DO_NOT_TRACK: "1"
jobs:
  check:
    name: Check and Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-binary-caches
      - uses: ./.github/actions/prepare
      # Reported, not enforced, and ahead of the gate so the annotation lands
      # even when something below it fails. Every correction typos makes is one
      # `pnpm fix:spelling` applies unattended, and nothing downstream of a
      # misspelled word in a skill breaks, so holding types, tests and the skill
      # validators red behind one British spelling costs more than the word does.
      - continue-on-error: true
        name: Spelling
        run: pnpm check:spelling
      - run: pnpm check-and-test:ci

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main
